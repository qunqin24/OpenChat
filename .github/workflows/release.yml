name: Release

# Pushing a version tag publishes that version:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# builds the Docker image for linux/amd64 and linux/arm64, pushes it to the
# GitHub Container Registry as ghcr.io/<owner>/openchat:1.0.0 and :latest, and
# creates the GitHub release: with docs/releases/<tag>.md as its notes when
# that file exists, otherwise with notes from the commits since the last tag.
#
# This is the server's release. The Android app is released on its own tags
# (android-v1.0.0, .github/workflows/android-release.yml), and those releases
# are never marked "latest": GitHub's latest release stays the server's, which
# is what a running server checks for its own updates (api/version.go).
on:
  push:
    # v1.2.3 and v1.2.3-rc.1; not any tag that happens to start with v.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write # the release
  packages: write # the image

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 → 1.2.3 and latest. A pre-release tag (v1.2.3-rc.1) gets its
      # own tag but does not move latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openchat
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The version without its v, as the image tag has it.
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          # One manifest per platform, without the attestation entries that
          # show as "unknown/unknown" on the package page.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Every tag, to find the server release before this one.
          fetch-depth: 0
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/openchat
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # The server tag before this one - for a release, the release before
          # it, past its own candidates: GitHub would otherwise start the list
          # of changes at the newest release, which may be the app's.
          pattern='^v[0-9]'
          [ -z "$prerelease" ] && pattern='^v[0-9][^-]*$'
          previous="$(git -c versionsort.suffix=- tag --list --sort=v:refname | grep -E "$pattern|^$TAG\$" | awk -v tag="$TAG" '$0 == tag { print last; exit } { last = $0 }')"
          since=""
          if [ -n "$previous" ]; then since="--notes-start-tag $previous"; fi
          # Written notes for this tag (docs/releases/v1.2.3.md) when there are
          # some - they already say how to pull the image; otherwise GitHub's
          # list of changes since the last tag, under the pull command.
          if [ -f "docs/releases/$TAG.md" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "docs/releases/$TAG.md" $prerelease
          else
            notes="$(printf 'Docker image:\n\n```\ndocker pull %s:%s\n```\n' "$image" "${TAG#v}")"
            gh release create "$TAG" --title "$TAG" --generate-notes $since --notes "$notes" $prerelease
          fi
