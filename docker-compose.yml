name: openchat

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openchat
      POSTGRES_PASSWORD: openchat
      POSTGRES_DB: openchat
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18/…
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openchat -d openchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible blob storage for attachments. Console at http://localhost:9001
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openchat
      MINIO_ROOT_PASSWORD: openchat-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket the API expects, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 openchat openchat-secret &&
      mc mb --ignore-existing local/openchat &&
      echo 'bucket ready'
      "

volumes:
  postgres-data:
  minio-data:
