openapi: 3.1.0
info:
  title: OpenChat API
  version: 0.1.0
  description: |
    OpenChat backend contract. This file is the single source of truth:
      - Go server interfaces are generated by oapi-codegen  -> apps/server/internal/api
      - TypeScript types are generated by openapi-typescript -> packages/api-client/src/schema.d.ts
servers:
  - url: /api/v1
# Every operation needs a session cookie unless it says otherwise.
security:
  - sessionCookie: []

tags:
  - name: system
  - name: auth
  - name: admin
  - name: conversations
  - name: messages
  - name: files
  - name: memory
  - name: tasks
  - name: documents

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        "200":
          description: service is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/options:
    get:
      tags: [auth]
      security: []
      summary: What the sign-in pages offer
      description: |
        Public and always there, so the login and register pages know what to
        show before anyone has typed anything: whether to link to registration,
        and whether a new account waits for approval.
      operationId: getAuthOptions
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthOptions" }
        default: { $ref: "#/components/responses/Error" }

  /auth/register:
    post:
      tags: [auth]
      summary: Create an account
      description: |
        Which of three things happens depends on the administrator's switches
        (`SystemSettings.allowRegistration` and `registrationApproval`), except
        for the very first account ever created, which is always an
        administrator, is never pending and is never refused:

        - registration closed: 403 `registration_closed`;
        - open: 201, the account works at once and the session cookie is set;
        - open with approval: 202, the account is pending - it cannot sign in
          until an administrator approves it - and no session is created.

        At most 5 attempts per client address per hour; beyond that, 429
        `register_rate_limited` with a `Retry-After` header (seconds). Every
        attempt counts, successful or not.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: created, session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "202":
          description: created and waiting for an administrator's approval; no session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterPending" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      tags: [auth]
      summary: Start a session
      description: |
        Wrong credentials of every kind (no such account included) are one
        401 `invalid_credentials`. Once the password is right, an account
        waiting for approval is 403 `pending_approval` and a disabled one 403
        `account_disabled`; neither gets a session. Both carry
        `details.admin` (an `AdminContact`) - who to ask - when there is an
        enabled administrator; only someone with the right password sees it.

        Failed attempts are counted: 10 per client address per 15 minutes, and
        5 per client address and identifier per 15 minutes. Beyond either, 429
        `login_rate_limited` with a `Retry-After` header (seconds), before the
        password is looked at. An account is never locked as a whole - only the
        address that failed is slowed down - so no one can lock another person
        out from elsewhere.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: signed in, session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      operationId: logout
      responses:
        "204": { description: signed out, cookie cleared }
        default: { $ref: "#/components/responses/Error" }

  /auth/session:
    get:
      tags: [auth]
      summary: Who the current session belongs to
      operationId: getSession
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "401":
          description: not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /auth/me:
    patch:
      tags: [auth]
      summary: Change your own name or email
      description: |
        Separate from the admin endpoint because the two differ in what they
        may touch: this one cannot reach `role` or `disabled` at all, so a
        self-service form has no path to privilege escalation.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        default: { $ref: "#/components/responses/Error" }

  /auth/passkey/options:
    post:
      tags: [auth]
      summary: Begin signing in with a passkey
      description: |
        A challenge for the browser's passkey prompt (`navigator.credentials.get`
        with `publicKey`). No account is named: the passkey the person picks
        says whose it is. The challenge is good for five minutes and one answer.
        404 when passkeys are off (`AuthOptions.passkeys`).
      operationId: beginPasskeySignIn
      security: []
      responses:
        "200":
          description: the challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyOptions" }
        default: { $ref: "#/components/responses/Error" }

  /auth/passkey:
    post:
      tags: [auth]
      summary: Sign in with a passkey
      description: |
        The browser's answer to `beginPasskeySignIn`. A passkey that is not
        known, or an answer that does not verify, is 401
        `invalid_passkey`; failures are counted per client address like
        password sign-ins (429 `login_rate_limited`). The account is then
        treated as a password sign-in treats it: 403 `pending_approval` or
        `account_disabled`, otherwise a session.
      operationId: passkeySignIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyAnswer" }
      responses:
        "200":
          description: signed in, session cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        default: { $ref: "#/components/responses/Error" }

  /auth/passkeys:
    get:
      tags: [auth]
      summary: Your passkeys
      operationId: listPasskeys
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Passkey" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Add a passkey
      description: |
        The browser's answer to `beginPasskeyRegistration`. 400
        `invalid_passkey` when it does not verify; 404 when passkeys are off.
      operationId: addPasskey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyAnswer" }
      responses:
        "201":
          description: added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        default: { $ref: "#/components/responses/Error" }

  /auth/passkeys/options:
    post:
      tags: [auth]
      summary: Begin adding a passkey
      description: |
        A challenge for the browser's passkey creation
        (`navigator.credentials.create` with `publicKey`), leaving out the
        authenticators already registered. Good for five minutes and one answer.
      operationId: beginPasskeyRegistration
      responses:
        "200":
          description: the challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyOptions" }
        default: { $ref: "#/components/responses/Error" }

  /auth/passkeys/{passkeyId}:
    parameters:
      - name: passkeyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [auth]
      summary: Rename one of your passkeys
      operationId: renamePasskey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenamePasskeyRequest" }
      responses:
        "200":
          description: renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [auth]
      summary: Remove one of your passkeys
      description: It can no longer sign in. 404 for one that is not yours.
      operationId: deletePasskey
      responses:
        "204": { description: removed }
        default: { $ref: "#/components/responses/Error" }

  /auth/password:
    post:
      tags: [auth]
      summary: Change your own password
      description: |
        Requires the current password, which the admin endpoint does not — an
        admin acts on an account they do not own, whereas here the point is to
        prove the person at the keyboard is the account holder.

        Every other session is dropped; the one making the request survives, so
        changing your password does not sign you out of the tab you are in.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: changed, other sessions revoked }
        default: { $ref: "#/components/responses/Error" }

  /admin/dashboard:
    get:
      tags: [admin]
      summary: Operating figures from the usage ledger
      description: |
        What the model requests of a window look like: volume, spend, errors,
        latency and cache use, next to the equal-length window before it, plus
        the trend and the busiest models, channels and users. Buckets are hours
        for `24h` and calendar days otherwise; the window runs up to now and
        starts at the beginning of its first bucket.
      operationId: getAdminDashboard
      parameters:
        - name: range
          in: query
          schema: { $ref: "#/components/schemas/DashboardRange" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /admin/users:
    get:
      tags: [admin]
      summary: List accounts
      operationId: listUsers
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: search
          in: query
          description: Matches against email and name.
          schema: { type: string }
        - name: status
          in: query
          description: |
            Only accounts in one of these states; repeat the parameter for
            several. Absent: all of them. A disabled account is `disabled`
            even if it is also waiting for approval (a rejected sign-up).
          schema:
            type: array
            items: { $ref: "#/components/schemas/UserStatus" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        default: { $ref: "#/components/responses/Error" }

    post:
      tags: [admin]
      summary: Create an account
      description: |
        The account is usable immediately; no invitation or verification step
        exists, and it is never pending, whatever the approval switch says.
        Unlike registration, the role is chosen by the caller rather than
        derived from whether the table is empty, and this works while
        registration is closed - it is how accounts are made then.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /admin/usage-logs:
    get:
      tags: [admin]
      summary: List model requests
      description: |
        One row per request made to a model -- every attempt of a run (a retry
        is its own row, and so is a failure) and every background title -- newest
        first. Cost and prices are those of the moment the request was made.
        Paged by cursor over (created time, id): `nextCursor` of a page is the
        `cursor` of the one after it, and the filters must stay the same from
        one page to the next. The summary covers the whole filtered range, not
        just this page.
      operationId: listUsageLogs
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: model
          in: query
          description: The model id the request asked for.
          schema: { type: string }
        - name: channelId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UsageStatus" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/UsageKind" }
        - name: from
          in: query
          description: Requests started at or after this time.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Requests started before this time (exclusive).
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageLogPage" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channel-types:
    get:
      tags: [admin]
      summary: The vendors a channel can be
      description: |
        Served rather than hardcoded in the form, so the table that fills in a
        default endpoint is the same one the server later reads to decide which
        protocol to speak. Two copies of it would drift, and the failure would
        be a channel talking the wrong protocol to a real endpoint.
      operationId: listChannelTypes
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelTypeInfo" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channels/models/preview:
    post:
      tags: [admin]
      summary: Preview models using an unsaved channel connection
      description: |
        Uses the submitted connection without storing a channel or credential.
        Select models from this response and include them when creating the channel.
      operationId: previewChannelModels
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelConnection" }
      responses:
        "200":
          description: Models advertised by this endpoint, not yet added to the installation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelModelInput" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channels/{channelId}/models:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin]
      summary: The models this channel offers
      operationId: listChannelModels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelModel" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Add a model by hand
      description: |
        For an endpoint that publishes no model list, or omits one it serves.
        Marked `manual`, so a later refresh does not remove it.
      operationId: addChannelModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                modelId: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelModel" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channels/{channelId}/models/refresh:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [admin]
      summary: Ask the endpoint what models it serves
      description: |
        Calls the endpoint's own model list with the stored connection.
        Requires a stored key except for local services such as Ollama.

        Models already present keep their enabled state; models the endpoint
        stopped listing are removed, and `manual` entries are left alone.
      operationId: refreshChannelModels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelModelRefresh" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channels/{channelId}/models/{modelId}:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: modelId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [admin]
      summary: Offer this model, or stop offering it
      operationId: updateChannelModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelModel" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Remove a manually added model
      operationId: deleteChannelModel
      responses:
        "204": { description: removed }
        default: { $ref: "#/components/responses/Error" }

  /admin/catalog:
    get:
      tags: [admin]
      summary: Catalogue freshness
      operationId: getCatalogStatus
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogStatus" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Refresh the catalogue from models.dev
      description: |
        Fetches the upstream file and replaces the snapshot. A failed fetch
        leaves the previous snapshot in place — a stale catalogue is worth more
        than an empty one — and answers 502 rather than 200, because the refresh
        is what failed. The snapshot being served is unchanged, and `GET` on
        this path reports why through `lastError`.
      operationId: refreshCatalog
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogStatus" }
        default: { $ref: "#/components/responses/Error" }

  /admin/catalog/providers:
    get:
      tags: [admin]
      summary: Providers in the catalogue
      description: |
        Every provider models.dev documents, with the number of models it
        carries. Reference metadata: it is what the `providerId` filter on the
        served-models listing is expressed in, and it never adds a model to
        that listing — membership there comes from the channels' own selected
        models.
      operationId: listCatalogProviders
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogProvider" }
        default: { $ref: "#/components/responses/Error" }

  /admin/catalog/models:
    get:
      tags: [admin]
      summary: The models this installation serves
      description: |
        Only models explicitly selected (enabled) within a configured channel.
        Unselected discoveries never appear here. The upstream catalogue is deliberately
        not browsable here: it is a reference work of thousands of models, most
        of which nothing configured can answer with, and it reaches this
        endpoint only as decoration on the rows below.
      operationId: listCatalogModels
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: search
          in: query
          description: Matches against model id, name and family.
          schema: { type: string }
        - name: providerId
          in: query
          schema: { type: string }
        - name: capability
          in: query
          description: Only models with all of these.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [reasoning, toolCall, attachment, structuredOutput]
        - name: enabled
          in: query
          description: Whether at least one channel with this model selected is enabled.
          schema: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogModelPage" }
        default: { $ref: "#/components/responses/Error" }

  /admin/models/{modelId}/settings:
    parameters:
      - { name: modelId, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      summary: Decide how a model is offered
      description: |
        Replaces the operator's settings for a model, whichever channels serve
        it. Every field is sent; null follows the catalogue, so resetting one
        field is sending it as null. The settings are enforced where requests
        are made, not only in the picker: a level not allowed is dropped, a
        model that may not call tools is offered none, an output limit is
        sent with every request, an administrators-only model is neither
        listed for nor answered to anyone else, and a model that has reached
        its spending cap is refused (409 `model_capacity_reached`), before a
        run starts and again before each request inside one.
      operationId: updateModelSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelOverride" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelOverride" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Go back to the catalogue for every setting
      description: |
        Also removes the model's spending cap (and its starting point): a cap is
        one of the operator's settings, and "every setting" includes it. The
        spend stays in the usage log.
      operationId: resetModelSettings
      responses:
        "204": { description: reset }
        default: { $ref: "#/components/responses/Error" }

  /admin/models/{modelId}/capacity/reset:
    parameters:
      - { name: modelId, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      summary: Count a model's total spending cap again from now
      description: |
        Moves the starting point of a `total` cap to now, so the spend counted
        against it is zero again. The usage log is untouched. Saving the model's
        settings does not move the starting point.
      operationId: resetModelCapacity
      responses:
        "204": { description: the count starts again from now }
        default: { $ref: "#/components/responses/Error" }

  /admin/system:
    get:
      tags: [admin]
      summary: Server-wide settings
      operationId: getSystemSettings
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change server-wide settings
      operationId: updateSystemSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSystemSettingsRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSettings" }
        default: { $ref: "#/components/responses/Error" }

  /admin/version:
    get:
      tags: [admin]
      summary: The running version, and the newest release
      description: |
        `current` is the version this server was built as, written into the
        binary from the release tag when the image is built (`dev` for a local
        build); no environment variable changes it. The newest release is read from the project's GitHub releases
        (`/releases/latest`: no drafts, no pre-releases) and kept for six
        hours; past that, this asks again, so opening the page is enough to
        learn of an update. A failed look is not an error of this endpoint: it
        answers with what it knows and `checkError` set.
      operationId: getVersionInfo
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        default: { $ref: "#/components/responses/Error" }

  /admin/version/check:
    post:
      tags: [admin]
      summary: Look for a newer release now
      description: |
        As `getVersionInfo`, without the six hours: the "check for updates"
        button. Looks that follow each other within a minute share one request
        to GitHub.
      operationId: checkForUpdate
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        default: { $ref: "#/components/responses/Error" }

  /admin/moderation:
    get:
      tags: [admin]
      summary: Content moderation settings
      operationId: getModerationSettings
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationSettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change content moderation settings
      description: |
        Read on every message, so a change applies at once. Everything is
        checked before anything is saved (400 `invalid_moderation_*`): a mode
        that needs a key or a model without one is refused, and so is a model
        no channel offers.
      operationId: updateModerationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateModerationSettingsRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationSettings" }
        default: { $ref: "#/components/responses/Error" }

  /admin/moderation/events:
    get:
      tags: [admin]
      summary: The messages content moderation turned away
      description: |
        Newest first, paged by cursor over (created time, id); `nextCursor` of a
        page is the `cursor` of the one after it, and the filters must stay the
        same between pages. Only blocked messages are logged, and for 90 days.
        The excerpt is the start of what was sent: the operator's own record,
        for administrators only.
      operationId: listModerationEvents
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/ModerationCategory" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationEventPage" }
        default: { $ref: "#/components/responses/Error" }

  /admin/subagents:
    get:
      tags: [admin]
      summary: Sub-agent settings
      operationId: getSubagentSettings
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubagentSettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change sub-agent settings
      description: |
        Only the fields present are changed. Read whenever a sub-agent is
        launched or a run is offered the tools, so a change applies from the
        next request.
      operationId: updateSubagentSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSubagentSettingsRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubagentSettings" }
        default: { $ref: "#/components/responses/Error" }

  /admin/authentication/passkeys:
    get:
      tags: [admin]
      summary: Passkey settings
      operationId: getPasskeySettings
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeySettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change passkey settings
      description: |
        Changing the relying party ID makes the passkeys registered under the
        old one unusable: browsers bind a passkey to the domain it was made for.
      operationId: updatePasskeySettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePasskeySettingsRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeySettings" }
        default: { $ref: "#/components/responses/Error" }

  /admin/web-search:
    get:
      tags: [admin]
      summary: Web search settings
      operationId: getWebSearchSettings
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearchSettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change web search settings
      description: Read by every run at its next request, so a change reaches runs in progress.
      operationId: updateWebSearchSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWebSearchSettingsRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearchSettings" }
        default: { $ref: "#/components/responses/Error" }

  /admin/web-search/test:
    post:
      tags: [admin]
      summary: Run one search with the current settings
      description: |
        Searches the way a run would — the same depth, result count,
        compression and blocklist — and reports what came back. A failed search
        is a 200 with `ok: false`: the request worked, the search did not.
      operationId: testWebSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebSearchTestRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearchTestResult" }
        default: { $ref: "#/components/responses/Error" }

  /admin/image-search:
    get:
      tags: [admin]
      summary: Image search settings
      operationId: getImageSearchSettings
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageSearchSettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change image search settings
      description: |
        Runs started after the change are told about it: whether answers
        describe their pictures or give addresses is part of a run's
        instructions.
      operationId: updateImageSearchSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateImageSearchSettingsRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageSearchSettings" }
        default: { $ref: "#/components/responses/Error" }

  /admin/image-search/test:
    post:
      tags: [admin]
      summary: Find one picture with the current settings
      description: |
        Searches the configured services the way an answer's picture is
        searched - without keeping what it finds - and reports the first
        match. A failed search is a 200 with `ok: false`.
      operationId: testImageSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageSearchTestRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageSearchTestResult" }
        default: { $ref: "#/components/responses/Error" }

  /admin/storage:
    get:
      tags: [admin]
      summary: File storage settings
      operationId: getStorageSettings
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageSettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change file storage settings
      description: |
        Takes effect at once, with no restart: new uploads go to the chosen
        driver, and files already stored stay readable from wherever they are.
        The new drivers are built before they replace the old ones; if that
        fails the request is a 400 and nothing is saved.
      operationId: updateStorageSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStorageSettingsRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageSettings" }
        default: { $ref: "#/components/responses/Error" }

  /admin/storage/quota:
    get:
      tags: [admin]
      summary: How much each person may keep in files
      operationId: getStorageQuota
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageQuotaSettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change how much each person may keep in files
      description: |
        The default for every account without a quota of its own
        (`UpdateUserRequest.storageQuotaBytes`). Lowering it below what
        someone keeps deletes nothing: they can upload again once they have
        made room.
      operationId: updateStorageQuota
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageQuotaSettings" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageQuotaSettings" }
        default: { $ref: "#/components/responses/Error" }

  /admin/storage/test:
    post:
      tags: [admin]
      summary: Try a storage configuration without saving it
      description: |
        Merges the body over the stored settings, then writes a small object
        under `probes/` in the chosen driver, reads it back and deletes it. A
        configuration that does not work is a 200 with `ok: false`: the request
        worked, the storage did not.
      operationId: testStorage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStorageSettingsRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageTestResult" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channels:
    get:
      tags: [admin]
      summary: List channels
      operationId: listChannels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Add a channel
      operationId: createChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChannelRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channels/{channelId}:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin]
      summary: Change a channel
      operationId: updateChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateChannelRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Remove a channel
      description: |
        Unlike accounts, a channel owns no user data — deleting one removes a
        connection, not anybody's history. It is therefore a real delete.
      operationId: deleteChannel
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }

  /admin/users/bulk:
    post:
      tags: [admin]
      summary: Apply one change to several accounts
      description: |
        Applied in a single transaction. Accounts the caller may not change are
        reported in `skipped` rather than failing the whole request; a change
        that would leave no enabled admin is refused outright. `updated` of an
        approval counts the accounts that were waiting.
      operationId: bulkUpdateUsers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkUpdateUsersRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkUpdateResult" }
        default: { $ref: "#/components/responses/Error" }

  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin]
      summary: Change an account's role or enabled state
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Delete an account for good
      description: |
        Deletes the account and everything that is only its: sessions,
        conversations and their messages and files, memories, custom
        instructions, scheduled tasks, its picture. Runs it has going are
        stopped. Its requests stay in the usage log - spend and caps are
        counted from it - without an owner, labelled with the name the
        account had (`UsageLog.deletedUser`). Cannot be undone. 409
        `self_delete` for your own account, `last_admin` for the last
        enabled administrator; 404 for an account that is not there.
      operationId: deleteUser
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }

  /conversations:
    get:
      tags: [conversations]
      summary: List conversations
      operationId: listConversations
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: search
          in: query
          description: |
            Only conversations whose title or any message's text contains this,
            ignoring case. A
            conversation found by what was said in it carries `match`. Keep it
            the same while following `nextCursor`.
          schema: { type: string, maxLength: 200 }
        - name: pinned
          in: query
          description: |
            Only the pinned conversations, the latest pinned first, all on one
            page (at most 200). The list without it holds them too, in their
            place by date.
          schema: { type: boolean }
      responses:
        "200":
          description: a page of conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [conversations]
      summary: Create a conversation
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversationRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [conversations]
      summary: Get a conversation
      operationId: getConversation
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [conversations]
      summary: Rename or update a conversation
      operationId: updateConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConversationRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [conversations]
      summary: Delete a conversation
      operationId: deleteConversation
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/trace:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [admin]
      summary: The model requests of one of your conversations, as sent
      description: |
        Administrators only (404 otherwise, and while request traces are off
        in System settings), and only their own conversations: each model request the conversation's runs made -
        the messages, tools and options it carried, what came back - with
        its timing and tokens, oldest first. Recorded for administrators'
        requests only and kept for `retentionDays`; a request older than
        that, or made before recording began, is not listed.
      operationId: getConversationTrace
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationTrace" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/title:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    post:
      tags: [conversations]
      summary: Name a conversation from what it is about
      description: |
        Has the task model (System settings), else the conversation's own
        model, read the conversation's latest exchanges and title it, then
        renames the conversation to that title, replacing whatever it was
        called. Waits for the model. 409 `nothing_to_title` for a conversation
        with no messages; 502 `title_failed` when the model gave no title.
      operationId: generateConversationTitle
      responses:
        "200":
          description: the renamed conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/running:
    get:
      tags: [conversations]
      summary: Which of the caller's conversations are being answered right now
      description: |
        The ids of the caller's conversations with a run in progress, so a
        list can mark the ones still working without following each one's
        event stream. Temporary and deleted conversations are left out, as
        they are from the list. A run waiting for the person's answer is not
        in progress.
      operationId: listRunningConversations
      responses:
        "200":
          description: the conversations with a run in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunningConversations" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/context:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [conversations]
      summary: How much of the model's context window the conversation fills
      description: |
        Read from the conversation's latest answered request: everything it
        was sent, cached or not, plus what it wrote. `usedTokens` is null for a
        conversation nothing has been answered in yet. After a compression
        newer than that request it is an estimate of the compressed context
        (`estimated`). The window it is measured against is the model's
        `contextLimit` (ChatModel).
      operationId: getConversationContext
      responses:
        "200":
          description: the context the latest request used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextUsage" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/compaction:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [conversations]
      summary: The conversation's compressed context
      description: |
        A long conversation is compressed: the part of it that no longer fits
        the model's window is written down as a summary, and the model is sent
        that in place of the messages it covers (see `ContextSummary`). The
        messages themselves are never changed or hidden; the transcript still
        lists all of them, and the summary says where it ends
        (`throughMessageId`). A conversation has at most one summary, and none
        until it was compressed.
      operationId: getCompaction
      responses:
        "200":
          description: the summary, absent when there is none
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompactionState" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [conversations]
      summary: Take back the compression
      description: |
        Deletes the summary. The messages it covered were never removed, so the
        model is sent the whole conversation again. Idempotent. 409
        `conversation_busy` while a run is going. Other followers are told with
        a `compaction_changed` event (without a summary).
      operationId: undoCompaction
      responses:
        "204": { description: the conversation has no summary now }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/subagents:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [conversations]
      summary: The conversation's sub-agents
      description: |
        Every sub-agent (子智能体) the conversation's runs launched, oldest
        first, with the state of its latest run. A sub-agent is a hidden
        conversation of its own; none of the conversation endpoints reach it,
        and nothing a person types reaches its model.
      operationId: listSubagents
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubagentList" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/subagents/{subagentId}:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - { $ref: "#/components/parameters/SubagentId" }
    get:
      tags: [conversations]
      summary: One sub-agent's work, read-only
      description: |
        The sub-agent's transcript - the task, its thinking, its tool steps, its
        reports - oldest first (its latest 500 rows), and the run it has going
        with its live state. There is no way to write to it.
      operationId: getSubagent
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubagentDetail" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/subagents/{subagentId}/stop:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - { $ref: "#/components/parameters/SubagentId" }
    post:
      tags: [conversations]
      summary: Stop a sub-agent
      description: |
        The person stops it. Its run ends cancelled and what it had found is
        reported to the main agent as usual. Stopped by the person, the main
        agent's messages no longer wake it; `resumeSubagent` does. A queued
        one is cancelled: it never starts, and goes.
      operationId: stopSubagent
      responses:
        "202": { description: asked to stop }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/subagents/{subagentId}/resume:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - { $ref: "#/components/parameters/SubagentId" }
    post:
      tags: [conversations]
      summary: Let a stopped sub-agent go on
      description: |
        Starts another run of the sub-agent, which carries on from where it
        was, in the background, and reports again when it is done. Takes no
        text: a person's words reach the sub-agent only through the main agent.
        409 `subagent_busy` while it is working; 429 `too_many_subagents` at
        the limit of sub-agents working at once.
      operationId: resumeSubagent
      responses:
        "202": { description: started }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/subagents/{subagentId}/background:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - { $ref: "#/components/parameters/SubagentId" }
    post:
      tags: [conversations]
      summary: Move a foreground sub-agent to the background
      description: |
        The tool call waiting for it returns at once, telling the main agent
        the work goes on in the background, so the turn ends and the person
        can write again; the report is delivered when it is ready. Idempotent.
      operationId: backgroundSubagent
      responses:
        "202": { description: moved }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/messages:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [messages]
      summary: List messages in a conversation
      description: |
        The transcript is paged from its end: with no `before` the page is the
        conversation's newest rows, and `before` (the previous page's
        `olderCursor`) fetches the page of rows older than it. Within a page
        the items stay in chronological order, oldest first, so a client
        prepends each older page to what it holds. A page without
        `olderCursor` reaches the start of the conversation.
      operationId: listMessages
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: before
          in: query
          description: The `olderCursor` of the page just newer than the one wanted.
          schema: { type: string }
      responses:
        "200":
          description: a page of messages, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [messages]
      summary: Send a message and start a run that answers it
      description: |
        Writes the user message and starts a run in the background, then
        returns at once. The answer is not in this response: it is followed on
        `GET /conversations/{conversationId}/events`, which also serves a reload,
        a second tab or another device — the run does not depend on this
        request staying open, and closing the page does not stop it.

        A conversation runs one thing at a time: while a run is going this
        answers 409 `conversation_busy`. `requestId` makes a retried POST safe —
        the same id finds the run it already started instead of starting a
        second one.

        `attachmentIds` are uploads (`POST /files`) of the caller's that no
        message has claimed. They are refused, before anything is written, with
        400 `too_many_attachments` (more than 10), `attachments_too_large` (over
        20 MiB together), `attachment_unsupported` (the run's model does not
        accept images, or PDFs, per its `inputModalities`) and
        `attachment_unavailable` (not uploaded, already sent, or not the
        caller's).

        A model that has reached its spending cap (see `ModelOverride.capacity`)
        is refused, also before anything is written, with 409
        `model_capacity_reached` — unless the caller is an administrator and the
        cap exempts them. The other ways of starting a run (regenerate, edit,
        answering a question) refuse it the same way.

        An account may have only so many runs going at once across all its
        conversations (`SystemSettings.maxConcurrentRuns`, 3 unless changed;
        administrators are exempt). Past it this is refused, again before
        anything is written, with 429 `too_many_runs`; the same goes for the
        other ways of starting a run. Stopping a run, or its ending, frees the slot.

        With content moderation on (`ModerationSettings.mode`) the text of the
        message and its images are checked first. A message that fails is
        refused before a run is started or a file claimed, with 422
        `content_blocked` and the matched categories in `details.categories` - and, when more blocked
        messages would disable the account, `details.strikesLeft` of them
        within `details.windowHours`. The refused text is kept as a message of
        its own (`status: blocked`, no run, no file claimed): `details.messageId`
        is that message, and the conversation's other followers are told with a
        `transcript_changed` event (no `from`) to fetch their newest page. It is
        shown and never sent to a model. A conversation that is answering right
        now keeps nothing and has no `messageId`. The message that reaches the
        limit disables the account and is answered 401 (its sessions are gone);
        it is kept all the same. When the moderation service cannot be reached and the setting says to
        block, 503 `moderation_unavailable`. A message too large to be checked
        whole - its text past what a check reads (about 400,000 characters; in
        model mode about 190,000), more than six images, or an image bigger than
        a check reads - is refused with 413 `message_too_large_for_moderation`
        whatever that setting says: the size is the sender's, so it is never
        treated as a failure of the service. Nothing is written or kept, and the
        page keeps the text. Editing a message and answering a
        question are checked the same way, but a refusal keeps nothing (except
        the edit of a refused message, which replaces it: see the edit); a
        regeneration re-sends what was already checked.

        While the conversation's last row is a refused message (`status:
        blocked`) it does not go on past it: 409 `revise_refused`, before
        anything is checked, written or counted. The refused message is
        reworded through the edit endpoint, which a page does by sending from a
        composer that has turned into the editor of that message.
      operationId: createMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMessageRequest" }
      responses:
        "202":
          description: the message was written and its run started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateMessageResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/messages/{messageId}/edit:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - name: messageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [messages]
      summary: Ask a question again, reworded
      description: |
        Replaces a question, and everything after it, with the question reworded.
        The message edited and every message after it (answers, tool results and
        the questions that followed) are deleted for good, and the new wording is
        written at the end of what is left as a new user message, which a run
        answers with the model, effort and web choice given, as sending does. It
        sees only the messages before it. Nothing is kept to go back to. The new
        message carries the edited one's files; those of the messages deleted
        with it are removed. Any question can be edited, not only the last.
        409 `conversation_busy` while a run is going; 404 `message_not_found`
        when the message is not a user message of the conversation. The
        conversation's other followers (another tab) are told with a
        `transcript_changed` event in the batch that starts the run.

        A message content moderation refused (`status: blocked`) is edited the
        same way, and this is how a conversation that ends on one goes on
        (sending and regenerating are refused with 409 `revise_refused` until
        then). It has no files, so `attachmentIds` - uploads to claim, as for
        sending - is accepted for it and for no other message (400
        `attachments_not_editable`); the new words and those images are checked
        again. Refused again, the new words take the place of the refused
        message when it is still the last row: it is deleted and the new words
        are written in its place as another refused message, with 422
        `content_blocked` and its id in `details.messageId`, and the other
        followers are told with `transcript_changed` from the old one; if it is
        not the last row nothing changes. A refusal of any other edit keeps
        nothing.
      operationId: editMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditMessageRequest" }
      responses:
        "202":
          description: the new message was written and its run started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateMessageResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/regenerate:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    post:
      tags: [messages]
      summary: Answer the last message again
      description: |
        Deletes the answer to the last user message - every row after it, and
        the runs that made them, those that carried on after a question the
        model asked included - and starts another run on that message, with the
        model, effort and web choice given (else the conversation's, which it
        then remembers, as sending does). The old answer is gone, not kept.
        Followed on the events stream like any run, which also tells the
        conversation's other followers (`transcript_changed`); 409
        `conversation_busy` while one is going, `not_latest` when a message
        was added since the caller looked, 404 `nothing_to_answer` in a
        conversation with no message. 409 `revise_refused` while the last row
        is a refused message (`status: blocked`): that is reworded first.
      operationId: regenerateAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegenerateRequest" }
      responses:
        "202":
          description: the run started; `message` is the input it answers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateMessageResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/tool-calls/{callId}/answer:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - name: callId
        in: path
        required: true
        schema: { type: string, maxLength: 200 }
    post:
      tags: [messages]
      summary: Answer the model's question
      description: |
        The model called `ask_user` and its run stopped there, finished as
        `awaiting_input`, with the call on the transcript and no result. This
        writes the answers as the call's result and starts the run that goes
        on from it, with the model, effort and web choice given, as sending
        does. The new run is part of the same answer: it continues the run
        that asked (`Run.continues`), shares its input and shows under the same
        reply, and is followed on the events stream like any run. The result
        row is announced in the same batch as the run starting.

        Only the question at the end of the transcript can be answered: 409
        `not_pending` for one already answered, one the user wrote past, one
        whose answer was deleted, or a call that is not an `ask_user` waiting
        for its answer. 409 `conversation_busy` while a run is going; 400
        `invalid_answers` when the answers do not fit the questions; 409
        `revise_refused` while a refused message (`status: blocked`) is the last
        row, written after the question: that is reworded first.
      operationId: answerQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerQuestionRequest" }
      responses:
        "202":
          description: the answers were recorded and the run started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerQuestionResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/events:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [messages]
      summary: Follow a conversation's runs
      description: |
        Responds with `text/event-stream`. Each `data:` frame is one JSON
        `ConversationEvent`. The first is a `snapshot` — the active run, the
        messages it has written and its work in flight — and every later frame
        is a `batch` of events to apply on top of it. Everything described was
        committed before it was sent.

        A batch whose `version` is not newer than the snapshot's run version is
        already contained in the snapshot and is dropped. A client that falls
        too far behind is sent a fresh `snapshot` instead of the batches it
        missed; one that reconnects starts from a snapshot. Nothing is replayed.
      operationId: streamConversationEvents
      responses:
        "200":
          description: server-sent event stream of ConversationEvent frames
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/runs/{runId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [messages]
      summary: Stop a run
      description: |
        Asks the run to stop and returns. What was generated is kept; the run
        then finishes as `cancelled`, which the events stream reports.
        Stopping a run that already finished is a no-op.
      operationId: cancelRun
      responses:
        "202": { description: the run was asked to stop }
        default: { $ref: "#/components/responses/Error" }

  /me/avatar:
    put:
      tags: [auth]
      summary: Set your picture
      description: |
        The image itself is the body, with its own `Content-Type`: PNG, JPEG or
        WebP, at most 1 MiB and 4096 pixels on a side. It is decoded here, cut
        to the square at its centre, scaled down to 256 pixels and stored as a
        PNG, so nothing the file carried beyond its picture (metadata, a
        second payload) is kept. 415 `unsupported_file_type` for another type
        or a body that is not the image it says, 413 `file_too_large` over the
        size, 400 `invalid_image` for an image that cannot be read.
      operationId: updateMyAvatar
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [auth]
      summary: Go back to the initial
      operationId: deleteMyAvatar
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        default: { $ref: "#/components/responses/Error" }

  /me/storage:
    get:
      tags: [files]
      summary: How much your files take
      description: |
        What your uploaded files add up to - sent or not yet, in any
        conversation - against how much you may keep. An upload that would go
        past it is refused (413 `storage_quota_exceeded`); deleting files from
        the library makes room.
      operationId: getMyStorage
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyStorage" }
        default: { $ref: "#/components/responses/Error" }

  /me/export:
    get:
      tags: [conversations]
      summary: Download your conversations
      description: |
        Every conversation of yours that is kept (not deleted, not temporary)
        with its messages - the text of what was asked and answered, with the
        names of the files sent, not tool traces. Written as it is read, one conversation at a time, so
        the size of the history does not decide the memory this takes. Always
        the caller's own; there is no way to name another account.
      operationId: exportMyConversations
      responses:
        "200":
          description: a JSON document, offered as a download
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationExport" }
        default: { $ref: "#/components/responses/Error" }

  /me/conversations:
    delete:
      tags: [conversations]
      summary: Delete all your conversations
      description: |
        Deletes (as `deleteConversation` does) every conversation of yours,
        temporary ones included. Only yours: the account is the session's.
      operationId: deleteAllMyConversations
      responses:
        "200":
          description: deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedConversations" }
        default: { $ref: "#/components/responses/Error" }

  /me/personalization:
    get:
      tags: [memory]
      summary: Your custom instructions and memory switch
      operationId: getPersonalization
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Personalization" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [memory]
      summary: Change your custom instructions or memory switch
      description: |
        Only the fields present are changed. New conversations take the change;
        one already running keeps what it began with.

        With content moderation on, a custom-instructions field that changed is
        checked like a message is: 422 `content_blocked` (the same `details`,
        strikes counted and sanctions applied as for a message), and nothing is
        saved; 503 `moderation_unavailable` when the check cannot be made and the
        setting says to block.
      operationId: updatePersonalization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePersonalizationRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Personalization" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/documents:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [documents]
      summary: The writing blocks of a conversation
      description: |
        Every document a model wrote in this conversation, each at its latest
        version, most recently changed first: for reopening one without
        scrolling back to where it was written. 404 for a conversation that
        is not yours.
      operationId: listConversationDocuments
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DocumentSummary" }
        default: { $ref: "#/components/responses/Error" }

  /documents/{documentId}:
    parameters:
      - name: documentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [documents]
      summary: A writing block, with every version of it
      description: |
        A document a model wrote in one of your conversations (the
        `document` tool), oldest version first; the last is what it says
        now. 404 for one that is not yours, or whose conversation is deleted.
      operationId: getDocument
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [documents]
      summary: Save your edit of a writing block
      description: |
        Saves a new version with your title and text. `baseVersion` is the
        version the edit was made on: 409 `version_conflict` when another
        version came since (the model changed it meanwhile), so nothing is
        overwritten unseen. Your text is checked by content moderation when
        a model next reads it, not now.
      operationId: updateDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDocumentRequest" }
      responses:
        "200":
          description: the document, with the new version last
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Error" }

  /tasks:
    get:
      tags: [tasks]
      summary: List your scheduled tasks
      description: |
        Your scheduled tasks, newest first; a task whose conversation you
        deleted goes with it. 404 when an administrator has switched scheduled
        tasks off (System settings).
      operationId: listTasks
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [tasks]
      summary: Schedule a task
      description: |
        Makes the task and its own conversation, named after it, where every
        run goes: at each time the schedule names, `prompt` is sent there as
        your message and answered as if you had sent it. The prompt is checked
        by content moderation as a message is (422 `content_blocked`). 400
        `invalid_schedule` for a schedule that is not one, or a one-off in the
        past; 409 `too_many_tasks` past the limit of tasks still to run.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Error" }

  /tasks/{taskId}:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    patch:
      tags: [tasks]
      summary: Change, pause or resume a task
      description: |
        Only the fields present change. `enabled: false` pauses the task,
        `true` resumes it from the next time its schedule names (a one-off
        whose time has passed cannot be resumed: change its time). The errors
        of `createTask`.
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "200":
          description: the task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [tasks]
      summary: Delete a task
      description: Its conversation, and what it has written there, stays.
      operationId: deleteTask
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }

  /tasks/{taskId}/run:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    post:
      tags: [tasks]
      summary: Run a task now
      description: |
        Sends the prompt to the task's conversation now, as its schedule would,
        without moving its schedule. The errors of `createMessage` (409
        `conversation_busy` while that conversation is answering).
      operationId: runTask
      responses:
        "202":
          description: started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Error" }

  /me/memories:
    get:
      tags: [memory]
      summary: Your memories, oldest first
      description: |
        Always your own: no endpoint, the administrator's included, returns
        anyone else's. The list is capped (`Personalization.memoryLimit`), so it
        is not paged.
      operationId: listMemories
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [memory]
      summary: Write a memory yourself
      description: |
        409 `memory_full` at the cap and `memory_duplicate` for one already there.
        With content moderation on the text is checked like a message is: 422
        `content_blocked` or 503 `moderation_unavailable`, as for the custom
        instructions, and nothing is saved.
      operationId: createMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [memory]
      summary: Delete every memory
      description: Also forgets what the memory log holds about them.
      operationId: clearMemories
      responses:
        "204": { description: cleared }
        default: { $ref: "#/components/responses/Error" }

  /me/memories/{memoryId}:
    parameters:
      - name: memoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [memory]
      summary: Rewrite a memory
      description: The new text is checked by content moderation like a new memory is.
      operationId: updateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [memory]
      summary: Delete a memory
      operationId: deleteMemory
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }

  /me/memory-events:
    get:
      tags: [memory]
      summary: What the model recently changed in your memories
      description: |
        The last thirty days, newest first: the "recently learned" list, and
        what the chat looks up to know whether a change can still be undone.
        Your own edits are not logged.
      operationId: listMemoryEvents
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryEventList" }
        default: { $ref: "#/components/responses/Error" }

  /me/memory-events/{eventId}/undo:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [memory]
      summary: Undo a change the model made
      description: |
        An added memory is removed, an edited one put back, a deleted one
        restored. 409 `memory_changed` when the memory was edited since (the
        edit wins), `already_undone`, `memory_full` or `memory_duplicate` when a
        restore cannot be made.
      operationId: undoMemoryEvent
      responses:
        "200":
          description: undone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryEvent" }
        default: { $ref: "#/components/responses/Error" }

  /features:
    get:
      tags: [messages]
      summary: What the chat can offer right now
      description: |
        Server-wide switches the composer depends on. `webSearch` is whether
        the administrator has web search configured and on, which is when the
        composer offers its web search switch.
      operationId: getChatFeatures
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatFeatures" }
        default: { $ref: "#/components/responses/Error" }

  /favicons/{domain}:
    get:
      tags: [messages]
      summary: A site's icon, for the sources a reply cites
      description: |
        Fetched by the server and cached, so a browser showing a reply's
        sources asks no third party about them. A site with no icon (or an
        icon service that is down) gets a 1×1 transparent PNG, not an error
        status, which the browser would log for every source; the client sees
        an image one pixel wide and draws its own mark.
      operationId: getFavicon
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string, maxLength: 253 }
      responses:
        "200":
          description: The icon.
          content:
            image/*:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/images:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [messages]
      summary: A picture an answer shows, fetched for the reader
      description: |
        Serves an image a reply's interface components show. Only an address
        that appears in one of this conversation's tool results — a page the
        model read, a search it ran — is fetched, so an answer can show what
        its sources hold and nothing it made up. The server fetches it from
        public addresses only and caches it, so the reader's browser asks no
        third party. 404 when the address is not from this conversation or the
        image cannot be had; the client then leaves the picture out.
      operationId: getConversationImage
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: The image.
          content:
            image/*:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /images/search:
    get:
      tags: [messages]
      summary: Find a picture for an answer by what it shows
      description: |
        With image search on (`getImageSearchSettings`), a reply's interface
        components describe the pictures they want - a few words such as
        "laptop keyboard" - rather than give an address. This finds one: a
        freely licensed photo from the configured service, the first that
        matches, kept so the same words show the same picture on every reload
        and for every reader. The image itself is served by
        `getPicture`, so the reader's browser asks no third party. 404
        `image_not_found` when nothing matches or image search is off; 503
        `image_search_unavailable` when the service cannot be reached or is
        limiting this server. The client then leaves the picture out.
      operationId: searchImage
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: The picture found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoundImage" }
        default: { $ref: "#/components/responses/Error" }

  /pictures/{pictureId}:
    parameters:
      - name: pictureId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [messages]
      summary: A picture found for an answer, fetched for the reader
      description: |
        The bytes of an image `searchImage` found, fetched by the server from
        public addresses only and cached. Only images a search here found are
        served. 404 otherwise, or when the image cannot be had.
      operationId: getPicture
      responses:
        "200":
          description: The image.
          content:
            image/*:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /models:
    get:
      tags: [messages]
      summary: The models a conversation can use
      description: |
        Every model an enabled channel offers. A model offered by several
        channels appears once; which channel answers is the server's choice.
        A model at its spending cap is listed with `atCapacity` set for a
        caller who is refused it, so the picker can show why it is unavailable.
      operationId: listChatModels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatModel" }
        default: { $ref: "#/components/responses/Error" }

  /files:
    get:
      tags: [files]
      summary: List your files
      description: |
        The library: the files you sent with your messages, newest first, each
        with the conversation it was sent in. Only conversations you can still
        open - not deleted or temporary ones. `url` is a signed read URL, as
        `Attachment.url`.
      operationId: listFiles
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: search
          in: query
          description: |
            Only files whose name contains this, ignoring case. Keep it (and
            `type`) the same while following `nextCursor`.
          schema: { type: string, maxLength: 200 }
        - name: type
          in: query
          description: Only images, PDFs, text files, or Word and Excel files (`document`).
          schema: { $ref: "#/components/schemas/LibraryFileType" }
      responses:
        "200":
          description: a page of files
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryFilePage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [files]
      summary: Issue a presigned upload URL for blob storage
      description: |
        For a file to attach to a message: the client PUTs the bytes to
        `uploadUrl` with the same `Content-Type`, then sends the returned `id`
        in `attachmentIds`. With S3 storage `uploadUrl` is a presigned bucket
        URL; with the server's local-disk storage it is a path on this API
        (`/api/v1/files/content/...`, a relative reference unless the server
        has a public URL configured), signed and valid for 15 minutes. The
        read URLs in `Attachment.url` follow the same rule. Only PNG, JPEG,
        WebP and GIF images (5 MiB each), PDFs (10 MiB) and text files
        (`text/plain`, 256 KiB: notes, Markdown, CSV, code - the client sends
        `text/plain` for each, whatever the browser calls it; the model is sent
        the text, so any model takes them, and bytes that are not UTF-8 text
        are left out) are accepted — 415 `unsupported_file_type` otherwise,
        and 413 `file_too_large` over the size. The upload belongs to the caller; nobody else can attach it.
      operationId: createUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUploadRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        default: { $ref: "#/components/responses/Error" }

  /files/{fileId}:
    parameters:
      - { $ref: "#/components/parameters/FileId" }
    delete:
      tags: [files]
      summary: Delete one of your files
      description: |
        Deletes a file of the library (`listFiles`) for good, with its stored
        bytes. The message it was sent with stays, and lists it in
        `removedAttachments`; a model reading the conversation is told the
        file is no longer available. 404 for a file that is not in your
        library.
      operationId: deleteFile
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }

  /files/{fileId}/download:
    parameters:
      - { $ref: "#/components/parameters/FileId" }
    get:
      tags: [files]
      summary: A download link for one of your files
      description: |
        A signed read URL, like `url` in `listFiles`, whose response asks the
        browser to save the file under its name rather than show it. 404 for a
        file that is not in your library.
      operationId: getFileDownload
      responses:
        "200":
          description: the link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDownload" }
        default: { $ref: "#/components/responses/Error" }

  /files/{fileId}/text:
    parameters:
      - { $ref: "#/components/parameters/FileId" }
    get:
      tags: [files]
      summary: The words of one of your documents
      description: |
        What a Word, Excel or PDF file says, read out of it as a model is sent
        it: Markdown for Word, CSV under a heading per sheet for Excel, and a
        PDF's pages each after a "[Page n]" line. The file itself is
        unchanged (`url`, `getFileDownload`). 404 for a file that is not
        yours, 415 `not_a_document` for one of another kind, and 422
        `document_unreadable` for one whose words cannot be read.
      operationId: getFileText
      parameters:
        - name: preview
          in: query
          required: false
          schema: { type: boolean }
          description: Only the beginning, at most 2 KB, for a card's preview in the library.
      responses:
        "200":
          description: the words
          content:
            text/plain:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: openchat_session
      description: |
        HttpOnly, SameSite=Lax session cookie issued by /auth/login and
        /auth/register. It is never readable from JavaScript, so clients ask
        /auth/session rather than inspecting it.

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubagentId:
      name: subagentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: too many attempts; try again after the time in `Retry-After`
      headers:
        Retry-After:
          description: Seconds until another attempt may be made.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: ["not_found"] }
        message: { type: string }
        # Set when one specific input caused the failure, so a form can show the
        # message next to the offending field instead of as a banner.
        field: { type: string, examples: ["email"] }
        details: { type: object, additionalProperties: true }

    Role:
      type: string
      enum: [system, user, assistant, tool]

    MessageStatus:
      type: string
      enum: [pending, streaming, complete, failed, blocked]
      description: |
        `blocked` is a message content moderation refused: a user message that
        is shown and never sent to a model. It is not a question the
        conversation asked - it is left out of what a model is given, what a
        summary covers, a title, search and export - and it starts no run. It is
        the end of the transcript only until the next send. `regenerateAnswer`
        answers the last message that is not blocked and deletes the blocked
        ones after it; a blocked message can be edited like any other.

    ContextUsage:
      type: object
      additionalProperties: false
      description: Both fields are left out when nothing has been answered yet.
      properties:
        usedTokens:
          type: integer
          format: int64
          nullable: true
          description: Tokens the latest answered request took, in and out.
        model:
          type: string
          nullable: true
          description: The model that request went to.
        estimated:
          type: boolean
          description: |
            True when the conversation has been compressed since that request:
            `usedTokens` is then an estimate of the context as it now stands
            (the request's fixed part - system prompt, tools, attachments -
            plus the summary and the rows after it), until the next request
            reports the real figure.

    ContextSummary:
      type: object
      description: |
        A conversation's compressed context. `content` (Markdown) stands in, in
        what the model is sent, for every message up to and including
        `throughMessageId`, except the user message `keptMessageId`, which is
        sent as it was written. Messages after `throughMessageId` are sent as
        they are. Nothing is removed from the transcript: a client shows a
        divider after the `throughMessageId` message and the summary behind it.
        Editing a question deletes it and everything after it, and the summary
        with them when it ends there or later; regenerating an answer that the
        summary covers deletes the summary too.
      required: [content, throughMessageId, model, inputTokens, outputTokens, createdAt]
      properties:
        content: { type: string }
        throughMessageId: { type: string, format: uuid }
        keptMessageId:
          type: string
          format: uuid
          nullable: true
          description: The user message in the covered range that is sent as written, if one is.
        model: { type: string, description: The model that wrote it. }
        inputTokens: { type: integer, description: Tokens it took to write, in. }
        outputTokens: { type: integer, description: Tokens it took to write, out. }
        createdAt: { type: string, format: date-time }

    CompactionState:
      type: object
      description: A conversation's summary; `summary` is absent when it has none.
      properties:
        summary: { $ref: "#/components/schemas/ContextSummary" }

    Conversation:
      type: object
      required: [id, title, webSearch, temporary, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        temporary:
          type: boolean
          description: |
            A temporary chat: left out of the history, given no memories (custom
            instructions still apply) and no memory tool, never titled, and
            deleted a day after it was made. Set when it is created.
        model: { type: string, nullable: true }
        reasoningEffort:
          $ref: "#/components/schemas/ReasoningEffort"
        webSearch:
          type: boolean
          description: |
            Whether the conversation's runs may use the web — search and page
            reading. On by default; the model decides when a question needs it.
            Has no effect where the server offers no web search.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        pinnedAt:
          type: string
          format: date-time
          description: When it was pinned to the top of the list; absent when it is not.
        match:
          description: |
            Only in a search's results: the latest message containing the
            search, cut down to the words around it.
          allOf: [{ $ref: "#/components/schemas/ConversationMatch" }]

    RunningConversations:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }

    ConversationMatch:
      type: object
      required: [messageId, role, excerpt]
      properties:
        messageId: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        excerpt:
          type: string
          description: |
            The message's text around the first occurrence of the search, on one
            line, with `…` where it was cut.

    ReasoningEffort:
      type: string
      description: |
        How hard a reasoning model thinks. `auto` sends nothing and leaves the
        model at its own default. The other values are the levels providers
        use; each model accepts its own subset, listed as
        `ChatModel.reasoningEfforts` (from models.dev). A level the model does
        not offer is dropped, which is the same as `auto`.
      enum: [auto, none, minimal, low, medium, high, xhigh, max]

    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        nextCursor: { type: string, nullable: true }

    CreateConversationRequest:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        model: { type: string }
        reasoningEffort: { $ref: "#/components/schemas/ReasoningEffort" }
        webSearch: { type: boolean }
        temporary: { type: boolean }

    UpdateConversationRequest:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        model:
          type: string
          description: The model the conversation's next run uses.
        reasoningEffort: { $ref: "#/components/schemas/ReasoningEffort" }
        webSearch: { type: boolean }
        pinned:
          type: boolean
          description: Pins it to the top of the list, or unpins it. Not its activity - `updatedAt` stays.

    FoundImage:
      type: object
      description: |
        A freely licensed picture found for an answer, with what its licence
        asks to be shown: its title, who made it and under which licence, and
        the page it is from.
      required: [id, width, height, title, license, source]
      properties:
        id: { type: string, format: uuid, description: The picture's id; `getPicture` serves it. }
        width: { type: integer }
        height: { type: integer }
        title: { type: string }
        creator: { type: string }
        creatorUrl: { type: string }
        license:
          type: string
          description: The licence's short name as Creative Commons writes it, such as "CC BY 2.0" or "CC0 1.0".
        licenseUrl: { type: string }
        landingUrl: { type: string, description: The page the picture is from. }
        source: { type: string, description: Where Openverse found it, such as flickr or wikimedia. }

    Attachment:
      type: object
      required: [id, filename, contentType, size, url]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }
        url: { type: string, format: uri }

    Message:
      type: object
      description: |
        One immutable transcript row: a user's input, one model response, or
        one tool result. A reply that called tools is several rows sharing a
        `runId`.
      required: [id, conversationId, role, content, parts, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        content:
          type: string
          description: The text parts, concatenated. `parts` is the message.
        references:
          type: array
          description: The other conversations the message refers to (createMessage's conversationIds).
          items: { $ref: "#/components/schemas/ConversationReference" }
        parts:
          type: array
          items: { $ref: "#/components/schemas/MessagePart" }
        status: { $ref: "#/components/schemas/MessageStatus" }
        runId: { type: string, format: uuid }
        stopReason:
          type: string
          description: |
            Assistant messages only. `error` and `cancelled` responses are shown
            but never sent back to a model.
          enum: [stop, length, tool_calls, content_filter, cancelled, error]
        model: { type: string }
        errorCode:
          type: string
          description: |
            Why a failed response failed. A code to localise, never provider
            text. `model_capacity_reached` is a run stopped before a request
            because its model's spending cap had been reached.
        usage: { $ref: "#/components/schemas/Usage" }
        origin:
          type: string
          description: |
            User rows no person wrote. `subagent` is a sub-agent's report
            delivered to the main conversation (its content is one or more
            `<subagent-report>` blocks): shown as a line, never editable, not a
            question to regenerate. `agent` is the main agent's task or
            message to a sub-agent, seen only in a sub-agent's transcript.
          enum: [agent, subagent]
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        removedAttachments:
          type: array
          description: |
            User messages only: the files it was sent with that were deleted
            since (`deleteFile`), to show where they were.
          items: { $ref: "#/components/schemas/RemovedAttachment" }
        createdAt: { type: string, format: date-time }

    MessagePart:
      description: |
        One content block, in OpenChat's internal protocol (`internal/llm`):
        every upstream format is translated into these by its adapter, so a
        client renders one shape whatever the model behind it.
      oneOf:
        - $ref: "#/components/schemas/TextPart"
        - $ref: "#/components/schemas/ReasoningPart"
        - $ref: "#/components/schemas/ToolCallPart"
        - $ref: "#/components/schemas/ToolResultPart"
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/TextPart"
          reasoning: "#/components/schemas/ReasoningPart"
          tool_call: "#/components/schemas/ToolCallPart"
          tool_result: "#/components/schemas/ToolResultPart"

    TextPart:
      type: object
      required: [type, text]
      properties:
        type: { type: string, const: text }
        text: { type: string }

    ReasoningPart:
      type: object
      required: [type, text]
      properties:
        type: { type: string, const: reasoning }
        text:
          type: string
          description: Empty when the provider withheld or encrypted its reasoning.
        durationMs:
          type: integer
          format: int64
          description: >-
            How long the model spent on this reasoning, from its first token to
            its last. Absent when it was not timed (older replies), and while
            the reasoning is still streaming.

    ToolCallPart:
      type: object
      required: [type, id, name, rawArguments]
      properties:
        type: { type: string, const: tool_call }
        id: { type: string }
        name: { type: string }
        arguments:
          type: object
          additionalProperties: true
          description: Absent while streaming, and when what the model sent was not valid JSON.
        rawArguments: { type: string }

    ToolResultPart:
      type: object
      required: [type, callId, name, content, status]
      properties:
        type: { type: string, const: tool_result }
        callId: { type: string }
        name: { type: string }
        content:
          type: string
          description: What the model read.
        status: { type: string, enum: [succeeded, failed, cancelled, interrupted] }
        details:
          type: object
          additionalProperties: true
          description: Tool-specific data for display, such as a search's results.
        durationMs: { type: integer, format: int64 }

    Usage:
      type: object
      required: [inputTokens, outputTokens]
      properties:
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        reasoningTokens: { type: integer }
        cacheReadTokens: { type: integer }
        cacheWriteTokens: { type: integer }

    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        olderCursor:
          type: string
          nullable: true
          description: |
            Pass as `before` to fetch the page of rows older than this one.
            Absent when this page reaches the start of the conversation.

    ConversationReference:
      type: object
      required: [conversationId, title]
      properties:
        conversationId: { type: string, format: uuid }
        title:
          type: string
          description: The conversation's title when it was referred to (empty when it had none).

    CreateMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        model:
          type: string
          description: |
            The model to answer with, which the conversation also remembers.
            Absent: the conversation's model, or the first one available.
        reasoningEffort:
          $ref: "#/components/schemas/ReasoningEffort"
          description: For this run, and remembered by the conversation. Absent keeps the conversation's.
        webSearch:
          type: boolean
          description: For this run, and remembered by the conversation. Absent keeps the conversation's.
        requestId:
          type: string
          maxLength: 100
          description: Chosen by the client; a retry with the same id finds the same run.
        attachmentIds:
          type: array
          items: { type: string, format: uuid }
        conversationIds:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
          description: |
            Other conversations of yours to refer to, not this one. Each is read
            for the model, up to its last message now, whenever the context is
            built - not copied, not uploaded, not checked again by moderation.
            400 `reference_unavailable` for one that is not yours or is this
            one; `reference_empty` for one with nothing in it.

    EditMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        model: { type: string }
        reasoningEffort: { $ref: "#/components/schemas/ReasoningEffort" }
        webSearch: { type: boolean }
        attachmentIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            Uploads to send with the new wording. Only for the edit of a message
            content moderation refused (it carries none of its own); any other
            message keeps its own files and takes none.
        conversationIds:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
          description: As in createMessage, and like attachmentIds only for a refused message.
        requestId:
          type: string
          maxLength: 100
          description: Chosen by the client; a retry with the same id finds the same run.

    RegenerateRequest:
      type: object
      properties:
        model: { type: string }
        reasoningEffort: { $ref: "#/components/schemas/ReasoningEffort" }
        webSearch: { type: boolean }
        requestId:
          type: string
          maxLength: 100
          description: Chosen by the client; a retry with the same id finds the same run.

    AnswerQuestionRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          description: |
            One entry per question, in the order asked. Each takes the options
            chosen (by label) and/or text the user wrote instead; a question
            that is not `multiSelect` takes one of the two, not both.
          items:
            type: object
            required: [selected]
            properties:
              selected:
                type: array
                items: { type: string }
              other:
                type: string
                maxLength: 2000
        model: { type: string }
        reasoningEffort: { $ref: "#/components/schemas/ReasoningEffort" }
        webSearch: { type: boolean }
        requestId:
          type: string
          maxLength: 100
          description: Chosen by the client; a retry with the same id finds the same run.

    AnswerQuestionResponse:
      type: object
      required: [message, result, run]
      properties:
        message:
          $ref: "#/components/schemas/Message"
          description: The user message the answer is to, which the new run shares with the one that asked.
        result:
          $ref: "#/components/schemas/Message"
          description: |
            The tool row written for the call. Its result's `details.answers`
            holds the answers by question position, as `{selected, other}`.
        run: { $ref: "#/components/schemas/Run" }

    CreateMessageResponse:
      type: object
      required: [message, run]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        run: { $ref: "#/components/schemas/Run" }

    Run:
      type: object
      description: The work from one input to its final answer.
      required: [id, conversationId, status, model, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        status:
          type: string
          enum: [running, completed, failed, cancelled, awaiting_input]
          description: |
            `awaiting_input` is a run that stopped to ask the user something
            (`ask_user`): finished, with the call unanswered on the transcript.
            Answering starts a run that continues it.
        model: { type: string }
        reasoningEffort: { $ref: "#/components/schemas/ReasoningEffort" }
        errorCode: { type: string }
        continues:
          type: string
          format: uuid
          description: |
            Set on the run that goes on after a question was answered: the run
            that began the answer (never a middle one). Its rows show in the
            same reply.
        version:
          type: integer
          format: int64
          description: Bumped by every change; see the events stream.
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    LiveState:
      type: object
      description: A run's work in flight, which is not a message yet.
      properties:
        generation:
          type: object
          required: [attempt, parts]
          properties:
            attempt: { type: integer }
            parts:
              type: array
              items: { $ref: "#/components/schemas/MessagePart" }
            retry: { $ref: "#/components/schemas/RetryInfo" }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ToolSlot" }
        compacting:
          type: boolean
          description: The run is compressing the conversation's context before its next request.

    RetryInfo:
      type: object
      required: [at, errorCode]
      properties:
        at: { type: string, format: date-time }
        errorCode: { type: string }

    ToolSlot:
      type: object
      required: [callId, name, status]
      properties:
        callId: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [pending, running, done, awaiting]
          description: '`awaiting` is a question for the user: nothing runs, and the run ends on it.'
        messageId: { type: string, format: uuid }

    ConversationEvent:
      description: One SSE frame of the events stream.
      oneOf:
        - $ref: "#/components/schemas/SnapshotEvent"
        - $ref: "#/components/schemas/BatchEvent"
      discriminator:
        propertyName: type
        mapping:
          snapshot: "#/components/schemas/SnapshotEvent"
          batch: "#/components/schemas/BatchEvent"

    SnapshotEvent:
      type: object
      description: Replaces everything a client holds about runs in flight.
      required: [type, messages]
      properties:
        type: { type: string, const: snapshot }
        run:
          $ref: "#/components/schemas/Run"
          description: The active run; absent when the conversation is idle.
        messages:
          type: array
          description: Every message the active run has written, its input first.
          items: { $ref: "#/components/schemas/Message" }
        live: { $ref: "#/components/schemas/LiveState" }

    BatchEvent:
      type: object
      description: The events of one commit, in order.
      required: [type, runId, version, events]
      properties:
        type: { type: string, const: batch }
        runId: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        events:
          type: array
          items: { $ref: "#/components/schemas/RunEvent" }

    RunEvent:
      oneOf:
        - $ref: "#/components/schemas/RunStartedEvent"
        - $ref: "#/components/schemas/RunFinishedEvent"
        - $ref: "#/components/schemas/GenerationStartedEvent"
        - $ref: "#/components/schemas/PartStartedEvent"
        - $ref: "#/components/schemas/PartDeltaEvent"
        - $ref: "#/components/schemas/PartEndedEvent"
        - $ref: "#/components/schemas/MessageAppendedEvent"
        - $ref: "#/components/schemas/ToolStartedEvent"
        - $ref: "#/components/schemas/ToolFinishedEvent"
        - $ref: "#/components/schemas/RetryScheduledEvent"
        - $ref: "#/components/schemas/TitleChangedEvent"
        - $ref: "#/components/schemas/TranscriptChangedEvent"
        - $ref: "#/components/schemas/CompactionStartedEvent"
        - $ref: "#/components/schemas/CompactionFinishedEvent"
        - $ref: "#/components/schemas/CompactionChangedEvent"
        - $ref: "#/components/schemas/ConversationDeletedEvent"
        - $ref: "#/components/schemas/SubagentsChangedEvent"
      discriminator:
        propertyName: type
        mapping:
          compaction_started: "#/components/schemas/CompactionStartedEvent"
          compaction_finished: "#/components/schemas/CompactionFinishedEvent"
          compaction_changed: "#/components/schemas/CompactionChangedEvent"
          run_started: "#/components/schemas/RunStartedEvent"
          run_finished: "#/components/schemas/RunFinishedEvent"
          generation_started: "#/components/schemas/GenerationStartedEvent"
          part_started: "#/components/schemas/PartStartedEvent"
          part_delta: "#/components/schemas/PartDeltaEvent"
          part_ended: "#/components/schemas/PartEndedEvent"
          message_appended: "#/components/schemas/MessageAppendedEvent"
          tool_started: "#/components/schemas/ToolStartedEvent"
          tool_finished: "#/components/schemas/ToolFinishedEvent"
          retry_scheduled: "#/components/schemas/RetryScheduledEvent"
          title_changed: "#/components/schemas/TitleChangedEvent"
          transcript_changed: "#/components/schemas/TranscriptChangedEvent"
          conversation_deleted: "#/components/schemas/ConversationDeletedEvent"
          subagents_changed: "#/components/schemas/SubagentsChangedEvent"

    RunStartedEvent:
      type: object
      required: [type, run, message]
      properties:
        type: { type: string, const: run_started }
        run: { $ref: "#/components/schemas/Run" }
        message:
          $ref: "#/components/schemas/Message"
          description: The input that started the run.

    RunFinishedEvent:
      type: object
      required: [type, run]
      properties:
        type: { type: string, const: run_finished }
        run: { $ref: "#/components/schemas/Run" }

    GenerationStartedEvent:
      type: object
      description: A request attempt began producing content; drop any partial from an earlier attempt.
      required: [type, attempt]
      properties:
        type: { type: string, const: generation_started }
        attempt: { type: integer }

    PartStartedEvent:
      type: object
      required: [type, index, part]
      properties:
        type: { type: string, const: part_started }
        index: { type: integer }
        part: { $ref: "#/components/schemas/MessagePart" }

    PartDeltaEvent:
      type: object
      description: Text for a text or reasoning part, raw argument JSON for a tool call.
      required: [type, index, delta]
      properties:
        type: { type: string, const: part_delta }
        index: { type: integer }
        delta: { type: string }

    PartEndedEvent:
      type: object
      required: [type, index, part]
      properties:
        type: { type: string, const: part_ended }
        index: { type: integer }
        part: { $ref: "#/components/schemas/MessagePart" }

    MessageAppendedEvent:
      type: object
      description: A row was written. An assistant row replaces the partial being built.
      required: [type, message]
      properties:
        type: { type: string, const: message_appended }
        message: { $ref: "#/components/schemas/Message" }

    ToolStartedEvent:
      type: object
      required: [type, callId, name]
      properties:
        type: { type: string, const: tool_started }
        callId: { type: string }
        name: { type: string }

    ToolFinishedEvent:
      type: object
      required: [type, callId, messageId]
      properties:
        type: { type: string, const: tool_finished }
        callId: { type: string }
        messageId: { type: string, format: uuid }

    RetryScheduledEvent:
      type: object
      required: [type, attempt, at, errorCode]
      properties:
        type: { type: string, const: retry_scheduled }
        attempt: { type: integer }
        at: { type: string, format: date-time }
        errorCode: { type: string }

    TitleChangedEvent:
      type: object
      description: |
        The conversation was given a title, generated from its first exchange
        after the run that answered it finished. Sent in a batch of its own,
        under that run's id and last version — so it is not a step of the run
        and a client applies it whatever run state it holds.
      required: [type, title]
      properties:
        type: { type: string, const: title_changed }
        title: { type: string }

    TranscriptChangedEvent:
      type: object
      description: |
        Rows the conversation showed were deleted (`editMessage` removes a
        question and what followed it, `regenerateAnswer` removes the answer),
        so the transcript is no longer the old one with rows added to it. It is
        also sent, on its own and with no `from`, when a message was added that
        no run follows: a refused send kept as a `blocked` message
        (`createMessage`). A
        client that holds a transcript of the conversation - another tab, say -
        fetches its newest page again and drops what it held that the page does
        not contain; what the transcript is lives in `listMessages`, and the
        event only says early what it can (`from`). It comes in the same batch
        as the `run_started` of the run that follows, under that run's id and
        version.
      required: [type]
      properties:
        type: { type: string, const: transcript_changed }
        from:
          type: string
          format: uuid
          description: |
            For an edited question: that message, the first row deleted - it and
            every row after it are gone, which a client can act on before the
            fetch comes back. Absent for a regeneration, whose deleted answer is
            whatever follows the question the run answers.

    CompactionStartedEvent:
      type: object
      description: |
        The run is compressing the conversation's context before its next
        request (the first, or one after a tool round). Until
        `compaction_finished`, `LiveState.compacting` is true.
      required: [type]
      properties:
        type: { type: string, const: compaction_started }

    CompactionFinishedEvent:
      type: object
      description: |
        The compression ended. `summary` is the conversation's new summary;
        absent when it failed or had nothing to do, in which case the request
        went out as it was and the compression is tried again before the next.
      required: [type]
      properties:
        type: { type: string, const: compaction_finished }
        summary: { $ref: "#/components/schemas/ContextSummary" }

    ConversationDeletedEvent:
      type: object
      description: |
        The conversation was deleted (`deleteConversation`, or
        `deleteAllMyConversations`), perhaps from another tab or device. Sent
        in a batch of its own with the nil run id and version 0, after the
        delete committed; its runs were cancelled with it. A client showing
        the conversation leaves it and stops following: reconnecting would be
        404.
      required: [type]
      properties:
        type: { type: string, const: conversation_deleted }

    SubagentsChangedEvent:
      type: object
      description: |
        One of the conversation's sub-agents started, took a step, or ended
        (`listSubagents` says how it stands now). Sent in a batch of its own,
        with the nil run id and version 0. A report it delivers arrives as a
        transcript row - in the batch of the run that received it, or as the
        input of a run started for it (`run_started`).
      required: [type]
      properties:
        type: { type: string, const: subagents_changed }

    CompactionChangedEvent:
      type: object
      description: |
        The conversation's summary was taken back by a request of the person's
        (`undoCompaction`) and not by a run. Sent in a batch of its own, with
        the nil run id and version 0. `summary` is the one it has now, absent
        for none. A summary deleted along with the
        rows it ended at (an edit, a regeneration) is not announced: the
        `transcript_changed` of that edit says the transcript changed, and the
        summary is read again with it.
      required: [type]
      properties:
        type: { type: string, const: compaction_changed }
        summary: { $ref: "#/components/schemas/ContextSummary" }

    ConversationExport:
      type: object
      required: [version, exportedAt, conversations]
      properties:
        version: { type: integer, description: The shape of this document; 1. }
        exportedAt: { type: string, format: date-time }
        conversations:
          type: array
          description: Most recently active first.
          items: { $ref: "#/components/schemas/ExportedConversation" }

    ExportedConversation:
      type: object
      required: [id, title, createdAt, updatedAt, messages]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        model: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messages:
          type: array
          description: The conversation, oldest first.
          items: { $ref: "#/components/schemas/ExportedMessage" }

    ExportedMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        role:
          type: string
          enum: [user, assistant]
        content: { type: string }
        model: { type: string, description: Assistant messages only. }
        attachments:
          type: array
          description: The names of the files a user message carried; the files are not in the export.
          items:
            type: object
            required: [filename, contentType, size]
            properties:
              filename: { type: string }
              contentType: { type: string }
              size: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }

    DeletedConversations:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer, format: int64, description: How many conversations were deleted. }

    Personalization:
      type: object
      required: [aboutYou, responseStyle, memoryEnabled, memoryAllowed, instructionLimit, memoryLimit, memoryLength]
      properties:
        aboutYou:
          type: string
          description: Custom instructions about the user. Part of every conversation's system prompt, temporary ones included.
        responseStyle:
          type: string
          description: Custom instructions about how answers should be written.
        memoryEnabled:
          type: boolean
          description: |
            Your own switch. Off, no conversation of yours reads or writes
            memories and the model is not offered the memory tool.
        memoryAllowed:
          type: boolean
          description: |
            The administrator's switch (`SystemSettings.memory`). Off, memory is
            off for everyone whatever `memoryEnabled` says.
        instructionLimit: { type: integer, description: Characters allowed in each instructions field. }
        memoryLimit: { type: integer, description: Memories allowed per person. }
        memoryLength: { type: integer, description: Characters allowed in one memory. }

    UpdatePersonalizationRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        aboutYou: { type: string }
        responseStyle: { type: string }
        memoryEnabled: { type: boolean }

    MemorySource:
      type: string
      description: |
        Who wrote it: `user` by hand, `model` with its memory tool, `auto` is
        reserved for learning from conversations (not offered yet).
      enum: [user, model, auto]

    Memory:
      type: object
      required: [id, content, source, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        source: { $ref: "#/components/schemas/MemorySource" }
        conversationId:
          type: string
          format: uuid
          nullable: true
          description: The conversation it was learned in, while that still exists.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MemoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Memory" }

    MemoryRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: |
            One sentence. Whitespace is collapsed; 400 `memory_empty` or
            `memory_too_long` (see `Personalization.memoryLength`).

    MemoryEvent:
      type: object
      required: [id, memoryId, op, source, createdAt]
      properties:
        id: { type: string, format: uuid }
        memoryId: { type: string, format: uuid }
        op: { type: string, enum: [add, update, delete] }
        before: { type: string, nullable: true }
        after: { type: string, nullable: true }
        source: { $ref: "#/components/schemas/MemorySource" }
        conversationId: { type: string, format: uuid, nullable: true }
        undoneAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    MemoryEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MemoryEvent" }

    SubagentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Subagent" }

    Subagent:
      type: object
      description: |
        A sub-agent (子智能体): work the main agent handed over, done in a
        hidden conversation of its own. `state` is its latest run's.
      required: [id, name, model, state, background, stoppedByUser, toolCalls, createdAt, startedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: The short name the main agent gave it. }
        model: { type: string, description: The model its latest run uses (the one it will use, while queued). }
        state:
          type: string
          description: |
            `queued` is a foreground sub-agent waiting for a free slot (the
            limits of sub-agents working at once): launched, not started yet.
            It becomes `running` when it gets one.
          enum: [queued, running, completed, failed, cancelled]
        background:
          type: boolean
          description: Its reports are delivered to the conversation, rather than taken by a call waiting for it.
        stoppedByUser:
          type: boolean
          description: The person stopped it; only `resumeSubagent` starts it again.
        toolCalls: { type: integer, description: How many tool calls it has made. }
        activity:
          type: string
          description: While running, the tool it is using now (`web_search`, `web_fetch`, `document`), if any.
        launchedBy: { type: string, format: uuid, description: The run that launched it. }
        callId: { type: string, description: The tool call that launched it. }
        reportDelivered:
          type: boolean
          description: Its latest report has reached the main agent.
        durationMs:
          type: integer
          format: int64
          description: How long its latest run took, once it ended.
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, description: When its latest run started; while queued, when it was launched. }
        finishedAt: { type: string, format: date-time }

    SubagentDetail:
      type: object
      required: [subagent, messages]
      properties:
        subagent: { $ref: "#/components/schemas/Subagent" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        run: { $ref: "#/components/schemas/Run" }
        live: { $ref: "#/components/schemas/LiveState" }

    SubagentSettings:
      type: object
      required: [enabled, model, background, maxPerRun, maxPerConversation, maxPerUser, maxReportChars]
      properties:
        enabled:
          type: boolean
          description: Whether models are offered the sub-agent tools. Off by default.
        model:
          type: string
          description: The model sub-agents use. Empty is the model of the run that launches one.
        background:
          type: boolean
          description: Whether the main agent may launch sub-agents in the background. On by default.
        maxPerRun: { type: integer, description: Sub-agents one run may launch. 4 by default. }
        maxPerConversation: { type: integer, description: Sub-agents working at once for one conversation. 3 by default. }
        maxPerUser: { type: integer, description: Sub-agents working at once for one person, in all conversations. 5 by default. }
        maxReportChars: { type: integer, description: The longest report delivered; a longer one is cut and says so. 30000 by default. }

    UpdateSubagentSettingsRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        enabled: { type: boolean }
        model:
          type: string
          description: A model an enabled channel offers (400 `model_unavailable` otherwise), or empty.
        background: { type: boolean }
        maxPerRun: { type: integer, description: 1 to 20 (400 `invalid_subagent_limit`). }
        maxPerConversation: { type: integer, description: 1 to 20 (400 `invalid_subagent_limit`). }
        maxPerUser: { type: integer, description: 1 to 100 (400 `invalid_subagent_limit`). }
        maxReportChars: { type: integer, description: 1000 to 200000 (400 `invalid_subagent_limit`). }

    ChatFeatures:
      type: object
      required: [webSearch, avatarUploads, scheduledTasks, requestTraces]
      properties:
        requestTraces:
          type: boolean
          description: |
            Whether the caller may open the 轨迹 view of their conversations:
            true only for an administrator, while request traces are on
            (System settings).
        webSearch: { type: boolean }
        subagents:
          type: boolean
          description: Whether models may launch sub-agents (Sub-agent settings).
        scheduledTasks:
          type: boolean
          description: Whether scheduled tasks are on (System settings); off, `/tasks` is 404.
        avatarUploads:
          type: boolean
          description: Whether the account settings offer uploading a picture.

    ChatModel:
      type: object
      required:
        [id, name, providerId, family, reasoning, toolCall, attachment, contextLimit, outputLimit,
         inputModalities, reasoningEfforts, atCapacity, pdfAsText]
      properties:
        id:
          type: string
          description: What a conversation stores and a request names.
        atCapacity:
          type: boolean
          description: |
            The model has reached its spending cap and the caller is refused it
            (409 `model_capacity_reached`). Never true for an administrator the
            cap exempts. Listed anyway, so the picker can show it disabled.
        name: { type: string }
        providerId:
          type: string
          description: The catalogue's brand for the model, for its icon. Empty when unknown.
        family: { type: string }
        reasoning: { type: boolean }
        toolCall: { type: boolean }
        attachment: { type: boolean }
        contextLimit:
          type: integer
          format: int64
          description: Zero when unknown.
        outputLimit:
          type: integer
          format: int64
          description: Zero when unknown.
        inputModalities:
          type: array
          items: { $ref: "#/components/schemas/InputModality" }
        pdfAsText:
          type: boolean
          description: |
            A PDF can be attached for this model although `inputModalities`
            does not list `pdf`: the server reads its words and sends those.
            False on a server that cannot read PDFs (no pdftotext).
        reasoningEfforts:
          type: array
          description: |
            The thinking levels this model offers, lowest first, besides
            `auto`. Empty for a model with no control over its thinking. What
            the operator allows, within what the model has.
          items: { $ref: "#/components/schemas/ReasoningEffort" }

    CreateUploadRequest:
      type: object
      required: [filename, contentType, size]
      properties:
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }

    Upload:
      type: object
      required: [id, uploadUrl, url, expiresAt]
      properties:
        id: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    LibraryFileType:
      type: string
      enum: [image, pdf, document, text]

    LibraryFile:
      type: object
      required: [id, filename, contentType, size, url, conversationId, conversationTitle, createdAt]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }
        url: { type: string, format: uri }
        conversationId: { type: string, format: uuid }
        conversationTitle: { type: string }
        createdAt: { type: string, format: date-time }

    LibraryFilePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LibraryFile" }
        nextCursor: { type: string, nullable: true }

    FileDownload:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    RemovedAttachment:
      type: object
      description: A file a message was sent with that has since been deleted (`deleteFile`).
      required: [id, filename, contentType]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }

    ConversationTrace:
      type: object
      required: [requests, retentionDays]
      properties:
        requests:
          type: array
          items: { $ref: "#/components/schemas/TraceRequest" }
        retentionDays: { type: integer }

    TraceRequest:
      type: object
      description: |
        One model request. `request` and `response` are the server's own
        encoding (llm's codec), for reading, not for a client to depend on:
        `request` has `messages` (role and parts), `tools` (name,
        description, parameters) and `options`; `response` has `message`,
        `finishReason` and `endedAt`. A file is its reference, never its bytes.
      required: [id, kind, status, startedAt, durationMs, modelId, servedModel, channelName,
                 inputTokens, outputTokens, reasoningTokens, cacheReadTokens, cacheWriteTokens,
                 estimated, request, response]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        kind:
          type: string
          description: "`chat`, a run's request; `compression`, a summary of its context."
        status: { type: string, enum: [ok, error] }
        errorCode: { type: string }
        errorMessage: { type: string }
        startedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        firstTokenMs: { type: integer }
        modelId: { type: string }
        servedModel: { type: string }
        channelName: { type: string }
        inputTokens: { type: integer, description: Excludes the cached part. }
        outputTokens: { type: integer, description: Includes reasoning. }
        reasoningTokens: { type: integer }
        cacheReadTokens: { type: integer }
        cacheWriteTokens: { type: integer }
        estimated: { type: boolean }
        cost: { type: number, format: double }
        request:
          type: object
          additionalProperties: true
        response:
          type: object
          additionalProperties: true

    Document:
      type: object
      required: [id, conversationId, createdAt, versions]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        versions:
          type: array
          items: { $ref: "#/components/schemas/DocumentVersion" }

    DocumentSummary:
      type: object
      required: [id, title, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }

    DocumentVersion:
      type: object
      required: [version, title, content, source, createdAt]
      properties:
        version: { type: integer }
        title: { type: string }
        content:
          type: string
          description: Markdown.
        source: { type: string, enum: [model, user] }
        createdAt: { type: string, format: date-time }

    UpdateDocumentRequest:
      type: object
      required: [title, content, baseVersion]
      properties:
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 100000 }
        baseVersion: { type: integer }

    TaskScheduleKind:
      type: string
      enum: [once, daily, weekly, monthly]
      x-enum-varnames: [TaskOnce, TaskDaily, TaskWeekly, TaskMonthly]

    TaskSchedule:
      type: object
      description: |
        When a task runs, in `timeZone` (an IANA name such as Asia/Shanghai).
        `once` runs at `at`; the others at `time` - every day, on `weekdays`
        (0 = Sunday), or on `monthDay` (a month too short for it, on its last
        day).
      required: [kind, timeZone]
      properties:
        kind: { $ref: "#/components/schemas/TaskScheduleKind" }
        at: { type: string, format: date-time }
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: HH:MM, 24-hour, local to `timeZone`.
        weekdays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        monthDay: { type: integer, minimum: 1, maximum: 31 }
        timeZone: { type: string }

    TaskStatus:
      type: string
      description: |
        `active` will run at `nextRunAt`; `paused` will not until resumed;
        `completed` is a one-off that has run.
      enum: [active, paused, completed]
      x-enum-varnames: [TaskActive, TaskPaused, TaskCompleted]

    Task:
      type: object
      required: [id, title, prompt, schedule, status, conversationId, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        prompt: { type: string }
        schedule: { $ref: "#/components/schemas/TaskSchedule" }
        status: { $ref: "#/components/schemas/TaskStatus" }
        conversationId:
          type: string
          format: uuid
          description: Where its runs go.
        nextRunAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time }
        lastError:
          type: string
          description: |
            Why the last time it was due started nothing, as a code to
            localise: `conversation_busy`, `content_blocked`,
            `moderation_unavailable`, `model_unavailable`, `no_models`,
            `model_capacity_reached`, `too_many_runs`, `revise_refused`,
            `account_unavailable`, `missed` (the server could not run it
            within an hour of its time; it runs again at its next), `failed`.
        createdAt: { type: string, format: date-time }

    TaskList:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        limit:
          type: integer
          description: How many tasks still to run a person may have.

    CreateTaskRequest:
      type: object
      required: [title, prompt, schedule]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        prompt: { type: string, minLength: 1, maxLength: 4000 }
        schedule: { $ref: "#/components/schemas/TaskSchedule" }
        model:
          type: string
          description: The model its conversation answers with; the default one when absent.

    UpdateTaskRequest:
      type: object
      description: Only the fields present change.
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        prompt: { type: string, minLength: 1, maxLength: 4000 }
        schedule: { $ref: "#/components/schemas/TaskSchedule" }
        enabled: { type: boolean }

    UserRole:
      type: string
      enum: [user, admin]

    SessionUser:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        avatarUrl: { $ref: "#/components/schemas/AvatarUrl" }
        timeZone:
          type: string
          description: The time zone the browser last reported (`updateMe`), for times a model schedules.

    AvatarUrl:
      type: string
      format: uri
      description: |
        A signed read URL of the account's uploaded picture (`updateMyAvatar`),
        valid for an hour; the same URL is issued for as long as it has more
        than half of that left, so a page that asks again keeps its picture.
        Absent when the account has none: every client then draws it as the
        first letter of its name on a colour derived from its id. No
        third-party avatar service is asked — that would tell it who is being
        looked at, from every page that shows a name.

    PasskeyOptions:
      type: object
      required: [challengeId, publicKey]
      properties:
        challengeId:
          type: string
          format: uuid
          description: Sent back with the browser's answer.
        publicKey:
          type: object
          additionalProperties: true
          description: |
            The WebAuthn options as JSON (PublicKeyCredentialCreationOptionsJSON
            or PublicKeyCredentialRequestOptionsJSON), for the browser.

    PasskeyAnswer:
      type: object
      required: [challengeId, credential]
      properties:
        challengeId: { type: string, format: uuid }
        credential:
          type: object
          additionalProperties: true
          description: The browser's credential as JSON (RegistrationResponseJSON or AuthenticationResponseJSON).
        name:
          type: string
          maxLength: 60
          description: What to call a passkey being added; the browser's name for its kind when absent.

    Passkey:
      type: object
      required: [id, name, createdAt, synced]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        synced:
          type: boolean
          description: Whether it is backed up and synced across devices (a password manager or platform account), rather than bound to one device.

    RenamePasskeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }

    PasskeySettings:
      type: object
      required: [enabled, rpId, origins, userVerification, effectiveRpId, effectiveOrigins, registered]
      properties:
        enabled:
          type: boolean
          description: Whether accounts may add passkeys and sign in with them. Off, the passkeys stay but cannot be used.
        rpId:
          type: string
          description: |
            The relying party ID: the domain passkeys are made for, such as
            chat.example.com. Empty takes the domain the page is served from.
        origins:
          type: array
          items: { type: string }
          description: Origins a passkey answer may come from, such as https://chat.example.com. Empty takes the page's own origin.
        userVerification:
          type: string
          enum: [required, preferred]
          description: Whether the authenticator must verify the person (fingerprint, face, PIN) or only should.
        effectiveRpId:
          type: string
          description: The relying party ID in force for this request.
        effectiveOrigins:
          type: array
          items: { type: string }
          description: The origins in force for this request.
        registered:
          type: integer
          description: Passkeys registered across all accounts.

    UpdatePasskeySettingsRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        enabled: { type: boolean }
        rpId: { type: string, maxLength: 253 }
        origins:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 300 }
        userVerification:
          type: string
          enum: [required, preferred]

    AuthOptions:
      type: object
      required: [registration, approval, passkeys]
      properties:
        passkeys:
          type: boolean
          description: Whether accounts may sign in with a passkey (`beginPasskeySignIn`).
        registration:
          type: boolean
          description: |
            Whether `POST /auth/register` is open. True too while no account
            exists yet, whatever the administrator's switch says: the first
            account is always let in.
        approval:
          type: boolean
          description: |
            Whether an account made by registering must be approved before it
            can sign in. Only meaningful while `registration` is true; false
            while no account exists yet, since the first one is never pending.

    RegisterPending:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending_approval]
        admin:
          $ref: "#/components/schemas/AdminContact"

    DisabledReason:
      type: string
      enum: [admin, moderation]
      description: |
        Who disabled the account: an administrator, or content moderation once
        enough of its messages were blocked.

    AccountDisabled:
      type: object
      description: |
        The `details` of a 403 `account_disabled`: what a disabled account is
        told, on signing in and on every request its session still makes (the
        session is kept, not revoked, so the page can say why; nothing else
        answers it). `admin` is whom to ask.
      required: [reason, disabledAt]
      properties:
        reason: { $ref: "#/components/schemas/DisabledReason" }
        disabledAt: { type: string, format: date-time }
        note:
          type: string
          description: What the administrator wrote, when they wrote anything.
        strikes:
          type: integer
          description: With `moderation`, how many blocked messages in the window set it off.
        windowHours:
          type: integer
          description: With `moderation`, the window they were counted in.
        categories:
          type: array
          items: { type: string }
          description: With `moderation`, the categories those messages were blocked for.
        admin: { $ref: "#/components/schemas/AdminContact" }

    AdminContact:
      type: object
      description: |
        The administrator an account that cannot sign in is told to contact:
        the longest-standing enabled one. Given only to someone who has just
        proved the password of such an account (or registered it), as OpenWebUI
        shows its admin on the pending-account screen.
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string

    UserStatus:
      type: string
      description: |
        `pending` is a registered account waiting for an administrator;
        `disabled` wins over it, so rejecting a sign-up (disabling it) moves it
        out of the pending list.
      enum: [pending, enabled, disabled]
      x-enum-varnames: [UserStatusPending, UserStatusEnabled, UserStatusDisabled]

    User:
      type: object
      required: [id, email, name, role, disabled, pending, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        avatarUrl: { $ref: "#/components/schemas/AvatarUrl" }
        disabled: { type: boolean }
        disabledReason:
          $ref: "#/components/schemas/DisabledReason"
        disabledNote:
          type: string
          description: What the administrator wrote when disabling it, shown to the person.
        pending:
          type: boolean
          description: |
            Registered while approval was required and not yet approved. Such
            an account cannot sign in. It can also be `disabled` (rejected).
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        storageQuotaBytes:
          type: integer
          format: int64
          description: The account's own quota in bytes; absent when it has the default.
        storageUsedBytes:
          type: integer
          format: int64
          description: What its files take, in bytes. Given in `listUsers`.

    UserPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        total: { type: integer, format: int64 }
        page: { type: integer }
        limit: { type: integer }

    UsageKind:
      type: string
      description: |
        `chat` is a model request of a run; `title` is the background request
        that names a conversation; `compression` is a request that writes a
        conversation's context summary, made with the conversation's own model;
        `moderation` is a request that has a model classify a message
        (`ModerationSettings.mode` `model`); `subagent` is a model request of a
        sub-agent's run, logged on the conversation it works for.
      enum: [chat, title, compression, moderation, subagent]
      # Named explicitly: bare `Chat` would collide with ApiFormat's `chat` and
      # make the generator rename both enums' constants.
      x-enum-varnames: [UsageKindChat, UsageKindTitle, UsageKindCompression, UsageKindModeration]

    UsageStatus:
      type: string
      description: A user stopping a reply is `ok`; only a failed request is `error`.
      enum: [ok, error]

    UsageLog:
      type: object
      required: [id, createdAt, kind, status, channelName, model, servedModel,
                 inputTokens, outputTokens, reasoningTokens, cacheReadTokens, cacheWriteTokens,
                 durationMs, estimated]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time, description: When the request started. }
        kind: { $ref: "#/components/schemas/UsageKind" }
        status: { $ref: "#/components/schemas/UsageStatus" }
        errorCode:
          type: string
          nullable: true
          description: The code the chat localises (model_auth, model_rate_limited, ...).
        errorMessage:
          type: string
          nullable: true
          description: Short, scrubbed and truncated; for operators.
        userId: { type: string, format: uuid, nullable: true }
        userName: { type: string, nullable: true }
        userEmail: { type: string, nullable: true }
        userAvatarUrl:
          $ref: "#/components/schemas/AvatarUrl"
          nullable: true
        deletedUser:
          type: string
          nullable: true
          description: |
            The name of the account this request was made for, when an
            administrator has deleted it since.
        conversationId: { type: string, format: uuid, nullable: true }
        runId: { type: string, format: uuid, nullable: true }
        channelId: { type: string, format: uuid, nullable: true }
        channelName:
          type: string
          description: The channel's name when the request was made.
        model: { type: string, description: The model id the request asked for. }
        servedModel:
          type: string
          description: The model the provider says it served; empty when it did not say.
        inputTokens: { type: integer, format: int64, description: Excludes the cached part. }
        outputTokens: { type: integer, format: int64, description: Includes reasoning. }
        reasoningTokens: { type: integer, format: int64 }
        cacheReadTokens: { type: integer, format: int64 }
        cacheWriteTokens: { type: integer, format: int64 }
        inputPrice: { type: number, format: double, nullable: true, description: USD per million tokens. }
        outputPrice: { type: number, format: double, nullable: true }
        cacheReadPrice: { type: number, format: double, nullable: true }
        cacheWritePrice: { type: number, format: double, nullable: true }
        cost:
          type: number
          format: double
          nullable: true
          description: |
            USD. Null when the price is unknown, or when the provider reported
            no usage and the request was never taken up (so there is nothing
            to estimate).
        estimated:
          type: boolean
          description: |
            Whether the token counts (and so the cost) are, in whole or in
            part, the server's estimate and not what the provider reported: a
            request that was stopped, or broke, before the provider's usage
            frame, or one from a provider that reports none. Estimates err
            high. Whatever the provider did report is kept as it is.
        firstTokenMs:
          type: integer
          format: int64
          nullable: true
          description: Request start to the first content, reasoning or tool-call delta.
        durationMs:
          type: integer
          format: int64
          description: |
            Request start to its end. 0 when the provider turned the request
            down before any time was spent on it.

    UsageSummary:
      type: object
      required: [requests, errors, inputTokens, outputTokens, cost, cacheReadTokens, cacheWriteTokens]
      properties:
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cost: { type: number, format: double, description: USD; unpriced requests add nothing. }
        cacheReadTokens: { type: integer, format: int64, description: Of the successful requests. }
        cacheWriteTokens: { type: integer, format: int64, description: Of the successful requests. }
        cacheHitRate:
          type: number
          format: double
          nullable: true
          description: |
            Token-weighted: cacheReadTokens / (inputTokens + cacheReadTokens +
            cacheWriteTokens), over successful requests. Null when none sent a token.
        cacheSavings:
          type: number
          format: double
          nullable: true
          description: |
            USD the cached reads saved against the full input price, over the
            requests priced for both. Null when none were.

    UsageLogPage:
      type: object
      required: [items, limit, summary]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UsageLog" }
        nextCursor:
          type: string
          description: Absent on the last page.
        limit: { type: integer }
        summary:
          $ref: "#/components/schemas/UsageSummary"
          description: Of every request the filters match, `requests` being their number.

    Username:
      type: string
      minLength: 1
      maxLength: 80
      pattern: '^[^@]+$'
      description: |
        A username. `@` is excluded so that a username can never be spelled
        like an email address: sign-in accepts either, and if the two could
        collide, one account's username would shadow another's address.

    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email: { type: string, format: email }
        name: { $ref: "#/components/schemas/Username" }
        password: { type: string, minLength: 8, maxLength: 200 }

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: |
            An email address or a username. Not `format: email` — half the
            values it accepts are not addresses, and the server decides which
            kind it is rather than the caller declaring it.
        password: { type: string }

    UpdateMeRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        name: { $ref: "#/components/schemas/Username" }
        email: { type: string, format: email }
        timeZone:
          type: string
          maxLength: 64
          description: An IANA time zone name; the page sends the browser's when it differs.

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 200 }

    CreateUserRequest:
      type: object
      required: [email, name, password, role]
      properties:
        email: { type: string, format: email }
        name: { $ref: "#/components/schemas/Username" }
        password: { type: string, minLength: 8, maxLength: 200 }
        role: { $ref: "#/components/schemas/UserRole" }
        disabled: { type: boolean, default: false }

    MyStorage:
      type: object
      required: [usedBytes, quotaBytes, files, kinds]
      properties:
        usedBytes: { type: integer, format: int64 }
        quotaBytes: { type: integer, format: int64 }
        files: { type: integer, format: int64 }
        kinds:
          type: array
          description: What each kind of file takes, largest first.
          items: { $ref: "#/components/schemas/StorageKindUsage" }

    StorageKindUsage:
      type: object
      required: [kind, files, bytes]
      properties:
        kind: { type: string, enum: [image, pdf, document, text, other] }
        files: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }

    StorageQuotaSettings:
      type: object
      required: [defaultBytes]
      properties:
        defaultBytes:
          type: integer
          format: int64
          minimum: 0
          description: How much an account without a quota of its own may keep in files, in bytes. 5 GiB unless set.

    UpdateUserRequest:
      type: object
      description: |
        Only the fields present are changed. Setting `password` signs the
        account out everywhere — the old sessions outlive the old credential
        otherwise.
      properties:
        storageQuotaBytes:
          type: integer
          format: int64
          minimum: -1
          description: How much this account may keep in files, in bytes; -1 gives it the default again.
        name: { $ref: "#/components/schemas/Username" }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 200 }
        role: { $ref: "#/components/schemas/UserRole" }
        disabled: { type: boolean }
        disabledNote:
          type: string
          maxLength: 500
          description: |
            With `disabled: true`: why, in words the person is shown when they
            next use the app (an empty string is none). Ignored otherwise.
        approved:
          type: boolean
          description: |
            `true` lets a pending account in; `false` is 400 `invalid_approval`
            (there is no way back to pending). Independent of `disabled`.

    CatalogStatus:
      type: object
      required: [providerCount, modelCount, stale]
      properties:
        fetchedAt:
          type: string
          format: date-time
          description: Absent when nothing has ever been fetched.
        providerCount: { type: integer }
        modelCount: { type: integer }
        stale:
          type: boolean
          description: Whether the snapshot is old enough to be worth refreshing.
        lastError:
          type: string
          description: |
            Why the most recent refresh failed, if it did. The snapshot it
            failed to replace is still the one being served.

    CatalogProvider:
      type: object
      required: [id, name, modelCount]
      properties:
        id: { type: string, examples: ["anthropic"] }
        name: { type: string, examples: ["Anthropic"] }
        modelCount: { type: integer }
        doc: { type: string, format: uri }
        env:
          type: array
          description: Environment variables upstream documents for this provider's key.
          items: { type: string }

    CatalogModel:
      type: object
      required:
        [providerId, providerName, modelId, name, enabled, attachment, reasoning,
         toolCall, structuredOutput]
      properties:
        providerId: { type: string }
        providerName: { type: string }
        modelId: { type: string }
        channels:
          type: array
          description: |
            The configured channels that have this model selected, disabled
            ones included — each entry's own `enabled` says which those are.
            Having it selected is what puts a model in this listing, so the
            array is never empty here and the catalogue alone never contributes
            a row.
          items: { $ref: "#/components/schemas/ModelChannel" }
        name: { type: string }
        description: { type: string }
        family: { type: string }
        enabled:
          type: boolean
          description: Whether at least one enabled channel has this model selected.
        attachment: { type: boolean }
        reasoning: { type: boolean }
        toolCall: { type: boolean }
        structuredOutput: { type: boolean }
        contextLimit: { type: integer, format: int64 }
        outputLimit: { type: integer, format: int64 }
        inputCost: { type: number, format: double, description: USD per million input tokens. }
        outputCost: { type: number, format: double, description: USD per million output tokens. }
        releaseDate: { type: string }
        knowledge: { type: string }
        inputModalities:
          type: array
          items: { type: string }
        outputModalities:
          type: array
          items: { type: string }
        inputLimit: { type: integer, format: int64 }
        defaults:
          description: What the catalogue says, before the operator's settings.
          allOf: [{ $ref: "#/components/schemas/ModelSettings" }]
        override: { $ref: "#/components/schemas/ModelOverride" }
        capacity:
          description: The spend against the model's cap; absent when it has none.
          allOf: [{ $ref: "#/components/schemas/ModelCapacity" }]
        settings:
          description: How the model is actually offered and called.
          allOf: [{ $ref: "#/components/schemas/ModelSettings" }]

    ModelKind:
      type: string
      description: What a model is for. Only `text` models are offered in chat.
      enum: [text, image, embedding, rerank]

    InputModality:
      type: string
      description: What a model takes besides text.
      enum: [image, audio, video, pdf]

    ModelSettings:
      type: object
      required:
        [kind, reasoning, toolCall, inputModalities, contextLimit, inputLimit, outputLimit,
         reasoningEfforts, adminOnly]
      properties:
        adminOnly:
          type: boolean
          description: |
            Offered to administrators only. Everyone else does not see it in
            the picker and is refused it when asking for it by id; the
            server's own tasks, such as titles, still use it.
        kind: { $ref: "#/components/schemas/ModelKind" }
        reasoning: { type: boolean }
        toolCall: { type: boolean }
        inputModalities:
          type: array
          items: { $ref: "#/components/schemas/InputModality" }
        contextLimit: { type: integer, format: int64, description: Zero when unknown. }
        inputLimit: { type: integer, format: int64, description: Zero when unknown. }
        outputLimit: { type: integer, format: int64, description: Zero when unknown. }
        reasoningEfforts:
          type: array
          description: |
            The thinking levels offered, lowest first, besides `auto`. In
            `defaults`, every level the model has.
          items: { $ref: "#/components/schemas/ReasoningEffort" }

    ModelOverride:
      type: object
      description: |
        The operator's settings for a model. Null follows the catalogue.
      properties:
        adminOnly:
          type: boolean
          description: |
            Keep the model for administrators only. Not a catalogue figure:
            absent is the same as false.
        capacity:
          type: number
          format: double
          nullable: true
          description: |
            A spending cap in USD (at most six decimals; 400 `invalid_capacity`
            otherwise). Once what the model has cost in the cap's period (every
            logged request for it counts, whoever made it) reaches this, it is
            refused to everyone it applies to. Null or absent is no cap, and the
            two fields below then go back to their defaults.
        capacityPeriod:
          $ref: "#/components/schemas/CapacityPeriod"
        capacityAdminExempt:
          type: boolean
          description: |
            While true (absent is true), administrators can go on using a
            capped model; their spend still counts. False applies the cap to
            everyone.
        kind:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ModelKind" }]
        reasoning: { type: boolean, nullable: true }
        toolCall: { type: boolean, nullable: true }
        inputModalities:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/InputModality" }
        contextLimit: { type: integer, format: int64, minimum: 1, nullable: true }
        inputLimit: { type: integer, format: int64, minimum: 1, nullable: true }
        outputLimit: { type: integer, format: int64, minimum: 1, nullable: true }
        reasoningEfforts:
          type: array
          nullable: true
          description: |
            The levels people may choose. Null offers every level the model
            has; empty offers none. `auto` is always available and is not
            listed.
          items: { $ref: "#/components/schemas/ReasoningEffort" }

    CapacityPeriod:
      type: string
      description: |
        What a spending cap counts. `total` is everything since the cap's
        starting point (`POST /admin/models/{modelId}/capacity/reset` moves it
        to now; before any reset it is the first request ever logged);
        `monthly` and `daily` start over at the beginning of each calendar
        month or day in the server's time zone (`TZ`). Absent is `total`.
      enum: [total, monthly, daily]

    ModelCapacity:
      type: object
      description: |
        How much of a model's spending cap is used. Only on a model that has a
        cap.
      required: [spent, atCapacity]
      properties:
        spent:
          type: number
          format: double
          description: USD spent in the current period.
        windowStart:
          type: string
          format: date-time
          nullable: true
          description: |
            Where the period being counted began. Null for a `total` cap that
            was never recalculated: all the model's history counts.
        atCapacity:
          type: boolean
          description: |
            The cap is reached, for anyone it applies to (administrators the
            cap exempts can still use the model).

    ModelChannel:
      type: object
      required: [id, name, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        enabled:
          type: boolean
          description: Whether the channel itself is switched on, not the model.

    CatalogModelPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogModel" }
        total: { type: integer, format: int64 }
        page: { type: integer }
        limit: { type: integer }

    SystemSettings:
      type: object
      required: [debugLogging, generativeUi, askUser, compressContext, memory, taskModel, avatarUploads, scheduledTasks, requestTraces,
                 deletedRetentionDays, unsentUploadHours, orphanFileHours,
                 maxConcurrentRuns,
                 allowRegistration, registrationApproval]
      properties:
        allowRegistration:
          type: boolean
          description: |
            Whether anyone may create an account by registering. Off, only
            administrators create accounts (`POST /admin/users`); the very
            first account on a fresh install can still register. On by default.
        registrationApproval:
          type: boolean
          description: |
            Whether an account made by registering is pending until an
            administrator approves it. Only matters while `allowRegistration`
            is on. On by default; accounts made by an administrator, and the
            first account ever, are never pending.
        maxConcurrentRuns:
          type: integer
          description: |
            How many runs one account may have going at once across all its
            conversations; 0 is unlimited. 3 unless changed. Administrators
            are exempt. Past it, starting a run is refused with 429
            `too_many_runs`.
        deletedRetentionDays:
          type: integer
          description: |
            How many days a conversation a user deleted is kept before it is
            removed for good, with its messages and files. Until then the
            delete can still be undone in the database. Default 30.
        unsentUploadHours:
          type: integer
          description: |
            How many hours a file uploaded in the composer but never sent with
            a message is kept. Default 24.
        orphanFileHours:
          type: integer
          description: |
            How many hours a file on the local disk with no attachment pointing
            to it is kept before the sweep removes it. Default 24.
        taskModel:
          type: string
          description: |
            The model background tasks use — for now, titling a conversation
            after its first answer. Empty: each conversation's own model.
        generativeUi:
          type: boolean
          description: |
            Whether models are taught to answer with interface components
            (`openchat-ui` blocks). Off by default: the catalogue adds a few
            thousand tokens to every request's system prompt.
        askUser:
          type: boolean
          description: |
            Whether models are offered the `ask_user` tool, with which they put
            multiple-choice questions to the user and wait for the answers.
            On by default. Takes effect at the next model request, including
            for runs in progress.
        compressContext:
          type: boolean
          description: |
            Whether a request that would fill more than half of the model's
            context window (65% once the conversation has a summary) is
            compressed first: the older part of the conversation is summarised
            by the conversation's own model and the model is sent the summary
            in its place. A request the model refuses for its length
            (`context_too_long`) is compressed once whatever its size and made
            again, once per run. On by default. Off, requests go out as they
            are: compression is only ever automatic. Takes effect at the next
            model request, including for runs in progress.
        avatarUploads:
          type: boolean
          description: |
            Whether people may upload a picture of their own (`PUT /me/avatar`,
            403 `avatar_uploads_off` otherwise). Off by default. Removing a
            picture already set is always allowed.
        requestTraces:
          type: boolean
          description: |
            Whether administrators' model requests are recorded as sent - the
            messages, tools and options, and what came back - for the 轨迹
            view of their own conversations (`getConversationTrace`). Off by
            default: a debugging aid. Off, nothing new is recorded and the
            view and its endpoint are gone (404); what was recorded is
            deleted after its week as usual.
        scheduledTasks:
          type: boolean
          description: |
            Whether people may schedule tasks (`/tasks`) and models are offered
            the tool that does. On by default. Off, nothing scheduled runs and
            `/tasks` is 404; the tasks are kept, and run again from their next
            time once it is switched back on.
        memory:
          type: boolean
          description: |
            The kill switch for personal memory. Off, no conversation reads or
            writes memories and the memory tool is not offered; people can still
            see and delete theirs, and their custom instructions still apply.
            On by default. Administrators cannot read anyone's memories either way.
        debugLogging:
          type: boolean
          description: |
            Whether the server logs at debug level. Takes effect immediately —
            no restart — and persists across one, because the fault worth
            chasing is usually the intermittent kind.

    UpdateSystemSettingsRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        debugLogging: { type: boolean }
        generativeUi: { type: boolean }
        askUser: { type: boolean }
        compressContext: { type: boolean }
        memory: { type: boolean }
        avatarUploads: { type: boolean }
        scheduledTasks: { type: boolean }
        requestTraces: { type: boolean }
        allowRegistration: { type: boolean }
        registrationApproval: { type: boolean }
        maxConcurrentRuns:
          type: integer
          description: 0 to 1000 (400 `invalid_run_limit` otherwise); 0 is unlimited.
        taskModel:
          type: string
          description: |
            A model an enabled channel offers (400 `model_unavailable`
            otherwise), or empty for each conversation's own.
        deletedRetentionDays:
          type: integer
          description: 1 to 3650 (400 `invalid_retention` otherwise).
        unsentUploadHours:
          type: integer
          description: 1 to 8760 (400 `invalid_retention` otherwise).
        orphanFileHours:
          type: integer
          description: 1 to 8760 (400 `invalid_retention` otherwise).

    WebSearchProvider:
      type: string
      description: |
        The search service. `free` takes the keyless public tiers of Exa,
        Parallel, Firecrawl and Keenable in turn, moving to the next when one
        is rate-limiting or failing; it needs no key and suits light use.
        `tavily` is Tavily's API with the stored key.
      enum: [free, tavily]

    WebSearchCompression:
      type: string
      description: |
        What a result gives the model, and so how much of its context a search
        costs. `snippet` is the search service's own excerpt. `truncate` is the
        page's text cut to `truncateLength` characters. `none` is the page's
        text whole, still bounded by a hard ceiling per result.
      enum: [snippet, truncate, none]

    WebSearchDepth:
      type: string
      description: |
        Tavily's search depth. `advanced` finds more relevant excerpts and
        costs two credits a search instead of one.
      enum: [basic, advanced]

    ModerationMode:
      type: string
      description: |
        `off` checks nothing; `openai` sends each message to OpenAI's
        moderation endpoint; `model` has a model of the catalogue classify it.
      enum: [off, openai, model]
      x-enum-varnames: [ModerationModeOff, ModerationModeOpenai, ModerationModeModel]

    ModerationOnError:
      type: string
      description: |
        What an account's message does when the moderation service fails (an
        error, a timeout, no channel, the model's spending cap): `allow` sends
        it anyway, `block` refuses it.
      enum: [allow, block]
      x-enum-varnames: [ModerationOnErrorAllow, ModerationOnErrorBlock]

    ModerationCategory:
      type: string
      description: A category of OpenAI's moderation model.
      enum:
        - sexual
        - sexual/minors
        - harassment
        - harassment/threatening
        - hate
        - hate/threatening
        - illicit
        - illicit/violent
        - self-harm
        - self-harm/intent
        - self-harm/instructions
        - violence
        - violence/graphic
      x-enum-varnames:
        - ModerationCategorySexual
        - ModerationCategorySexualMinors
        - ModerationCategoryHarassment
        - ModerationCategoryHarassmentThreatening
        - ModerationCategoryHate
        - ModerationCategoryHateThreatening
        - ModerationCategoryIllicit
        - ModerationCategoryIllicitViolent
        - ModerationCategorySelfHarm
        - ModerationCategorySelfHarmIntent
        - ModerationCategorySelfHarmInstructions
        - ModerationCategoryViolence
        - ModerationCategoryViolenceGraphic

    ModerationSource:
      type: string
      description: |
        Where the blocked text came from: a message sent, edited or answered,
        the custom instructions or a memory as they were saved, or
        either of them as a conversation took its snapshot (`snapshot`, logged
        but not counted as a strike); a scheduled task's prompt as its owner
        saved it (`task`), or as it was about to be sent or a model wrote it
        (`task_run`, logged but not counted as a strike); the person's text
        of a writing block as a model was about to read it (`document`).
      enum: [send, edit, answer, instructions, memory, snapshot, task, task_run, document]
      x-enum-varnames: [ModerationSourceSend, ModerationSourceEdit, ModerationSourceAnswer, ModerationSourceInstructions, ModerationSourceMemory, ModerationSourceSnapshot, ModerationSourceTask, ModerationSourceTaskRun, ModerationSourceDocument]

    ModerationSanction:
      type: string
      description: What a blocked message set off, when it reached the strike threshold.
      enum: [disabled]
      x-enum-varnames: [ModerationSanctionDisabled]

    VersionInfo:
      type: object
      required: [current, updateAvailable]
      properties:
        current:
          type: string
          description: This server's version, `1.2.3` (no `v`), or `dev` for a local build.
        latest:
          type: string
          description: The newest release's version, `1.2.3`. Absent until a look has succeeded.
        latestUrl:
          type: string
          description: The newest release's page, with its notes.
        publishedAt: { type: string, format: date-time }
        updateAvailable:
          type: boolean
          description: |
            The newest release is newer than this one. Never for a `dev`
            build, which has no version to compare.
        checkedAt:
          type: string
          format: date-time
          description: When the last look succeeded.
        checkError:
          type: string
          enum: [unreachable, rate_limited, unexpected]
          description: The last look failed; `latest` (if any) is from an earlier one.

    ModerationSettings:
      type: object
      required:
        [mode, openaiKeySet, openaiBaseUrl, model, categories, minScore, exemptAdmins, onError,
         strikes, strikeWindowHours]
      properties:
        mode: { $ref: "#/components/schemas/ModerationMode" }
        openaiKeySet:
          type: boolean
          description: Whether an OpenAI API key is stored. Write-only, like a channel's.
        openaiKeyPreview:
          type: string
          description: The key's last four characters, e.g. `…4f2a`.
        openaiBaseUrl:
          type: string
          description: |
            Where `openai` mode sends its requests; empty is OpenAI's own
            (https://api.openai.com/v1).
        model:
          type: string
          description: The catalogue model that classifies in `model` mode; empty when none is chosen.
        categories:
          type: array
          description: The categories that block a message.
          items: { $ref: "#/components/schemas/ModerationCategory" }
        minScore:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            0 blocks a category the service flagged. Above 0 a category also
            blocks when its score reaches this, flagged or not.
        exemptAdmins:
          type: boolean
          description: Whether an administrator's messages go unchecked. Off, they reach the same upstream and are checked like anyone's.
        onError: { $ref: "#/components/schemas/ModerationOnError" }
        strikes:
          type: integer
          minimum: 0
          description: |
            How many blocked messages within `strikeWindowHours` disable the
            account. 0 never sanctions. An
            administrator is only logged.
        strikeWindowHours: { type: integer, minimum: 1 }

    UpdateModerationSettingsRequest:
      type: object
      description: Only the fields present are changed. An absent `openaiApiKey` keeps the stored one; an empty string clears it.
      properties:
        mode: { $ref: "#/components/schemas/ModerationMode" }
        openaiApiKey: { type: string, maxLength: 500 }
        openaiBaseUrl: { type: string, maxLength: 500 }
        model: { type: string, maxLength: 200 }
        categories:
          type: array
          items: { $ref: "#/components/schemas/ModerationCategory" }
        minScore: { type: number, format: double, minimum: 0, maximum: 1 }
        exemptAdmins: { type: boolean }
        onError: { $ref: "#/components/schemas/ModerationOnError" }
        strikes: { type: integer, minimum: 0 }
        strikeWindowHours: { type: integer, minimum: 1 }

    ModerationEvent:
      type: object
      required: [id, createdAt, source, mode, categories, excerpt]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        userId: { type: string, format: uuid, nullable: true }
        userName: { type: string, nullable: true }
        userEmail: { type: string, nullable: true }
        userDisabled:
          type: boolean
          nullable: true
          description: Whether the account is disabled now; null once it is deleted.
        conversationId: { type: string, format: uuid, nullable: true }
        source: { $ref: "#/components/schemas/ModerationSource" }
        mode:
          type: string
          enum: [openai, model]
          x-enum-varnames: [ModerationEventModeOpenai, ModerationEventModeModel]
        categories:
          type: array
          items: { type: string }
        excerpt: { type: string, description: The first 500 characters of the blocked text. }
        sanction:
          $ref: "#/components/schemas/ModerationSanction"
          nullable: true

    ModerationEventPage:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ModerationEvent" }
        nextCursor:
          type: string
          description: Absent on the last page.
        limit: { type: integer }

    ImageSearchSettings:
      type: object
      required: [enabled, providers, pixabayKeySet]
      properties:
        enabled:
          type: boolean
          description: |
            Whether answers describe their pictures for the server to find
            (`searchImage`). Off, an answer can show only a picture whose
            address one of its own sources listed - a page it read or a
            search it ran - as before.
        providers:
          type: array
          items: { $ref: "#/components/schemas/ImageSearchProvider" }
          description: |
            The services asked, in order: when one cannot search (down, slow,
            limiting this server, or Pixabay without a key) or finds nothing,
            the next is asked. A service that failed lately is asked after the
            others for a minute. Never empty.
        pixabayKeySet:
          type: boolean
          description: Whether a Pixabay API key is stored; `pixabay` needs one. Write-only, like a channel's.
        pixabayKeyPreview:
          type: string
          description: The Pixabay key's last four characters.

    UpdateImageSearchSettingsRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        enabled: { type: boolean }
        providers:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: "#/components/schemas/ImageSearchProvider" }
          description: The services to ask, in order.
        pixabayKey:
          type: string
          maxLength: 200
          description: The Pixabay API key. Empty removes the stored one.

    ImageSearchTestRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 200 }
        provider:
          $ref: "#/components/schemas/ImageSearchProvider"
          description: One service to try. The configured services, in their order, when absent.
        pixabayKey:
          type: string
          maxLength: 200
          description: A Pixabay key to try before saving it. The stored key when absent.

    ImageSearchTestResult:
      type: object
      required: [ok, latencyMs]
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer }
        error: { type: string, description: Why the search failed, when it did. }
        image:
          $ref: "#/components/schemas/ImageSearchHit"
          description: The first match; absent when nothing matched.

    ImageSearchHit:
      type: object
      required: [url, width, height, title, license, source, provider]
      properties:
        url: { type: string, description: The picture at the service, to look at. }
        width: { type: integer }
        height: { type: integer }
        title: { type: string }
        creator: { type: string }
        license: { type: string }
        landingUrl: { type: string }
        source: { type: string }
        provider: { $ref: "#/components/schemas/ImageSearchProvider" }

    ImageSearchProvider:
      type: string
      enum: [wikimedia, openverse, pixabay, bing]
      description: |
        Where the pictures answers describe are found (`searchImage`).
        `wikimedia` is Wikimedia Commons' own search: no key, quick, but with
        no safe-search filter. `openverse` searches Creative Commons images
        from many sites with mature content filtered out, no key, but allows
        an anonymous server 200 searches a day and is often slow. `pixabay`
        is Pixabay's stock photos with safe search, and needs a free key.
        `bing` is Bing Images through the endpoint its results page uses: no
        key, quick, finds nearly anything, with strict safe search - but it is
        not an API and may stop working or ask for a check at any time, and
        its pictures are other sites', with their rights, not freely licensed.
    WebSearchSettings:
      type: object
      required:
        [enabled, provider, keySet, maxResults, depth, compression, truncateLength, blocklist]
      properties:
        enabled:
          type: boolean
          description: |
            Whether runs are offered the web_search tool. Tavily also needs a
            stored key; without one the tool is not offered.
        provider: { $ref: "#/components/schemas/WebSearchProvider" }
        keySet:
          type: boolean
          description: Whether an API key is stored. Write-only, like a channel's.
        keyPreview:
          type: string
          description: The key's last four characters, e.g. `…4f2a`.
        maxResults:
          type: integer
          minimum: 1
          maximum: 20
          description: Results per search. A model may ask for fewer, never more.
        depth: { $ref: "#/components/schemas/WebSearchDepth" }
        compression: { $ref: "#/components/schemas/WebSearchCompression" }
        truncateLength:
          type: integer
          minimum: 200
          maximum: 20000
          description: Characters kept per result under `truncate`.
        blocklist:
          type: array
          maxItems: 500
          description: |
            Sites no search returns and web_fetch refuses to read. One rule per
            entry: a domain (`example.com`, which covers its subdomains), a
            wildcard (`*.example.com`), or a regular expression between slashes
            (`/\.pdf$/`) matched against the whole URL.
          items: { type: string, maxLength: 300 }

    UpdateWebSearchSettingsRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        enabled: { type: boolean }
        provider: { $ref: "#/components/schemas/WebSearchProvider" }
        apiKey:
          type: string
          maxLength: 500
          description: The search service's API key. Empty removes the stored one.
        maxResults: { type: integer, minimum: 1, maximum: 20 }
        depth: { $ref: "#/components/schemas/WebSearchDepth" }
        compression: { $ref: "#/components/schemas/WebSearchCompression" }
        truncateLength: { type: integer, minimum: 200, maximum: 20000 }
        blocklist:
          type: array
          maxItems: 500
          items: { type: string, maxLength: 300 }

    WebSearchTestRequest:
      type: object
      properties:
        query:
          type: string
          maxLength: 300
          description: What to search for. A fixed query when absent.
        apiKey:
          type: string
          maxLength: 500
          description: A key to try before saving it. The stored key when absent.

    WebSearchTestResult:
      type: object
      required: [ok, latencyMs, results]
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer, format: int64 }
        error:
          type: string
          description: Why the search failed, in English, when it did.
        results:
          type: array
          description: What the model would have been given, after the blocklist.
          items: { $ref: "#/components/schemas/WebSearchTestHit" }
        blocked:
          type: integer
          description: Results the blocklist removed.
        servedBy:
          type: string
          description: Which service answered, for the free search (exa, parallel, firecrawl, keenable).

    WebSearchTestHit:
      type: object
      required: [title, url, content]
      properties:
        title: { type: string }
        url: { type: string }
        content: { type: string }

    StorageDriver:
      type: string
      description: Where new uploads go.
      enum: [local, s3]

    StorageS3Settings:
      type: object
      required: [endpoint, region, bucket, accessKeyId, pathStyle, secretKeySet]
      properties:
        endpoint:
          type: string
          description: The service's base URL (MinIO, R2, ...). Empty is AWS itself.
        region: { type: string }
        bucket: { type: string }
        accessKeyId: { type: string }
        pathStyle:
          type: boolean
          description: Address the bucket in the URL path rather than the host name. MinIO needs it.
        secretKeySet:
          type: boolean
          description: Whether a secret access key is stored. Write-only, like a channel's key.
        secretKeyPreview:
          type: string
          description: The secret's last four characters, e.g. `…4f2a`.

    StorageSettings:
      type: object
      required: [driver, localDir, resolvedLocalDir, publicUrl, s3]
      properties:
        driver: { $ref: "#/components/schemas/StorageDriver" }
        localDir:
          type: string
          description: The local driver's directory, as entered. Relative paths are relative to the server's working directory.
        resolvedLocalDir:
          type: string
          description: The `localDir` as an absolute path on the server.
        publicUrl:
          type: string
          description: |
            The origin the local driver's URLs are issued under. Empty issues
            them relative, which is right when the web app and the API share an
            origin.
        s3: { $ref: "#/components/schemas/StorageS3Settings" }

    UpdateStorageS3Settings:
      type: object
      description: Only the fields present are changed.
      properties:
        endpoint: { type: string, maxLength: 500 }
        region: { type: string, maxLength: 100 }
        bucket: { type: string, maxLength: 255 }
        accessKeyId: { type: string, maxLength: 500 }
        secretAccessKey:
          type: string
          maxLength: 500
          description: The secret access key. Absent keeps the stored one; empty removes it.
        pathStyle: { type: boolean }

    UpdateStorageSettingsRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        driver: { $ref: "#/components/schemas/StorageDriver" }
        localDir: { type: string, maxLength: 1000 }
        publicUrl:
          type: string
          maxLength: 500
          description: An http(s) origin with no path. Empty removes it.
        s3: { $ref: "#/components/schemas/UpdateStorageS3Settings" }

    StorageTestResult:
      type: object
      required: [ok, latencyMs]
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer, format: int64 }
        error:
          type: string
          description: Why the probe failed, in English, when it did.

    ChannelType:
      type: string
      description: |
        The vendor an operator picks. Most of these speak the OpenAI wire
        protocol and differ only in endpoint and branding — which is the point:
        choosing a protocol is a question the operator should not have to
        answer, so the type answers it for them. `GET /admin/channel-types`
        carries the full table.
      enum: [openai, anthropic, gemini, openrouter, deepseek, siliconflow, moonshot, zhipu, dashscope, volcengine, minimax, xai, groq, ollama, mistral, stepfun, hunyuan, qianfan, mimo, together, fireworks, nvidia, modelscope, cerebras, opencode-go, lmstudio, openai-compatible]

    WireApi:
      type: string
      description: The protocol a channel type speaks. Three adapters serve every type.
      enum: [openai, anthropic, gemini]

    ChannelTypeGroup:
      type: string
      description: |
        The tab the channel picker files a vendor under: the model makers
        themselves, the platforms that host or route other people's models, and
        servers the operator runs (plus the generic relay).
      enum: [vendor, platform, custom]

    ApiFormat:
      type: string
      description: |
        Which of OpenAI's request formats a channel on the OpenAI protocol
        sends: Chat Completions (`chat`, served by nearly every compatible
        endpoint) or the Responses API (`responses`). Ignored on other
        protocols, and on a type that routes each model itself.
      enum: [chat, responses]

    ChannelTypeInfo:
      type: object
      required: [id, label, wireApi, endpoint, keyHint, iconId, group, keyOptional, apiFormatChoice]
      properties:
        id: { $ref: "#/components/schemas/ChannelType" }
        label:
          type: string
          description: A brand name, deliberately not translated — it reads the same in both locales.
        wireApi: { $ref: "#/components/schemas/WireApi" }
        endpoint:
          type: string
          description: The default base URL, empty for a type that has none to offer.
        keyHint: { type: string }
        iconId:
          type: string
          description: |
            The brand mark, which is not always the type id: `anthropic` is
            drawn with the Claude mark. Empty when there is no brand to draw.
        doc: { type: string, format: uri }
        group: { $ref: "#/components/schemas/ChannelTypeGroup" }
        keyOptional:
          type: boolean
          description: |
            Whether the endpoint is normally reached without a credential — a
            service on the operator's own machine. The form then lets a model
            list be fetched with the key left blank.
        apiFormatChoice:
          type: boolean
          description: |
            Whether the operator chooses the request format (`ApiFormat`) for a
            channel of this type: true for the OpenAI protocol, false where the
            protocol has one format or the type routes each model itself.
        regions:
          type: array
          description: |
            The sites a vendor runs separately — a mainland China one and an
            international one, each with its own accounts and keys. When
            present, the first is `endpoint`, and the form offers the choice,
            which sets the channel's base URL.
          items: { $ref: "#/components/schemas/ChannelRegion" }

    ChannelRegion:
      type: object
      required: [id, endpoint]
      properties:
        id:
          type: string
          enum: [cn, global]
          description: "`cn`: the mainland China site. `global`: the international one."
        endpoint: { type: string }

    ChannelModel:
      type: object
      required: [modelId, displayName, enabled, source]
      properties:
        modelId:
          type: string
          description: As the endpoint spells it, which is what gets sent back to it.
        displayName: { type: string }
        enabled:
          type: boolean
          description: Whether this installation offers the model. Ours to decide, never the refresh's.
        source:
          type: string
          description: |
            `fetched` came from the endpoint's own model list; `manual` was
            typed in, for an endpoint that does not publish one or omits a
            model it actually serves.
          enum: [fetched, manual]
        catalog:
          allOf: [{ $ref: "#/components/schemas/CatalogModel" }]
          description: |
            What models.dev knows about this model, when it knows anything.
            Absent is ordinary: the endpoint is the authority on which models
            exist, and the catalogue only decorates them.
        fetchedAt: { type: string, format: date-time }

    ChannelModelRefresh:
      type: object
      required: [total, added, removed]
      properties:
        total: { type: integer }
        added: { type: integer }
        removed:
          type: integer
          description: Models the endpoint no longer lists. Their enabled state goes with them.

    Channel:
      type: object
      required: [id, name, type, wireApi, apiFormat, enabled, hasKey, sendUserId, priority, weight, createdAt, modelCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: What the operator calls this connection. }
        type: { $ref: "#/components/schemas/ChannelType" }
        wireApi: { $ref: "#/components/schemas/WireApi" }
        apiFormat: { $ref: "#/components/schemas/ApiFormat" }
        baseUrl:
          type: string
          description: Overrides the provider's default endpoint. Empty means use the default.
        enabled: { type: boolean }
        modelCount:
          type: integer
          description: How many models this channel offers, i.e. has enabled.
        hasKey:
          type: boolean
          description: Whether a credential is stored. The credential itself is never returned.
        keyPreview:
          type: string
          description: |
            The last four characters, for telling two keys apart in the UI —
            e.g. `…4f2a`. Absent when no key is stored.
        sendUserId:
          type: boolean
          description: |
            Whether requests through this channel carry the end user's
            identifier (a keyed hash, never the email): `safety_identifier` on
            OpenAI's APIs, `metadata.user_id` on Anthropic's. A third-party
            endpoint may reject the field, so it is on by default only for
            api.openai.com and api.anthropic.com.
        priority:
          type: integer
          description: |
            Among the channels offering a model, a run goes to one of the highest
            priority; the others take over, in order, when a request fails before
            the model has written anything.
        weight:
          type: integer
          minimum: 1
          maximum: 1000
          description: |
            Among channels of the same priority, the share of runs this one
            gets: a channel of weight 3 beside one of weight 1 answers about
            three runs in four.
        createdAt: { type: string, format: date-time }
        spent:
          type: number
          format: double
          description: |
            USD the channel's requests have cost, all time, as the usage log
            priced them; requests to an unpriced model add nothing. Set in the
            channel list only.

    ChannelConnection:
      type: object
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/ChannelType" }
        baseUrl: { type: string, maxLength: 500 }
        apiKey: { type: string, maxLength: 500 }

    ChannelModelInput:
      type: object
      required: [modelId, displayName, source]
      properties:
        modelId: { type: string, minLength: 1, maxLength: 200 }
        displayName: { type: string, maxLength: 500 }
        source:
          type: string
          enum: [fetched, manual]
          description: Manual entries survive refreshes even when the endpoint does not advertise them.

    CreateChannelRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        type: { $ref: "#/components/schemas/ChannelType" }
        baseUrl: { type: string, maxLength: 500 }
        apiKey: { type: string, maxLength: 500 }
        enabled: { type: boolean, default: true }
        apiFormat: { $ref: "#/components/schemas/ApiFormat" }
        priority: { type: integer, minimum: -1000000, maximum: 1000000, default: 0 }
        weight: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        sendUserId:
          type: boolean
          description: |
            Absent: on when the endpoint (`baseUrl`, else the type's default)
            is api.openai.com or api.anthropic.com, off otherwise.
        models:
          type: array
          maxItems: 2000
          description: Selected models, created enabled in the same transaction as the channel.
          items: { $ref: "#/components/schemas/ChannelModelInput" }

    UpdateChannelRequest:
      type: object
      description: |
        Only the fields present are changed. An absent `apiKey` keeps the
        stored one; an empty string clears it. There is no way to read a key
        back, so a form that wants to leave it alone must omit the field.
      properties:
        type: { $ref: "#/components/schemas/ChannelType" }
        name: { type: string, minLength: 1, maxLength: 80 }
        baseUrl: { type: string, maxLength: 500 }
        apiKey: { type: string, maxLength: 500 }
        enabled: { type: boolean }
        priority: { type: integer, minimum: -1000000, maximum: 1000000 }
        weight: { type: integer, minimum: 1, maximum: 1000 }
        apiFormat: { $ref: "#/components/schemas/ApiFormat" }
        sendUserId: { type: boolean }

    DashboardRange:
      type: string
      enum: ["24h", "7d", "30d", "90d"]
      default: "7d"

    DashboardKpis:
      type: object
      required:
        [requests, errors, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, cost, activeUsers]
      properties:
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64, description: Excluding the cached part. }
        outputTokens: { type: integer, format: int64 }
        cacheReadTokens: { type: integer, format: int64 }
        cacheWriteTokens: { type: integer, format: int64 }
        cacheHitRate:
          type: number
          format: double
          nullable: true
          description: As in UsageSummary; null when no successful request sent a token.
        cacheSavings:
          type: number
          format: double
          nullable: true
          description: As in UsageSummary.
        cost: { type: number, format: double, description: USD; unpriced requests add nothing. }
        activeUsers: { type: integer, format: int64, description: Distinct accounts that made a request. }
        firstTokenP50Ms: { type: number, format: double, nullable: true, description: Of successful requests that have one. }
        firstTokenP95Ms: { type: number, format: double, nullable: true }

    DashboardTrendPoint:
      type: object
      required: [at, requests, errors, cost]
      properties:
        at: { type: string, format: date-time, description: Start of the hour or day. }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        cost: { type: number, format: double }

    DashboardModel:
      type: object
      required: [model, requests, errors, inputTokens, outputTokens, cacheReadTokens, cost]
      properties:
        model: { type: string }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cacheReadTokens: { type: integer, format: int64 }
        cacheHitRate: { type: number, format: double, nullable: true }
        cost: { type: number, format: double }
        firstTokenP50Ms: { type: number, format: double, nullable: true }

    DashboardChannel:
      type: object
      required: [channelName, requests, errors]
      properties:
        channelId:
          type: string
          format: uuid
          nullable: true
          description: Null once the channel was deleted; its history keeps the name.
        channelName: { type: string }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        firstTokenP50Ms: { type: number, format: double, nullable: true }
        firstTokenP95Ms: { type: number, format: double, nullable: true }
        durationP50Ms: { type: number, format: double, nullable: true }
        durationP95Ms: { type: number, format: double, nullable: true }
        lastErrorAt: { type: string, format: date-time, nullable: true }

    DashboardUser:
      type: object
      required: [requests, cost]
      properties:
        userId: { type: string, format: uuid, nullable: true }
        userName: { type: string, nullable: true }
        userEmail: { type: string, nullable: true }
        userAvatarUrl:
          $ref: "#/components/schemas/AvatarUrl"
          nullable: true
        deletedUser:
          type: string
          nullable: true
          description: The name of a deleted account whose requests these are.
        requests: { type: integer, format: int64 }
        cost: { type: number, format: double }

    DashboardError:
      type: object
      required: [id, createdAt, model, channelName]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        model: { type: string }
        channelName: { type: string }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }

    AdminDashboard:
      type: object
      required: [range, since, bucket, totalUsers, current, previous, trend, models, channels, users, errors]
      properties:
        range: { $ref: "#/components/schemas/DashboardRange" }
        since: { type: string, format: date-time, description: Start of the window. }
        bucket: { type: string, enum: [hour, day], description: What one trend point spans. }
        totalUsers: { type: integer, format: int64, description: Enabled accounts. }
        current: { $ref: "#/components/schemas/DashboardKpis" }
        previous: { $ref: "#/components/schemas/DashboardKpis" }
        trend:
          type: array
          items: { $ref: "#/components/schemas/DashboardTrendPoint" }
        models:
          type: array
          description: Busiest first, at most 8.
          items: { $ref: "#/components/schemas/DashboardModel" }
        channels:
          type: array
          description: Busiest first, at most 8.
          items: { $ref: "#/components/schemas/DashboardChannel" }
        users:
          type: array
          description: Highest spend first, at most 8.
          items: { $ref: "#/components/schemas/DashboardUser" }
        errors:
          type: array
          description: Latest failures first, at most 8.
          items: { $ref: "#/components/schemas/DashboardError" }

    BulkUpdateUsersRequest:
      type: object
      required: [userIds]
      description: Exactly one of `role`, `disabled` or `approved` must be given.
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/UserRole" }
        disabled: { type: boolean }
        disabledNote:
          type: string
          maxLength: 500
          description: "With `disabled: true`, the note every one of them is shown (as in updateUser)."
        approved:
          type: boolean
          description: |
            Only `true` (400 `invalid_approval` otherwise): lets pending
            accounts in. Accounts that are not pending are left as they are.

    BulkSkipReason:
      type: string
      description: |
        `self` — the caller's own account, which cannot be demoted or disabled.
        `not_found` — no such account.
      enum: [self, not_found]

    BulkSkipped:
      type: object
      required: [userId, reason]
      properties:
        userId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/BulkSkipReason" }

    BulkUpdateResult:
      type: object
      required: [updated, skipped]
      properties:
        updated: { type: integer }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/BulkSkipped" }
