openapi: 3.1.0
info:
  title: OpenChat API
  version: 0.1.0
  description: |
    OpenChat backend contract. This file is the single source of truth:
      - Go server interfaces are generated by oapi-codegen  -> apps/server/internal/api
      - TypeScript types are generated by openapi-typescript -> packages/api-client/src/schema.d.ts
servers:
  - url: /api/v1
# Every operation needs a session cookie unless it says otherwise.
security:
  - sessionCookie: []

tags:
  - name: system
  - name: auth
  - name: admin
  - name: conversations
  - name: messages
  - name: files
  - name: memory

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        "200":
          description: service is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/register:
    post:
      tags: [auth]
      summary: Create an account and start a session
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: created, session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        default: { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      tags: [auth]
      summary: Start a session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: signed in, session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        default: { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      operationId: logout
      responses:
        "204": { description: signed out, cookie cleared }
        default: { $ref: "#/components/responses/Error" }

  /auth/session:
    get:
      tags: [auth]
      summary: Who the current session belongs to
      operationId: getSession
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "401":
          description: not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /auth/me:
    patch:
      tags: [auth]
      summary: Change your own name or email
      description: |
        Separate from the admin endpoint because the two differ in what they
        may touch: this one cannot reach `role` or `disabled` at all, so a
        self-service form has no path to privilege escalation.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        default: { $ref: "#/components/responses/Error" }

  /auth/password:
    post:
      tags: [auth]
      summary: Change your own password
      description: |
        Requires the current password, which the admin endpoint does not — an
        admin acts on an account they do not own, whereas here the point is to
        prove the person at the keyboard is the account holder.

        Every other session is dropped; the one making the request survives, so
        changing your password does not sign you out of the tab you are in.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: changed, other sessions revoked }
        default: { $ref: "#/components/responses/Error" }

  /admin/dashboard:
    get:
      tags: [admin]
      summary: Operating figures from the usage ledger
      description: |
        What the model requests of a window look like: volume, spend, errors,
        latency and cache use, next to the equal-length window before it, plus
        the trend and the busiest models, channels and users. Buckets are hours
        for `24h` and calendar days otherwise; the window runs up to now and
        starts at the beginning of its first bucket.
      operationId: getAdminDashboard
      parameters:
        - name: range
          in: query
          schema: { $ref: "#/components/schemas/DashboardRange" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /admin/users:
    get:
      tags: [admin]
      summary: List accounts
      operationId: listUsers
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: search
          in: query
          description: Matches against email and name.
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        default: { $ref: "#/components/responses/Error" }

    post:
      tags: [admin]
      summary: Create an account
      description: |
        The account is usable immediately; no invitation or verification step
        exists. Unlike registration, the role is chosen by the caller rather
        than derived from whether the table is empty.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /admin/usage-logs:
    get:
      tags: [admin]
      summary: List model requests
      description: |
        One row per request made to a model -- every attempt of a run (a retry
        is its own row, and so is a failure) and every background title -- newest
        first. Cost and prices are those of the moment the request was made.
        The summary covers the whole filtered range, not just this page.
      operationId: listUsageLogs
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: model
          in: query
          description: The model id the request asked for.
          schema: { type: string }
        - name: channelId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UsageStatus" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/UsageKind" }
        - name: from
          in: query
          description: Requests started at or after this time.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Requests started before this time (exclusive).
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageLogPage" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channel-types:
    get:
      tags: [admin]
      summary: The vendors a channel can be
      description: |
        Served rather than hardcoded in the form, so the table that fills in a
        default endpoint is the same one the server later reads to decide which
        protocol to speak. Two copies of it would drift, and the failure would
        be a channel talking the wrong protocol to a real endpoint.
      operationId: listChannelTypes
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelTypeInfo" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channels/models/preview:
    post:
      tags: [admin]
      summary: Preview models using an unsaved channel connection
      description: |
        Uses the submitted connection without storing a channel or credential.
        Select models from this response and include them when creating the channel.
      operationId: previewChannelModels
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelConnection" }
      responses:
        "200":
          description: Models advertised by this endpoint, not yet added to the installation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelModelInput" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channels/{channelId}/models:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin]
      summary: The models this channel offers
      operationId: listChannelModels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelModel" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Add a model by hand
      description: |
        For an endpoint that publishes no model list, or omits one it serves.
        Marked `manual`, so a later refresh does not remove it.
      operationId: addChannelModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                modelId: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelModel" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channels/{channelId}/models/refresh:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [admin]
      summary: Ask the endpoint what models it serves
      description: |
        Calls the endpoint's own model list with the stored connection.
        Requires a stored key except for local services such as Ollama.

        Models already present keep their enabled state; models the endpoint
        stopped listing are removed, and `manual` entries are left alone.
      operationId: refreshChannelModels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelModelRefresh" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channels/{channelId}/models/{modelId}:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: modelId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [admin]
      summary: Offer this model, or stop offering it
      operationId: updateChannelModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelModel" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Remove a manually added model
      operationId: deleteChannelModel
      responses:
        "204": { description: removed }
        default: { $ref: "#/components/responses/Error" }

  /admin/catalog:
    get:
      tags: [admin]
      summary: Catalogue freshness
      operationId: getCatalogStatus
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogStatus" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Refresh the catalogue from models.dev
      description: |
        Fetches the upstream file and replaces the snapshot. A failed fetch
        leaves the previous snapshot in place — a stale catalogue is worth more
        than an empty one — and answers 502 rather than 200, because the refresh
        is what failed. The snapshot being served is unchanged, and `GET` on
        this path reports why through `lastError`.
      operationId: refreshCatalog
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogStatus" }
        default: { $ref: "#/components/responses/Error" }

  /admin/catalog/providers:
    get:
      tags: [admin]
      summary: Providers in the catalogue
      description: |
        Every provider models.dev documents, with the number of models it
        carries. Reference metadata: it is what the `providerId` filter on the
        served-models listing is expressed in, and it never adds a model to
        that listing — membership there comes from the channels' own selected
        models.
      operationId: listCatalogProviders
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogProvider" }
        default: { $ref: "#/components/responses/Error" }

  /admin/catalog/models:
    get:
      tags: [admin]
      summary: The models this installation serves
      description: |
        Only models explicitly selected (enabled) within a configured channel.
        Unselected discoveries never appear here. The upstream catalogue is deliberately
        not browsable here: it is a reference work of thousands of models, most
        of which nothing configured can answer with, and it reaches this
        endpoint only as decoration on the rows below.
      operationId: listCatalogModels
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: search
          in: query
          description: Matches against model id, name and family.
          schema: { type: string }
        - name: providerId
          in: query
          schema: { type: string }
        - name: capability
          in: query
          description: Only models with all of these.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [reasoning, toolCall, attachment, structuredOutput]
        - name: enabled
          in: query
          description: Whether at least one channel with this model selected is enabled.
          schema: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogModelPage" }
        default: { $ref: "#/components/responses/Error" }

  /admin/models/{modelId}/settings:
    parameters:
      - { name: modelId, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      summary: Decide how a model is offered
      description: |
        Replaces the operator's settings for a model, whichever channels serve
        it. Every field is sent; null follows the catalogue, so resetting one
        field is sending it as null. The settings are enforced where requests
        are made, not only in the picker: a level not allowed is dropped, a
        model that may not call tools is offered none, and an output limit is
        sent with every request.
      operationId: updateModelSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelOverride" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelOverride" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Go back to the catalogue for every setting
      operationId: resetModelSettings
      responses:
        "204": { description: reset }
        default: { $ref: "#/components/responses/Error" }

  /admin/system:
    get:
      tags: [admin]
      summary: Server-wide settings
      operationId: getSystemSettings
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change server-wide settings
      operationId: updateSystemSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSystemSettingsRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSettings" }
        default: { $ref: "#/components/responses/Error" }

  /admin/web-search:
    get:
      tags: [admin]
      summary: Web search settings
      operationId: getWebSearchSettings
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearchSettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change web search settings
      description: Read by every run at its next request, so a change reaches runs in progress.
      operationId: updateWebSearchSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWebSearchSettingsRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearchSettings" }
        default: { $ref: "#/components/responses/Error" }

  /admin/web-search/test:
    post:
      tags: [admin]
      summary: Run one search with the current settings
      description: |
        Searches the way a run would — the same depth, result count,
        compression and blocklist — and reports what came back. A failed search
        is a 200 with `ok: false`: the request worked, the search did not.
      operationId: testWebSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebSearchTestRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearchTestResult" }
        default: { $ref: "#/components/responses/Error" }

  /admin/storage:
    get:
      tags: [admin]
      summary: File storage settings
      operationId: getStorageSettings
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageSettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change file storage settings
      description: |
        Takes effect at once, with no restart: new uploads go to the chosen
        driver, and files already stored stay readable from wherever they are.
        The new drivers are built before they replace the old ones; if that
        fails the request is a 400 and nothing is saved.
      operationId: updateStorageSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStorageSettingsRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageSettings" }
        default: { $ref: "#/components/responses/Error" }

  /admin/storage/test:
    post:
      tags: [admin]
      summary: Try a storage configuration without saving it
      description: |
        Merges the body over the stored settings, then writes a small object
        under `probes/` in the chosen driver, reads it back and deletes it. A
        configuration that does not work is a 200 with `ok: false`: the request
        worked, the storage did not.
      operationId: testStorage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStorageSettingsRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageTestResult" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channels:
    get:
      tags: [admin]
      summary: List channels
      operationId: listChannels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Add a channel
      operationId: createChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChannelRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channels/{channelId}:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin]
      summary: Change a channel
      operationId: updateChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateChannelRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Remove a channel
      description: |
        Unlike accounts, a channel owns no user data — deleting one removes a
        connection, not anybody's history. It is therefore a real delete.
      operationId: deleteChannel
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }

  /admin/users/bulk:
    post:
      tags: [admin]
      summary: Apply one change to several accounts
      description: |
        Applied in a single transaction. Accounts the caller may not change are
        reported in `skipped` rather than failing the whole request; a change
        that would leave no enabled admin is refused outright.
      operationId: bulkUpdateUsers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkUpdateUsersRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkUpdateResult" }
        default: { $ref: "#/components/responses/Error" }

  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin]
      summary: Change an account's role or enabled state
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /conversations:
    get:
      tags: [conversations]
      summary: List conversations
      operationId: listConversations
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: a page of conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [conversations]
      summary: Create a conversation
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversationRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [conversations]
      summary: Get a conversation
      operationId: getConversation
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [conversations]
      summary: Rename or update a conversation
      operationId: updateConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConversationRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [conversations]
      summary: Delete a conversation
      operationId: deleteConversation
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/title:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    post:
      tags: [conversations]
      summary: Name a conversation from what it is about
      description: |
        Has the task model (System settings), else the conversation's own
        model, read the conversation's latest exchanges and title it, then
        renames the conversation to that title, replacing whatever it was
        called. Waits for the model. 409 `nothing_to_title` for a conversation
        with no messages; 502 `title_failed` when the model gave no title.
      operationId: generateConversationTitle
      responses:
        "200":
          description: the renamed conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/context:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [conversations]
      summary: How much of the model's context window the conversation fills
      description: |
        Read from the conversation's latest answered request: everything it
        was sent, cached or not, plus what it wrote. `usedTokens` is null for a
        conversation nothing has been answered in yet. The window it is
        measured against is the model's `contextLimit` (ChatModel).
      operationId: getConversationContext
      responses:
        "200":
          description: the context the latest request used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextUsage" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/messages:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [messages]
      summary: List messages in a conversation
      description: |
        The transcript is paged from its end: with no `before` the page is the
        conversation's newest rows, and `before` (the previous page's
        `olderCursor`) fetches the page of rows older than it. Within a page
        the items stay in chronological order, oldest first, so a client
        prepends each older page to what it holds. A page without
        `olderCursor` reaches the start of the conversation.
      operationId: listMessages
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: before
          in: query
          description: The `olderCursor` of the page just newer than the one wanted.
          schema: { type: string }
      responses:
        "200":
          description: a page of messages, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [messages]
      summary: Send a message and start a run that answers it
      description: |
        Writes the user message and starts a run in the background, then
        returns at once. The answer is not in this response: it is followed on
        `GET /conversations/{conversationId}/events`, which also serves a reload,
        a second tab or another device — the run does not depend on this
        request staying open, and closing the page does not stop it.

        A conversation runs one thing at a time: while a run is going this
        answers 409 `conversation_busy`. `requestId` makes a retried POST safe —
        the same id finds the run it already started instead of starting a
        second one.

        `attachmentIds` are uploads (`POST /files`) of the caller's that no
        message has claimed. They are refused, before anything is written, with
        400 `too_many_attachments` (more than 10), `attachments_too_large` (over
        20 MiB together), `attachment_unsupported` (the run's model does not
        accept images, or PDFs, per its `inputModalities`) and
        `attachment_unavailable` (not uploaded, already sent, or not the
        caller's).
      operationId: createMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMessageRequest" }
      responses:
        "202":
          description: the message was written and its run started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateMessageResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/messages/{messageId}/edit:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - name: messageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [messages]
      summary: Ask a question again, reworded
      description: |
        Starts a new branch from any question on the branch shown. The new
        wording is written as a new user message with the same parent as the
        one edited — a sibling, `editOf` the first version of the question —
        and becomes the conversation's current leaf; a run answers it, with the
        model, effort and web choice given, as sending does, and sees only the
        messages before it. What followed the edited question is not deleted:
        it is off the branch shown and comes back when the question's
        `branches` pager is switched back (`switchVersion`). The new message
        carries the edited one's files. 409 `not_on_path` when the message is
        not on the branch shown, `conversation_busy` while a run is going.
      operationId: editMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditMessageRequest" }
      responses:
        "202":
          description: the new message was written and its run started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateMessageResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/messages/{messageId}/switch:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - name: messageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [messages]
      summary: Show another version of a question, and the branch under it
      description: |
        Moves the conversation to another version of a question (a message of
        the branch shown's `branches`, see `Message.branches`): the shown
        branch then runs through that version and on to the end of the branch
        under it that was last worked on, so the turns that followed it come
        back, and the ones that followed the version just left are set aside.
        Every later request is built from, and every page of messages is read
        along, the new branch.

        Responds with the newest page of the new branch (as `listMessages`
        without `before`), which replaces the transcript the client holds.
        409 `not_on_path` when the message is not a version of a question on
        the branch shown, `conversation_busy` while a run is going.
      operationId: switchVersion
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: the newest page of the branch now shown, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/regenerate:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    post:
      tags: [messages]
      summary: Answer the last message again
      description: |
        Starts another run on the last user message of the branch shown, with the
        model, effort and web choice given (else the conversation's, which it
        then remembers, as sending does). The answer it replaces is kept as a
        version (`Message.versions`, `chooseAnswer`) but is no longer shown or
        sent to a model. Followed on the events stream like any run; 409
        `conversation_busy` while one is going, 404 `nothing_to_answer` in a
        conversation with no message.
      operationId: regenerateAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegenerateRequest" }
      responses:
        "202":
          description: the run started; `message` is the input it answers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateMessageResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/tool-calls/{callId}/answer:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - name: callId
        in: path
        required: true
        schema: { type: string, maxLength: 200 }
    post:
      tags: [messages]
      summary: Answer the model's question
      description: |
        The model called `ask_user` and its run stopped there, finished as
        `awaiting_input`, with the call on the transcript and no result. This
        writes the answers as the call's result and starts the run that goes
        on from it, with the model, effort and web choice given, as sending
        does. The new run is part of the same answer: it continues the run
        that asked (`Run.continues`), shares its input and shows under the same
        reply, and is followed on the events stream like any run. The result
        row is announced in the same batch as the run starting.

        Only the question at the end of the transcript can be answered: 409
        `not_pending` for one already answered, one the user wrote past, one
        whose answer was redone, or a call that is not an `ask_user` waiting
        for its answer. 409 `conversation_busy` while a run is going; 400
        `invalid_answers` when the answers do not fit the questions.
      operationId: answerQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerQuestionRequest" }
      responses:
        "202":
          description: the answers were recorded and the run started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerQuestionResponse" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/events:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [messages]
      summary: Follow a conversation's runs
      description: |
        Responds with `text/event-stream`. Each `data:` frame is one JSON
        `ConversationEvent`. The first is a `snapshot` — the active run, the
        messages it has written and its work in flight — and every later frame
        is a `batch` of events to apply on top of it. Everything described was
        committed before it was sent.

        A batch whose `version` is not newer than the snapshot's run version is
        already contained in the snapshot and is dropped. A client that falls
        too far behind is sent a fresh `snapshot` instead of the batches it
        missed; one that reconnects starts from a snapshot. Nothing is replayed.
      operationId: streamConversationEvents
      responses:
        "200":
          description: server-sent event stream of ConversationEvent frames
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/runs/{runId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [messages]
      summary: Stop a run
      description: |
        Asks the run to stop and returns. What was generated is kept; the run
        then finishes as `cancelled`, which the events stream reports.
        Stopping a run that already finished is a no-op.
      operationId: cancelRun
      responses:
        "202": { description: the run was asked to stop }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/runs/{runId}/choose:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [messages]
      summary: Show another version of the last answer
      description: |
        Makes this run the answer shown — and the one a later message builds
        on — in place of the other versions of the same input (see
        `Message.versions`). Only the last turn of the branch shown can
        switch: an earlier one has later turns built on the version it shows,
        so it answers 409 `not_latest`, as it does while a run is going
        (`conversation_busy`). Responds with the run's input, then the run's
        rows: together they replace the turn the client holds.
      operationId: chooseAnswer
      responses:
        "200":
          description: the run's question, then its rows, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        default: { $ref: "#/components/responses/Error" }

  /me/personalization:
    get:
      tags: [memory]
      summary: Your custom instructions and memory switch
      operationId: getPersonalization
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Personalization" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [memory]
      summary: Change your custom instructions or memory switch
      description: |
        Only the fields present are changed. New conversations take the change;
        one already running keeps what it began with.
      operationId: updatePersonalization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePersonalizationRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Personalization" }
        default: { $ref: "#/components/responses/Error" }

  /me/memories:
    get:
      tags: [memory]
      summary: Your memories, oldest first
      description: |
        Always your own: no endpoint, the administrator's included, returns
        anyone else's. The list is capped (`Personalization.memoryLimit`), so it
        is not paged.
      operationId: listMemories
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [memory]
      summary: Write a memory yourself
      description: 409 `memory_full` at the cap and `memory_duplicate` for one already there.
      operationId: createMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [memory]
      summary: Delete every memory
      description: Also forgets what the memory log holds about them.
      operationId: clearMemories
      responses:
        "204": { description: cleared }
        default: { $ref: "#/components/responses/Error" }

  /me/memories/{memoryId}:
    parameters:
      - name: memoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [memory]
      summary: Rewrite a memory
      operationId: updateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [memory]
      summary: Delete a memory
      operationId: deleteMemory
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }

  /me/memory-events:
    get:
      tags: [memory]
      summary: What the model recently changed in your memories
      description: |
        The last thirty days, newest first: the "recently learned" list, and
        what the chat looks up to know whether a change can still be undone.
        Your own edits are not logged.
      operationId: listMemoryEvents
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryEventList" }
        default: { $ref: "#/components/responses/Error" }

  /me/memory-events/{eventId}/undo:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [memory]
      summary: Undo a change the model made
      description: |
        An added memory is removed, an edited one put back, a deleted one
        restored. 409 `memory_changed` when the memory was edited since (the
        edit wins), `already_undone`, `memory_full` or `memory_duplicate` when a
        restore cannot be made.
      operationId: undoMemoryEvent
      responses:
        "200":
          description: undone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryEvent" }
        default: { $ref: "#/components/responses/Error" }

  /features:
    get:
      tags: [messages]
      summary: What the chat can offer right now
      description: |
        Server-wide switches the composer depends on. `webSearch` is whether
        the administrator has web search configured and on, which is when the
        composer offers its web search switch.
      operationId: getChatFeatures
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatFeatures" }
        default: { $ref: "#/components/responses/Error" }

  /favicons/{domain}:
    get:
      tags: [messages]
      summary: A site's icon, for the sources a reply cites
      description: |
        Fetched by the server and cached, so a browser showing a reply's
        sources asks no third party about them. 404 when the site has none;
        the client then draws its own mark.
      operationId: getFavicon
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string, maxLength: 253 }
      responses:
        "200":
          description: The icon.
          content:
            image/*:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/images:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [messages]
      summary: A picture an answer shows, fetched for the reader
      description: |
        Serves an image a reply's interface components show. Only an address
        that appears in one of this conversation's tool results — a page the
        model read, a search it ran — is fetched, so an answer can show what
        its sources hold and nothing it made up. The server fetches it from
        public addresses only and caches it, so the reader's browser asks no
        third party. 404 when the address is not from this conversation or the
        image cannot be had; the client then leaves the picture out.
      operationId: getConversationImage
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: The image.
          content:
            image/*:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /models:
    get:
      tags: [messages]
      summary: The models a conversation can use
      description: |
        Every model an enabled channel offers. A model offered by several
        channels appears once; which channel answers is the server's choice.
      operationId: listChatModels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatModel" }
        default: { $ref: "#/components/responses/Error" }

  /files:
    post:
      tags: [files]
      summary: Issue a presigned upload URL for blob storage
      description: |
        For a file to attach to a message: the client PUTs the bytes to
        `uploadUrl` with the same `Content-Type`, then sends the returned `id`
        in `attachmentIds`. With S3 storage `uploadUrl` is a presigned bucket
        URL; with the server's local-disk storage it is a path on this API
        (`/api/v1/files/content/...`, a relative reference unless the server
        has a public URL configured), signed and valid for 15 minutes. The
        read URLs in `Attachment.url` follow the same rule. Only PNG, JPEG,
        WebP and GIF images (5 MiB each) and PDFs (10 MiB) are accepted — 415
        `unsupported_file_type` otherwise, and 413 `file_too_large` over the
        size. The upload belongs to the caller; nobody else can attach it.
      operationId: createUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUploadRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: openchat_session
      description: |
        HttpOnly, SameSite=Lax session cookie issued by /auth/login and
        /auth/register. It is never readable from JavaScript, so clients ask
        /auth/session rather than inspecting it.

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: ["not_found"] }
        message: { type: string }
        # Set when one specific input caused the failure, so a form can show the
        # message next to the offending field instead of as a banner.
        field: { type: string, examples: ["email"] }
        details: { type: object, additionalProperties: true }

    Role:
      type: string
      enum: [system, user, assistant, tool]

    MessageStatus:
      type: string
      enum: [pending, streaming, complete, failed]

    ContextUsage:
      type: object
      additionalProperties: false
      description: Both fields are left out when nothing has been answered yet.
      properties:
        usedTokens:
          type: integer
          format: int64
          nullable: true
          description: Tokens the latest answered request took, in and out.
        model:
          type: string
          nullable: true
          description: The model that request went to.

    Conversation:
      type: object
      required: [id, title, webSearch, temporary, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        temporary:
          type: boolean
          description: |
            A temporary chat: left out of the history, given no memories (custom
            instructions still apply) and no memory tool, never titled, and
            deleted a day after it was made. Set when it is created.
        model: { type: string, nullable: true }
        reasoningEffort:
          $ref: "#/components/schemas/ReasoningEffort"
        webSearch:
          type: boolean
          description: |
            Whether the conversation's runs may use the web — search and page
            reading. On by default; the model decides when a question needs it.
            Has no effect where the server offers no web search.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReasoningEffort:
      type: string
      description: |
        How hard a reasoning model thinks. `auto` sends nothing and leaves the
        model at its own default. The other values are the levels providers
        use; each model accepts its own subset, listed as
        `ChatModel.reasoningEfforts` (from models.dev). A level the model does
        not offer is dropped, which is the same as `auto`.
      enum: [auto, none, minimal, low, medium, high, xhigh, max]

    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        nextCursor: { type: string, nullable: true }

    CreateConversationRequest:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        model: { type: string }
        reasoningEffort: { $ref: "#/components/schemas/ReasoningEffort" }
        webSearch: { type: boolean }
        temporary: { type: boolean }

    UpdateConversationRequest:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        model:
          type: string
          description: The model the conversation's next run uses.
        reasoningEffort: { $ref: "#/components/schemas/ReasoningEffort" }
        webSearch: { type: boolean }

    Attachment:
      type: object
      required: [id, filename, contentType, size, url]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }
        url: { type: string, format: uri }

    Message:
      type: object
      description: |
        One immutable transcript row: a user's input, one model response, or
        one tool result. A reply that called tools is several rows sharing a
        `runId`.
      required: [id, conversationId, role, content, parts, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        content:
          type: string
          description: The text parts, concatenated. `parts` is the message.
        parts:
          type: array
          items: { $ref: "#/components/schemas/MessagePart" }
        status: { $ref: "#/components/schemas/MessageStatus" }
        runId: { type: string, format: uuid }
        stopReason:
          type: string
          description: |
            Assistant messages only. `error` and `cancelled` responses are shown
            but never sent back to a model.
          enum: [stop, length, tool_calls, content_filter, cancelled, error]
        model: { type: string }
        errorCode:
          type: string
          description: Why a failed response failed. A code to localise, never provider text.
        usage: { $ref: "#/components/schemas/Usage" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        versions:
          type: array
          description: |
            User messages whose question was answered more than once, by
            regenerating: every run that answered it, oldest first. One of them
            is shown — the `runId` of the rows that follow — and the others are
            kept to switch back to (`chooseAnswer`).
          items: { type: string, format: uuid }
        branches:
          type: array
          description: |
            User messages whose question has other versions (it was asked
            again in new words, `editMessage`): the message and its siblings —
            the messages that follow the same parent — oldest first. One of
            them is on the branch shown and the others are kept, with what
            followed them, to switch to (`switchVersion`). Absent when the
            question has only one version.
          items: { type: string, format: uuid }
        editOf:
          type: string
          format: uuid
          description: User messages only. The first version of the question this one rewords.
        createdAt: { type: string, format: date-time }

    MessagePart:
      description: |
        One content block, in OpenChat's internal protocol (`internal/llm`):
        every upstream format is translated into these by its adapter, so a
        client renders one shape whatever the model behind it.
      oneOf:
        - $ref: "#/components/schemas/TextPart"
        - $ref: "#/components/schemas/ReasoningPart"
        - $ref: "#/components/schemas/ToolCallPart"
        - $ref: "#/components/schemas/ToolResultPart"
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/TextPart"
          reasoning: "#/components/schemas/ReasoningPart"
          tool_call: "#/components/schemas/ToolCallPart"
          tool_result: "#/components/schemas/ToolResultPart"

    TextPart:
      type: object
      required: [type, text]
      properties:
        type: { type: string, const: text }
        text: { type: string }

    ReasoningPart:
      type: object
      required: [type, text]
      properties:
        type: { type: string, const: reasoning }
        text:
          type: string
          description: Empty when the provider withheld or encrypted its reasoning.
        durationMs:
          type: integer
          format: int64
          description: >-
            How long the model spent on this reasoning, from its first token to
            its last. Absent when it was not timed (older replies), and while
            the reasoning is still streaming.

    ToolCallPart:
      type: object
      required: [type, id, name, rawArguments]
      properties:
        type: { type: string, const: tool_call }
        id: { type: string }
        name: { type: string }
        arguments:
          type: object
          additionalProperties: true
          description: Absent while streaming, and when what the model sent was not valid JSON.
        rawArguments: { type: string }

    ToolResultPart:
      type: object
      required: [type, callId, name, content, status]
      properties:
        type: { type: string, const: tool_result }
        callId: { type: string }
        name: { type: string }
        content:
          type: string
          description: What the model read.
        status: { type: string, enum: [succeeded, failed, cancelled, interrupted] }
        details:
          type: object
          additionalProperties: true
          description: Tool-specific data for display, such as a search's results.
        durationMs: { type: integer, format: int64 }

    Usage:
      type: object
      required: [inputTokens, outputTokens]
      properties:
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        reasoningTokens: { type: integer }
        cacheReadTokens: { type: integer }
        cacheWriteTokens: { type: integer }

    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        olderCursor:
          type: string
          nullable: true
          description: |
            Pass as `before` to fetch the page of rows older than this one.
            Absent when this page reaches the start of the conversation.

    CreateMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        model:
          type: string
          description: |
            The model to answer with, which the conversation also remembers.
            Absent: the conversation's model, or the first one available.
        reasoningEffort:
          $ref: "#/components/schemas/ReasoningEffort"
          description: For this run, and remembered by the conversation. Absent keeps the conversation's.
        webSearch:
          type: boolean
          description: For this run, and remembered by the conversation. Absent keeps the conversation's.
        requestId:
          type: string
          maxLength: 100
          description: Chosen by the client; a retry with the same id finds the same run.
        attachmentIds:
          type: array
          items: { type: string, format: uuid }

    EditMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        model: { type: string }
        reasoningEffort: { $ref: "#/components/schemas/ReasoningEffort" }
        webSearch: { type: boolean }
        requestId:
          type: string
          maxLength: 100
          description: Chosen by the client; a retry with the same id finds the same run.

    RegenerateRequest:
      type: object
      properties:
        model: { type: string }
        reasoningEffort: { $ref: "#/components/schemas/ReasoningEffort" }
        webSearch: { type: boolean }
        requestId:
          type: string
          maxLength: 100
          description: Chosen by the client; a retry with the same id finds the same run.

    AnswerQuestionRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          description: |
            One entry per question, in the order asked. Each takes the options
            chosen (by label) and/or text the user wrote instead; a question
            that is not `multiSelect` takes one of the two, not both.
          items:
            type: object
            required: [selected]
            properties:
              selected:
                type: array
                items: { type: string }
              other:
                type: string
                maxLength: 2000
        model: { type: string }
        reasoningEffort: { $ref: "#/components/schemas/ReasoningEffort" }
        webSearch: { type: boolean }
        requestId:
          type: string
          maxLength: 100
          description: Chosen by the client; a retry with the same id finds the same run.

    AnswerQuestionResponse:
      type: object
      required: [message, result, run]
      properties:
        message:
          $ref: "#/components/schemas/Message"
          description: The user message the answer is to, which the new run shares with the one that asked.
        result:
          $ref: "#/components/schemas/Message"
          description: |
            The tool row written for the call. Its result's `details.answers`
            holds the answers by question position, as `{selected, other}`.
        run: { $ref: "#/components/schemas/Run" }

    CreateMessageResponse:
      type: object
      required: [message, run]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        run: { $ref: "#/components/schemas/Run" }

    Run:
      type: object
      description: The work from one input to its final answer.
      required: [id, conversationId, status, model, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        status:
          type: string
          enum: [running, completed, failed, cancelled, awaiting_input]
          description: |
            `awaiting_input` is a run that stopped to ask the user something
            (`ask_user`): finished, with the call unanswered on the transcript.
            Answering starts a run that continues it.
        model: { type: string }
        reasoningEffort: { $ref: "#/components/schemas/ReasoningEffort" }
        errorCode: { type: string }
        continues:
          type: string
          format: uuid
          description: |
            Set on the run that goes on after a question was answered: the run
            that began the answer (never a middle one). Its rows show in the
            same reply, and the two are one version of the turn.
        version:
          type: integer
          format: int64
          description: Bumped by every change; see the events stream.
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    LiveState:
      type: object
      description: A run's work in flight, which is not a message yet.
      properties:
        generation:
          type: object
          required: [attempt, parts]
          properties:
            attempt: { type: integer }
            parts:
              type: array
              items: { $ref: "#/components/schemas/MessagePart" }
            retry: { $ref: "#/components/schemas/RetryInfo" }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ToolSlot" }

    RetryInfo:
      type: object
      required: [at, errorCode]
      properties:
        at: { type: string, format: date-time }
        errorCode: { type: string }

    ToolSlot:
      type: object
      required: [callId, name, status]
      properties:
        callId: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [pending, running, done, awaiting]
          description: '`awaiting` is a question for the user: nothing runs, and the run ends on it.'
        messageId: { type: string, format: uuid }

    ConversationEvent:
      description: One SSE frame of the events stream.
      oneOf:
        - $ref: "#/components/schemas/SnapshotEvent"
        - $ref: "#/components/schemas/BatchEvent"
      discriminator:
        propertyName: type
        mapping:
          snapshot: "#/components/schemas/SnapshotEvent"
          batch: "#/components/schemas/BatchEvent"

    SnapshotEvent:
      type: object
      description: Replaces everything a client holds about runs in flight.
      required: [type, messages]
      properties:
        type: { type: string, const: snapshot }
        run:
          $ref: "#/components/schemas/Run"
          description: The active run; absent when the conversation is idle.
        messages:
          type: array
          description: Every message the active run has written, its input first.
          items: { $ref: "#/components/schemas/Message" }
        live: { $ref: "#/components/schemas/LiveState" }

    BatchEvent:
      type: object
      description: The events of one commit, in order.
      required: [type, runId, version, events]
      properties:
        type: { type: string, const: batch }
        runId: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        events:
          type: array
          items: { $ref: "#/components/schemas/RunEvent" }

    RunEvent:
      oneOf:
        - $ref: "#/components/schemas/RunStartedEvent"
        - $ref: "#/components/schemas/RunFinishedEvent"
        - $ref: "#/components/schemas/GenerationStartedEvent"
        - $ref: "#/components/schemas/PartStartedEvent"
        - $ref: "#/components/schemas/PartDeltaEvent"
        - $ref: "#/components/schemas/PartEndedEvent"
        - $ref: "#/components/schemas/MessageAppendedEvent"
        - $ref: "#/components/schemas/ToolStartedEvent"
        - $ref: "#/components/schemas/ToolFinishedEvent"
        - $ref: "#/components/schemas/RetryScheduledEvent"
        - $ref: "#/components/schemas/TitleChangedEvent"
      discriminator:
        propertyName: type
        mapping:
          run_started: "#/components/schemas/RunStartedEvent"
          run_finished: "#/components/schemas/RunFinishedEvent"
          generation_started: "#/components/schemas/GenerationStartedEvent"
          part_started: "#/components/schemas/PartStartedEvent"
          part_delta: "#/components/schemas/PartDeltaEvent"
          part_ended: "#/components/schemas/PartEndedEvent"
          message_appended: "#/components/schemas/MessageAppendedEvent"
          tool_started: "#/components/schemas/ToolStartedEvent"
          tool_finished: "#/components/schemas/ToolFinishedEvent"
          retry_scheduled: "#/components/schemas/RetryScheduledEvent"
          title_changed: "#/components/schemas/TitleChangedEvent"

    RunStartedEvent:
      type: object
      required: [type, run, message]
      properties:
        type: { type: string, const: run_started }
        run: { $ref: "#/components/schemas/Run" }
        message:
          $ref: "#/components/schemas/Message"
          description: The input that started the run.

    RunFinishedEvent:
      type: object
      required: [type, run]
      properties:
        type: { type: string, const: run_finished }
        run: { $ref: "#/components/schemas/Run" }

    GenerationStartedEvent:
      type: object
      description: A request attempt began producing content; drop any partial from an earlier attempt.
      required: [type, attempt]
      properties:
        type: { type: string, const: generation_started }
        attempt: { type: integer }

    PartStartedEvent:
      type: object
      required: [type, index, part]
      properties:
        type: { type: string, const: part_started }
        index: { type: integer }
        part: { $ref: "#/components/schemas/MessagePart" }

    PartDeltaEvent:
      type: object
      description: Text for a text or reasoning part, raw argument JSON for a tool call.
      required: [type, index, delta]
      properties:
        type: { type: string, const: part_delta }
        index: { type: integer }
        delta: { type: string }

    PartEndedEvent:
      type: object
      required: [type, index, part]
      properties:
        type: { type: string, const: part_ended }
        index: { type: integer }
        part: { $ref: "#/components/schemas/MessagePart" }

    MessageAppendedEvent:
      type: object
      description: A row was written. An assistant row replaces the partial being built.
      required: [type, message]
      properties:
        type: { type: string, const: message_appended }
        message: { $ref: "#/components/schemas/Message" }

    ToolStartedEvent:
      type: object
      required: [type, callId, name]
      properties:
        type: { type: string, const: tool_started }
        callId: { type: string }
        name: { type: string }

    ToolFinishedEvent:
      type: object
      required: [type, callId, messageId]
      properties:
        type: { type: string, const: tool_finished }
        callId: { type: string }
        messageId: { type: string, format: uuid }

    RetryScheduledEvent:
      type: object
      required: [type, attempt, at, errorCode]
      properties:
        type: { type: string, const: retry_scheduled }
        attempt: { type: integer }
        at: { type: string, format: date-time }
        errorCode: { type: string }

    TitleChangedEvent:
      type: object
      description: |
        The conversation was given a title, generated from its first exchange
        after the run that answered it finished. Sent in a batch of its own,
        under that run's id and last version — so it is not a step of the run
        and a client applies it whatever run state it holds.
      required: [type, title]
      properties:
        type: { type: string, const: title_changed }
        title: { type: string }

    Personalization:
      type: object
      required: [aboutYou, responseStyle, memoryEnabled, memoryAllowed, instructionLimit, memoryLimit, memoryLength]
      properties:
        aboutYou:
          type: string
          description: Custom instructions about the user. Part of every conversation's system prompt, temporary ones included.
        responseStyle:
          type: string
          description: Custom instructions about how answers should be written.
        memoryEnabled:
          type: boolean
          description: |
            Your own switch. Off, no conversation of yours reads or writes
            memories and the model is not offered the memory tool.
        memoryAllowed:
          type: boolean
          description: |
            The administrator's switch (`SystemSettings.memory`). Off, memory is
            off for everyone whatever `memoryEnabled` says.
        instructionLimit: { type: integer, description: Characters allowed in each instructions field. }
        memoryLimit: { type: integer, description: Memories allowed per person. }
        memoryLength: { type: integer, description: Characters allowed in one memory. }

    UpdatePersonalizationRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        aboutYou: { type: string }
        responseStyle: { type: string }
        memoryEnabled: { type: boolean }

    MemorySource:
      type: string
      description: |
        Who wrote it: `user` by hand, `model` with its memory tool, `auto` is
        reserved for learning from conversations (not offered yet).
      enum: [user, model, auto]

    Memory:
      type: object
      required: [id, content, source, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        source: { $ref: "#/components/schemas/MemorySource" }
        conversationId:
          type: string
          format: uuid
          nullable: true
          description: The conversation it was learned in, while that still exists.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MemoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Memory" }

    MemoryRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: |
            One sentence. Whitespace is collapsed; 400 `memory_empty` or
            `memory_too_long` (see `Personalization.memoryLength`).

    MemoryEvent:
      type: object
      required: [id, memoryId, op, source, createdAt]
      properties:
        id: { type: string, format: uuid }
        memoryId: { type: string, format: uuid }
        op: { type: string, enum: [add, update, delete] }
        before: { type: string, nullable: true }
        after: { type: string, nullable: true }
        source: { $ref: "#/components/schemas/MemorySource" }
        conversationId: { type: string, format: uuid, nullable: true }
        undoneAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    MemoryEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MemoryEvent" }

    ChatFeatures:
      type: object
      required: [webSearch]
      properties:
        webSearch: { type: boolean }

    ChatModel:
      type: object
      required:
        [id, name, providerId, family, reasoning, toolCall, attachment, contextLimit, outputLimit,
         inputModalities, reasoningEfforts]
      properties:
        id:
          type: string
          description: What a conversation stores and a request names.
        name: { type: string }
        providerId:
          type: string
          description: The catalogue's brand for the model, for its icon. Empty when unknown.
        family: { type: string }
        reasoning: { type: boolean }
        toolCall: { type: boolean }
        attachment: { type: boolean }
        contextLimit:
          type: integer
          format: int64
          description: Zero when unknown.
        outputLimit:
          type: integer
          format: int64
          description: Zero when unknown.
        inputModalities:
          type: array
          items: { $ref: "#/components/schemas/InputModality" }
        reasoningEfforts:
          type: array
          description: |
            The thinking levels this model offers, lowest first, besides
            `auto`. Empty for a model with no control over its thinking. What
            the operator allows, within what the model has.
          items: { $ref: "#/components/schemas/ReasoningEffort" }

    CreateUploadRequest:
      type: object
      required: [filename, contentType, size]
      properties:
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }

    Upload:
      type: object
      required: [id, uploadUrl, url, expiresAt]
      properties:
        id: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    UserRole:
      type: string
      enum: [user, admin]

    SessionUser:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        avatarUrl: { $ref: "#/components/schemas/AvatarUrl" }

    AvatarUrl:
      type: string
      format: uri
      description: |
        An uploaded picture of the account, once accounts can have one. Absent
        today: every client draws an account as the first letter of its name
        on a colour derived from its id. No third-party avatar service is
        asked — that would tell it who is being looked at, from every page
        that shows a name.

    User:
      type: object
      required: [id, email, name, role, disabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        avatarUrl: { $ref: "#/components/schemas/AvatarUrl" }
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time, nullable: true }

    UserPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        total: { type: integer, format: int64 }
        page: { type: integer }
        limit: { type: integer }

    UsageKind:
      type: string
      description: |
        `chat` is a model request of a run; `title` is the background request
        that names a conversation.
      enum: [chat, title]
      # Named explicitly: bare `Chat` would collide with ApiFormat's `chat` and
      # make the generator rename both enums' constants.
      x-enum-varnames: [UsageKindChat, UsageKindTitle]

    UsageStatus:
      type: string
      description: A user stopping a reply is `ok`; only a failed request is `error`.
      enum: [ok, error]

    UsageLog:
      type: object
      required: [id, createdAt, kind, status, channelName, model, servedModel,
                 inputTokens, outputTokens, reasoningTokens, cacheReadTokens, cacheWriteTokens,
                 streamed, durationMs]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time, description: When the request started. }
        kind: { $ref: "#/components/schemas/UsageKind" }
        status: { $ref: "#/components/schemas/UsageStatus" }
        errorCode:
          type: string
          nullable: true
          description: The code the chat localises (model_auth, model_rate_limited, ...).
        errorMessage:
          type: string
          nullable: true
          description: Short, scrubbed and truncated; for operators.
        userId: { type: string, format: uuid, nullable: true }
        userName: { type: string, nullable: true }
        userEmail: { type: string, nullable: true }
        conversationId: { type: string, format: uuid, nullable: true }
        runId: { type: string, format: uuid, nullable: true }
        channelId: { type: string, format: uuid, nullable: true }
        channelName:
          type: string
          description: The channel's name when the request was made.
        model: { type: string, description: The model id the request asked for. }
        servedModel:
          type: string
          description: The model the provider says it served; empty when it did not say.
        inputTokens: { type: integer, format: int64, description: Excludes the cached part. }
        outputTokens: { type: integer, format: int64, description: Includes reasoning. }
        reasoningTokens: { type: integer, format: int64 }
        cacheReadTokens: { type: integer, format: int64 }
        cacheWriteTokens: { type: integer, format: int64 }
        inputPrice: { type: number, format: double, nullable: true, description: USD per million tokens. }
        outputPrice: { type: number, format: double, nullable: true }
        cacheReadPrice: { type: number, format: double, nullable: true }
        cacheWritePrice: { type: number, format: double, nullable: true }
        cost:
          type: number
          format: double
          nullable: true
          description: USD. Null when the price is unknown or the provider reported no usage.
        streamed: { type: boolean }
        firstTokenMs:
          type: integer
          format: int64
          nullable: true
          description: Request start to the first content, reasoning or tool-call delta.
        durationMs: { type: integer, format: int64 }

    UsageSummary:
      type: object
      required: [requests, errors, inputTokens, outputTokens, cost, cacheReadTokens, cacheWriteTokens]
      properties:
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cost: { type: number, format: double, description: USD; unpriced requests add nothing. }
        cacheReadTokens: { type: integer, format: int64, description: Of the successful requests. }
        cacheWriteTokens: { type: integer, format: int64, description: Of the successful requests. }
        cacheHitRate:
          type: number
          format: double
          nullable: true
          description: |
            Token-weighted: cacheReadTokens / (inputTokens + cacheReadTokens +
            cacheWriteTokens), over successful requests. Null when none sent a token.
        cacheSavings:
          type: number
          format: double
          nullable: true
          description: |
            USD the cached reads saved against the full input price, over the
            requests priced for both. Null when none were.

    UsageLogPage:
      type: object
      required: [items, total, page, limit, summary]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UsageLog" }
        total: { type: integer, format: int64 }
        page: { type: integer }
        limit: { type: integer }
        summary: { $ref: "#/components/schemas/UsageSummary" }

    Username:
      type: string
      minLength: 1
      maxLength: 80
      pattern: '^[^@]+$'
      description: |
        A username. `@` is excluded so that a username can never be spelled
        like an email address: sign-in accepts either, and if the two could
        collide, one account's username would shadow another's address.

    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email: { type: string, format: email }
        name: { $ref: "#/components/schemas/Username" }
        password: { type: string, minLength: 8, maxLength: 200 }

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: |
            An email address or a username. Not `format: email` — half the
            values it accepts are not addresses, and the server decides which
            kind it is rather than the caller declaring it.
        password: { type: string }

    UpdateMeRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        name: { $ref: "#/components/schemas/Username" }
        email: { type: string, format: email }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 200 }

    CreateUserRequest:
      type: object
      required: [email, name, password, role]
      properties:
        email: { type: string, format: email }
        name: { $ref: "#/components/schemas/Username" }
        password: { type: string, minLength: 8, maxLength: 200 }
        role: { $ref: "#/components/schemas/UserRole" }
        disabled: { type: boolean, default: false }

    UpdateUserRequest:
      type: object
      description: |
        Only the fields present are changed. Setting `password` signs the
        account out everywhere — the old sessions outlive the old credential
        otherwise.
      properties:
        name: { $ref: "#/components/schemas/Username" }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 200 }
        role: { $ref: "#/components/schemas/UserRole" }
        disabled: { type: boolean }

    CatalogStatus:
      type: object
      required: [providerCount, modelCount, stale]
      properties:
        fetchedAt:
          type: string
          format: date-time
          description: Absent when nothing has ever been fetched.
        providerCount: { type: integer }
        modelCount: { type: integer }
        stale:
          type: boolean
          description: Whether the snapshot is old enough to be worth refreshing.
        lastError:
          type: string
          description: |
            Why the most recent refresh failed, if it did. The snapshot it
            failed to replace is still the one being served.

    CatalogProvider:
      type: object
      required: [id, name, modelCount]
      properties:
        id: { type: string, examples: ["anthropic"] }
        name: { type: string, examples: ["Anthropic"] }
        modelCount: { type: integer }
        doc: { type: string, format: uri }
        env:
          type: array
          description: Environment variables upstream documents for this provider's key.
          items: { type: string }

    CatalogModel:
      type: object
      required:
        [providerId, providerName, modelId, name, enabled, attachment, reasoning,
         toolCall, structuredOutput]
      properties:
        providerId: { type: string }
        providerName: { type: string }
        modelId: { type: string }
        channels:
          type: array
          description: |
            The configured channels that have this model selected, disabled
            ones included — each entry's own `enabled` says which those are.
            Having it selected is what puts a model in this listing, so the
            array is never empty here and the catalogue alone never contributes
            a row.
          items: { $ref: "#/components/schemas/ModelChannel" }
        name: { type: string }
        description: { type: string }
        family: { type: string }
        enabled:
          type: boolean
          description: Whether at least one enabled channel has this model selected.
        attachment: { type: boolean }
        reasoning: { type: boolean }
        toolCall: { type: boolean }
        structuredOutput: { type: boolean }
        contextLimit: { type: integer, format: int64 }
        outputLimit: { type: integer, format: int64 }
        inputCost: { type: number, format: double, description: USD per million input tokens. }
        outputCost: { type: number, format: double, description: USD per million output tokens. }
        releaseDate: { type: string }
        knowledge: { type: string }
        inputModalities:
          type: array
          items: { type: string }
        outputModalities:
          type: array
          items: { type: string }
        inputLimit: { type: integer, format: int64 }
        defaults:
          description: What the catalogue says, before the operator's settings.
          allOf: [{ $ref: "#/components/schemas/ModelSettings" }]
        override: { $ref: "#/components/schemas/ModelOverride" }
        settings:
          description: How the model is actually offered and called.
          allOf: [{ $ref: "#/components/schemas/ModelSettings" }]

    ModelKind:
      type: string
      description: What a model is for. Only `text` models are offered in chat.
      enum: [text, image, embedding, rerank]

    InputModality:
      type: string
      description: What a model takes besides text.
      enum: [image, audio, video, pdf]

    ModelSettings:
      type: object
      required:
        [kind, reasoning, toolCall, inputModalities, contextLimit, inputLimit, outputLimit,
         reasoningEfforts]
      properties:
        kind: { $ref: "#/components/schemas/ModelKind" }
        reasoning: { type: boolean }
        toolCall: { type: boolean }
        inputModalities:
          type: array
          items: { $ref: "#/components/schemas/InputModality" }
        contextLimit: { type: integer, format: int64, description: Zero when unknown. }
        inputLimit: { type: integer, format: int64, description: Zero when unknown. }
        outputLimit: { type: integer, format: int64, description: Zero when unknown. }
        reasoningEfforts:
          type: array
          description: |
            The thinking levels offered, lowest first, besides `auto`. In
            `defaults`, every level the model has.
          items: { $ref: "#/components/schemas/ReasoningEffort" }

    ModelOverride:
      type: object
      description: |
        The operator's settings for a model. Null follows the catalogue.
      properties:
        kind:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ModelKind" }]
        reasoning: { type: boolean, nullable: true }
        toolCall: { type: boolean, nullable: true }
        inputModalities:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/InputModality" }
        contextLimit: { type: integer, format: int64, minimum: 1, nullable: true }
        inputLimit: { type: integer, format: int64, minimum: 1, nullable: true }
        outputLimit: { type: integer, format: int64, minimum: 1, nullable: true }
        reasoningEfforts:
          type: array
          nullable: true
          description: |
            The levels people may choose. Null offers every level the model
            has; empty offers none. `auto` is always available and is not
            listed.
          items: { $ref: "#/components/schemas/ReasoningEffort" }

    ModelChannel:
      type: object
      required: [id, name, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        enabled:
          type: boolean
          description: Whether the channel itself is switched on, not the model.

    CatalogModelPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogModel" }
        total: { type: integer, format: int64 }
        page: { type: integer }
        limit: { type: integer }

    SystemSettings:
      type: object
      required: [debugLogging, generativeUi, askUser, memory, taskModel]
      properties:
        taskModel:
          type: string
          description: |
            The model background tasks use — for now, titling a conversation
            after its first answer. Empty: each conversation's own model.
        generativeUi:
          type: boolean
          description: |
            Whether models are taught to answer with interface components
            (`openchat-ui` blocks). Off by default: the catalogue adds a few
            thousand tokens to every request's system prompt.
        askUser:
          type: boolean
          description: |
            Whether models are offered the `ask_user` tool, with which they put
            multiple-choice questions to the user and wait for the answers.
            On by default. Takes effect at the next model request, including
            for runs in progress.
        memory:
          type: boolean
          description: |
            The kill switch for personal memory. Off, no conversation reads or
            writes memories and the memory tool is not offered; people can still
            see and delete theirs, and their custom instructions still apply.
            On by default. Administrators cannot read anyone's memories either way.
        debugLogging:
          type: boolean
          description: |
            Whether the server logs at debug level. Takes effect immediately —
            no restart — and persists across one, because the fault worth
            chasing is usually the intermittent kind.

    UpdateSystemSettingsRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        debugLogging: { type: boolean }
        generativeUi: { type: boolean }
        askUser: { type: boolean }
        memory: { type: boolean }
        taskModel:
          type: string
          description: |
            A model an enabled channel offers (400 `model_unavailable`
            otherwise), or empty for each conversation's own.

    WebSearchProvider:
      type: string
      description: |
        The search service. `free` takes the keyless public tiers of Exa,
        Parallel, Firecrawl and Keenable in turn, moving to the next when one
        is rate-limiting or failing; it needs no key and suits light use.
        `tavily` is Tavily's API with the stored key.
      enum: [free, tavily]

    WebSearchCompression:
      type: string
      description: |
        What a result gives the model, and so how much of its context a search
        costs. `snippet` is the search service's own excerpt. `truncate` is the
        page's text cut to `truncateLength` characters. `none` is the page's
        text whole, still bounded by a hard ceiling per result.
      enum: [snippet, truncate, none]

    WebSearchDepth:
      type: string
      description: |
        Tavily's search depth. `advanced` finds more relevant excerpts and
        costs two credits a search instead of one.
      enum: [basic, advanced]

    WebSearchSettings:
      type: object
      required:
        [enabled, provider, keySet, maxResults, depth, compression, truncateLength, blocklist]
      properties:
        enabled:
          type: boolean
          description: |
            Whether runs are offered the web_search tool. Tavily also needs a
            stored key; without one the tool is not offered.
        provider: { $ref: "#/components/schemas/WebSearchProvider" }
        keySet:
          type: boolean
          description: Whether an API key is stored. Write-only, like a channel's.
        keyPreview:
          type: string
          description: The key's last four characters, e.g. `…4f2a`.
        maxResults:
          type: integer
          minimum: 1
          maximum: 20
          description: Results per search. A model may ask for fewer, never more.
        depth: { $ref: "#/components/schemas/WebSearchDepth" }
        compression: { $ref: "#/components/schemas/WebSearchCompression" }
        truncateLength:
          type: integer
          minimum: 200
          maximum: 20000
          description: Characters kept per result under `truncate`.
        blocklist:
          type: array
          maxItems: 500
          description: |
            Sites no search returns and web_fetch refuses to read. One rule per
            entry: a domain (`example.com`, which covers its subdomains), a
            wildcard (`*.example.com`), or a regular expression between slashes
            (`/\.pdf$/`) matched against the whole URL.
          items: { type: string, maxLength: 300 }

    UpdateWebSearchSettingsRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        enabled: { type: boolean }
        provider: { $ref: "#/components/schemas/WebSearchProvider" }
        apiKey:
          type: string
          maxLength: 500
          description: The search service's API key. Empty removes the stored one.
        maxResults: { type: integer, minimum: 1, maximum: 20 }
        depth: { $ref: "#/components/schemas/WebSearchDepth" }
        compression: { $ref: "#/components/schemas/WebSearchCompression" }
        truncateLength: { type: integer, minimum: 200, maximum: 20000 }
        blocklist:
          type: array
          maxItems: 500
          items: { type: string, maxLength: 300 }

    WebSearchTestRequest:
      type: object
      properties:
        query:
          type: string
          maxLength: 300
          description: What to search for. A fixed query when absent.
        apiKey:
          type: string
          maxLength: 500
          description: A key to try before saving it. The stored key when absent.

    WebSearchTestResult:
      type: object
      required: [ok, latencyMs, results]
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer, format: int64 }
        error:
          type: string
          description: Why the search failed, in English, when it did.
        results:
          type: array
          description: What the model would have been given, after the blocklist.
          items: { $ref: "#/components/schemas/WebSearchTestHit" }
        blocked:
          type: integer
          description: Results the blocklist removed.
        servedBy:
          type: string
          description: Which service answered, for the free search (exa, parallel, firecrawl, keenable).

    WebSearchTestHit:
      type: object
      required: [title, url, content]
      properties:
        title: { type: string }
        url: { type: string }
        content: { type: string }

    StorageDriver:
      type: string
      description: Where new uploads go.
      enum: [local, s3]

    StorageS3Settings:
      type: object
      required: [endpoint, region, bucket, accessKeyId, pathStyle, secretKeySet]
      properties:
        endpoint:
          type: string
          description: The service's base URL (MinIO, R2, ...). Empty is AWS itself.
        region: { type: string }
        bucket: { type: string }
        accessKeyId: { type: string }
        pathStyle:
          type: boolean
          description: Address the bucket in the URL path rather than the host name. MinIO needs it.
        secretKeySet:
          type: boolean
          description: Whether a secret access key is stored. Write-only, like a channel's key.
        secretKeyPreview:
          type: string
          description: The secret's last four characters, e.g. `…4f2a`.

    StorageSettings:
      type: object
      required: [driver, localDir, resolvedLocalDir, publicUrl, s3]
      properties:
        driver: { $ref: "#/components/schemas/StorageDriver" }
        localDir:
          type: string
          description: The local driver's directory, as entered. Relative paths are relative to the server's working directory.
        resolvedLocalDir:
          type: string
          description: The `localDir` as an absolute path on the server.
        publicUrl:
          type: string
          description: |
            The origin the local driver's URLs are issued under. Empty issues
            them relative, which is right when the web app and the API share an
            origin.
        s3: { $ref: "#/components/schemas/StorageS3Settings" }

    UpdateStorageS3Settings:
      type: object
      description: Only the fields present are changed.
      properties:
        endpoint: { type: string, maxLength: 500 }
        region: { type: string, maxLength: 100 }
        bucket: { type: string, maxLength: 255 }
        accessKeyId: { type: string, maxLength: 500 }
        secretAccessKey:
          type: string
          maxLength: 500
          description: The secret access key. Absent keeps the stored one; empty removes it.
        pathStyle: { type: boolean }

    UpdateStorageSettingsRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        driver: { $ref: "#/components/schemas/StorageDriver" }
        localDir: { type: string, maxLength: 1000 }
        publicUrl:
          type: string
          maxLength: 500
          description: An http(s) origin with no path. Empty removes it.
        s3: { $ref: "#/components/schemas/UpdateStorageS3Settings" }

    StorageTestResult:
      type: object
      required: [ok, latencyMs]
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer, format: int64 }
        error:
          type: string
          description: Why the probe failed, in English, when it did.

    ChannelType:
      type: string
      description: |
        The vendor an operator picks. Most of these speak the OpenAI wire
        protocol and differ only in endpoint and branding — which is the point:
        choosing a protocol is a question the operator should not have to
        answer, so the type answers it for them. `GET /admin/channel-types`
        carries the full table.
      enum: [openai, anthropic, gemini, openrouter, deepseek, siliconflow, moonshot, zhipu, dashscope, volcengine, minimax, xai, groq, ollama, mistral, stepfun, hunyuan, qianfan, mimo, together, fireworks, nvidia, modelscope, cerebras, opencode-go, lmstudio, openai-compatible]

    WireApi:
      type: string
      description: The protocol a channel type speaks. Three adapters serve every type.
      enum: [openai, anthropic, gemini]

    ChannelTypeGroup:
      type: string
      description: |
        The tab the channel picker files a vendor under: the model makers
        themselves, the platforms that host or route other people's models, and
        servers the operator runs (plus the generic relay).
      enum: [vendor, platform, custom]

    ApiFormat:
      type: string
      description: |
        Which of OpenAI's request formats a channel on the OpenAI protocol
        sends: Chat Completions (`chat`, served by nearly every compatible
        endpoint) or the Responses API (`responses`). Ignored on other
        protocols, and on a type that routes each model itself.
      enum: [chat, responses]

    ChannelTypeInfo:
      type: object
      required: [id, label, wireApi, endpoint, keyHint, iconId, group, keyOptional, apiFormatChoice]
      properties:
        id: { $ref: "#/components/schemas/ChannelType" }
        label:
          type: string
          description: A brand name, deliberately not translated — it reads the same in both locales.
        wireApi: { $ref: "#/components/schemas/WireApi" }
        endpoint:
          type: string
          description: The default base URL, empty for a type that has none to offer.
        keyHint: { type: string }
        iconId:
          type: string
          description: |
            The brand mark, which is not always the type id: `anthropic` is
            drawn with the Claude mark. Empty when there is no brand to draw.
        doc: { type: string, format: uri }
        group: { $ref: "#/components/schemas/ChannelTypeGroup" }
        keyOptional:
          type: boolean
          description: |
            Whether the endpoint is normally reached without a credential — a
            service on the operator's own machine. The form then lets a model
            list be fetched with the key left blank.
        apiFormatChoice:
          type: boolean
          description: |
            Whether the operator chooses the request format (`ApiFormat`) for a
            channel of this type: true for the OpenAI protocol, false where the
            protocol has one format or the type routes each model itself.

    ChannelModel:
      type: object
      required: [modelId, displayName, enabled, source]
      properties:
        modelId:
          type: string
          description: As the endpoint spells it, which is what gets sent back to it.
        displayName: { type: string }
        enabled:
          type: boolean
          description: Whether this installation offers the model. Ours to decide, never the refresh's.
        source:
          type: string
          description: |
            `fetched` came from the endpoint's own model list; `manual` was
            typed in, for an endpoint that does not publish one or omits a
            model it actually serves.
          enum: [fetched, manual]
        catalog:
          allOf: [{ $ref: "#/components/schemas/CatalogModel" }]
          description: |
            What models.dev knows about this model, when it knows anything.
            Absent is ordinary: the endpoint is the authority on which models
            exist, and the catalogue only decorates them.
        fetchedAt: { type: string, format: date-time }

    ChannelModelRefresh:
      type: object
      required: [total, added, removed]
      properties:
        total: { type: integer }
        added: { type: integer }
        removed:
          type: integer
          description: Models the endpoint no longer lists. Their enabled state goes with them.

    Channel:
      type: object
      required: [id, name, type, wireApi, apiFormat, enabled, hasKey, sortOrder, createdAt, modelCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: What the operator calls this connection. }
        type: { $ref: "#/components/schemas/ChannelType" }
        wireApi: { $ref: "#/components/schemas/WireApi" }
        apiFormat: { $ref: "#/components/schemas/ApiFormat" }
        baseUrl:
          type: string
          description: Overrides the provider's default endpoint. Empty means use the default.
        enabled: { type: boolean }
        modelCount:
          type: integer
          description: How many models this channel offers, i.e. has enabled.
        hasKey:
          type: boolean
          description: Whether a credential is stored. The credential itself is never returned.
        keyPreview:
          type: string
          description: |
            The last four characters, for telling two keys apart in the UI —
            e.g. `…4f2a`. Absent when no key is stored.
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }

    ChannelConnection:
      type: object
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/ChannelType" }
        baseUrl: { type: string, maxLength: 500 }
        apiKey: { type: string, maxLength: 500 }

    ChannelModelInput:
      type: object
      required: [modelId, displayName, source]
      properties:
        modelId: { type: string, minLength: 1, maxLength: 200 }
        displayName: { type: string, maxLength: 500 }
        source:
          type: string
          enum: [fetched, manual]
          description: Manual entries survive refreshes even when the endpoint does not advertise them.

    CreateChannelRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        type: { $ref: "#/components/schemas/ChannelType" }
        baseUrl: { type: string, maxLength: 500 }
        apiKey: { type: string, maxLength: 500 }
        enabled: { type: boolean, default: true }
        apiFormat: { $ref: "#/components/schemas/ApiFormat" }
        models:
          type: array
          maxItems: 2000
          description: Selected models, created enabled in the same transaction as the channel.
          items: { $ref: "#/components/schemas/ChannelModelInput" }

    UpdateChannelRequest:
      type: object
      description: |
        Only the fields present are changed. An absent `apiKey` keeps the
        stored one; an empty string clears it. There is no way to read a key
        back, so a form that wants to leave it alone must omit the field.
      properties:
        type: { $ref: "#/components/schemas/ChannelType" }
        name: { type: string, minLength: 1, maxLength: 80 }
        baseUrl: { type: string, maxLength: 500 }
        apiKey: { type: string, maxLength: 500 }
        enabled: { type: boolean }
        sortOrder: { type: integer }
        apiFormat: { $ref: "#/components/schemas/ApiFormat" }

    DashboardRange:
      type: string
      enum: ["24h", "7d", "30d", "90d"]
      default: "7d"

    DashboardKpis:
      type: object
      required:
        [requests, errors, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, cost, activeUsers]
      properties:
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64, description: Excluding the cached part. }
        outputTokens: { type: integer, format: int64 }
        cacheReadTokens: { type: integer, format: int64 }
        cacheWriteTokens: { type: integer, format: int64 }
        cacheHitRate:
          type: number
          format: double
          nullable: true
          description: As in UsageSummary; null when no successful request sent a token.
        cacheSavings:
          type: number
          format: double
          nullable: true
          description: As in UsageSummary.
        cost: { type: number, format: double, description: USD; unpriced requests add nothing. }
        activeUsers: { type: integer, format: int64, description: Distinct accounts that made a request. }
        firstTokenP50Ms: { type: number, format: double, nullable: true, description: Of successful requests that have one. }
        firstTokenP95Ms: { type: number, format: double, nullable: true }

    DashboardTrendPoint:
      type: object
      required: [at, requests, errors, cost]
      properties:
        at: { type: string, format: date-time, description: Start of the hour or day. }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        cost: { type: number, format: double }

    DashboardModel:
      type: object
      required: [model, requests, errors, inputTokens, outputTokens, cacheReadTokens, cost]
      properties:
        model: { type: string }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cacheReadTokens: { type: integer, format: int64 }
        cacheHitRate: { type: number, format: double, nullable: true }
        cost: { type: number, format: double }
        firstTokenP50Ms: { type: number, format: double, nullable: true }

    DashboardChannel:
      type: object
      required: [channelName, requests, errors]
      properties:
        channelId:
          type: string
          format: uuid
          nullable: true
          description: Null once the channel was deleted; its history keeps the name.
        channelName: { type: string }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        firstTokenP50Ms: { type: number, format: double, nullable: true }
        firstTokenP95Ms: { type: number, format: double, nullable: true }
        durationP50Ms: { type: number, format: double, nullable: true }
        durationP95Ms: { type: number, format: double, nullable: true }
        lastErrorAt: { type: string, format: date-time, nullable: true }

    DashboardUser:
      type: object
      required: [requests, cost]
      properties:
        userId: { type: string, format: uuid, nullable: true }
        userName: { type: string, nullable: true }
        userEmail: { type: string, nullable: true }
        requests: { type: integer, format: int64 }
        cost: { type: number, format: double }

    DashboardError:
      type: object
      required: [id, createdAt, model, channelName]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        model: { type: string }
        channelName: { type: string }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }

    AdminDashboard:
      type: object
      required: [range, since, bucket, totalUsers, current, previous, trend, models, channels, users, errors]
      properties:
        range: { $ref: "#/components/schemas/DashboardRange" }
        since: { type: string, format: date-time, description: Start of the window. }
        bucket: { type: string, enum: [hour, day], description: What one trend point spans. }
        totalUsers: { type: integer, format: int64, description: Enabled accounts. }
        current: { $ref: "#/components/schemas/DashboardKpis" }
        previous: { $ref: "#/components/schemas/DashboardKpis" }
        trend:
          type: array
          items: { $ref: "#/components/schemas/DashboardTrendPoint" }
        models:
          type: array
          description: Busiest first, at most 8.
          items: { $ref: "#/components/schemas/DashboardModel" }
        channels:
          type: array
          description: Busiest first, at most 8.
          items: { $ref: "#/components/schemas/DashboardChannel" }
        users:
          type: array
          description: Highest spend first, at most 8.
          items: { $ref: "#/components/schemas/DashboardUser" }
        errors:
          type: array
          description: Latest failures first, at most 8.
          items: { $ref: "#/components/schemas/DashboardError" }

    BulkUpdateUsersRequest:
      type: object
      required: [userIds]
      description: Exactly one of `role` or `disabled` must be given.
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/UserRole" }
        disabled: { type: boolean }

    BulkSkipReason:
      type: string
      description: |
        `self` — the caller's own account, which cannot be demoted or disabled.
        `not_found` — no such account.
      enum: [self, not_found]

    BulkSkipped:
      type: object
      required: [userId, reason]
      properties:
        userId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/BulkSkipReason" }

    BulkUpdateResult:
      type: object
      required: [updated, skipped]
      properties:
        updated: { type: integer }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/BulkSkipped" }
