openapi: 3.1.0
info:
  title: OpenChat API
  version: 0.1.0
  description: |
    OpenChat backend contract. This file is the single source of truth:
      - Go server interfaces are generated by oapi-codegen  -> apps/server/internal/api
      - TypeScript types are generated by openapi-typescript -> packages/api-client/src/schema.d.ts
servers:
  - url: /api/v1
# Every operation needs a session cookie unless it says otherwise.
security:
  - sessionCookie: []

tags:
  - name: system
  - name: auth
  - name: admin
  - name: conversations
  - name: messages
  - name: files

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        "200":
          description: service is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/register:
    post:
      tags: [auth]
      summary: Create an account and start a session
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: created, session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        default: { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      tags: [auth]
      summary: Start a session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: signed in, session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        default: { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      operationId: logout
      responses:
        "204": { description: signed out, cookie cleared }
        default: { $ref: "#/components/responses/Error" }

  /auth/session:
    get:
      tags: [auth]
      summary: Who the current session belongs to
      operationId: getSession
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "401":
          description: not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /auth/me:
    patch:
      tags: [auth]
      summary: Change your own name or email
      description: |
        Separate from the admin endpoint because the two differ in what they
        may touch: this one cannot reach `role` or `disabled` at all, so a
        self-service form has no path to privilege escalation.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        default: { $ref: "#/components/responses/Error" }

  /auth/password:
    post:
      tags: [auth]
      summary: Change your own password
      description: |
        Requires the current password, which the admin endpoint does not — an
        admin acts on an account they do not own, whereas here the point is to
        prove the person at the keyboard is the account holder.

        Every other session is dropped; the one making the request survives, so
        changing your password does not sign you out of the tab you are in.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: changed, other sessions revoked }
        default: { $ref: "#/components/responses/Error" }

  /admin/stats:
    get:
      tags: [admin]
      summary: Dashboard totals and activity trend
      operationId: getAdminStats
      parameters:
        - name: days
          in: query
          description: Length of the trend window.
          schema: { type: integer, minimum: 7, maximum: 90, default: 30 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStats" }
        default: { $ref: "#/components/responses/Error" }

  /admin/users:
    get:
      tags: [admin]
      summary: List accounts
      operationId: listUsers
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: search
          in: query
          description: Matches against email and name.
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        default: { $ref: "#/components/responses/Error" }

    post:
      tags: [admin]
      summary: Create an account
      description: |
        The account is usable immediately; no invitation or verification step
        exists. Unlike registration, the role is chosen by the caller rather
        than derived from whether the table is empty.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /admin/catalog:
    get:
      tags: [admin]
      summary: Catalogue freshness
      operationId: getCatalogStatus
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogStatus" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Refresh the catalogue from models.dev
      description: |
        Fetches the upstream file and replaces the snapshot. A failed fetch
        leaves the previous snapshot in place — a stale catalogue is worth more
        than an empty one — and answers 502 rather than 200, because the refresh
        is what failed. The snapshot being served is unchanged, and `GET` on
        this path reports why through `lastError`.
      operationId: refreshCatalog
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogStatus" }
        default: { $ref: "#/components/responses/Error" }

  /admin/catalog/providers:
    get:
      tags: [admin]
      summary: Providers in the catalogue
      description: The source for the provider picker when adding a channel.
      operationId: listCatalogProviders
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogProvider" }
        default: { $ref: "#/components/responses/Error" }

  /admin/catalog/models:
    get:
      tags: [admin]
      summary: Browse the model catalogue
      operationId: listCatalogModels
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: search
          in: query
          description: Matches against model id, name and family.
          schema: { type: string }
        - name: providerId
          in: query
          schema: { type: string }
        - name: capability
          in: query
          description: Only models with all of these.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [reasoning, toolCall, attachment, structuredOutput]
        - name: enabled
          in: query
          description: Restrict to models that are, or are not, switched on here.
          schema: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogModelPage" }
        default: { $ref: "#/components/responses/Error" }

  /admin/catalog/models/{providerId}/{modelId}:
    parameters:
      - { name: providerId, in: path, required: true, schema: { type: string } }
      - { name: modelId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [admin]
      summary: Switch a model on or off for this installation
      operationId: updateCatalogModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogModel" }
        default: { $ref: "#/components/responses/Error" }

  /admin/system:
    get:
      tags: [admin]
      summary: Server-wide settings
      operationId: getSystemSettings
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change server-wide settings
      operationId: updateSystemSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSystemSettingsRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSettings" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channels:
    get:
      tags: [admin]
      summary: List channels
      operationId: listChannels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Add a channel
      operationId: createChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChannelRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        default: { $ref: "#/components/responses/Error" }

  /admin/channels/{channelId}:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin]
      summary: Change a channel
      operationId: updateChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateChannelRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Remove a channel
      description: |
        Unlike accounts, a channel owns no user data — deleting one removes a
        connection, not anybody's history. It is therefore a real delete.
      operationId: deleteChannel
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }

  /admin/users/bulk:
    post:
      tags: [admin]
      summary: Apply one change to several accounts
      description: |
        Applied in a single transaction. Accounts the caller may not change are
        reported in `skipped` rather than failing the whole request; a change
        that would leave no enabled admin is refused outright.
      operationId: bulkUpdateUsers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkUpdateUsersRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkUpdateResult" }
        default: { $ref: "#/components/responses/Error" }

  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin]
      summary: Change an account's role or enabled state
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /conversations:
    get:
      tags: [conversations]
      summary: List conversations
      operationId: listConversations
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: a page of conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [conversations]
      summary: Create a conversation
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversationRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [conversations]
      summary: Get a conversation
      operationId: getConversation
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [conversations]
      summary: Rename or update a conversation
      operationId: updateConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConversationRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [conversations]
      summary: Delete a conversation
      operationId: deleteConversation
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }

  /conversations/{conversationId}/messages:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [messages]
      summary: List messages in a conversation
      operationId: listMessages
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: a page of messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [messages]
      summary: Append a user message and stream the assistant reply
      description: |
        Responds with `text/event-stream`. Each SSE `data:` frame is a JSON
        `StreamEvent`. The stream terminates with a `done` event.
      operationId: createMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMessageRequest" }
      responses:
        "200":
          description: server-sent event stream of StreamEvent frames
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /files:
    post:
      tags: [files]
      summary: Issue a presigned upload URL for blob storage
      operationId: createUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUploadRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: openchat_session
      description: |
        HttpOnly, SameSite=Lax session cookie issued by /auth/login and
        /auth/register. It is never readable from JavaScript, so clients ask
        /auth/session rather than inspecting it.

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: ["not_found"] }
        message: { type: string }
        # Set when one specific input caused the failure, so a form can show the
        # message next to the offending field instead of as a banner.
        field: { type: string, examples: ["email"] }
        details: { type: object, additionalProperties: true }

    Role:
      type: string
      enum: [system, user, assistant, tool]

    MessageStatus:
      type: string
      enum: [pending, streaming, complete, failed]

    Conversation:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        model: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        nextCursor: { type: string, nullable: true }

    CreateConversationRequest:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        model: { type: string }

    UpdateConversationRequest:
      type: object
      properties:
        title: { type: string, maxLength: 200 }

    Attachment:
      type: object
      required: [id, filename, contentType, size, url]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }
        url: { type: string, format: uri }

    Message:
      type: object
      required: [id, conversationId, role, content, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        content: { type: string }
        status: { $ref: "#/components/schemas/MessageStatus" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        createdAt: { type: string, format: date-time }

    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        nextCursor: { type: string, nullable: true }

    CreateMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        model: { type: string }
        attachmentIds:
          type: array
          items: { type: string, format: uuid }

    StreamEvent:
      description: One SSE frame emitted by createMessage.
      oneOf:
        - $ref: "#/components/schemas/StreamStart"
        - $ref: "#/components/schemas/StreamDelta"
        - $ref: "#/components/schemas/StreamDone"
        - $ref: "#/components/schemas/StreamError"
      discriminator:
        propertyName: type
        # Explicit mapping so generators emit the literal values ("start", …)
        # rather than inferring them from the schema names.
        mapping:
          start: "#/components/schemas/StreamStart"
          delta: "#/components/schemas/StreamDelta"
          done: "#/components/schemas/StreamDone"
          error: "#/components/schemas/StreamError"

    StreamStart:
      type: object
      required: [type, messageId]
      properties:
        type: { type: string, const: start }
        messageId: { type: string, format: uuid }

    StreamDelta:
      type: object
      required: [type, text]
      properties:
        type: { type: string, const: delta }
        text: { type: string }

    StreamDone:
      type: object
      required: [type, message]
      properties:
        type: { type: string, const: done }
        message: { $ref: "#/components/schemas/Message" }

    StreamError:
      type: object
      required: [type, error]
      properties:
        type: { type: string, const: error }
        error: { $ref: "#/components/schemas/Error" }

    CreateUploadRequest:
      type: object
      required: [filename, contentType, size]
      properties:
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }

    Upload:
      type: object
      required: [id, uploadUrl, url, expiresAt]
      properties:
        id: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    UserRole:
      type: string
      enum: [user, admin]

    SessionUser:
      type: object
      required: [id, email, name, role, avatarUrl]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        avatarUrl: { $ref: "#/components/schemas/AvatarUrl" }

    AvatarUrl:
      type: string
      format: uri
      description: |
        Where to fetch this account's picture. Derived from the address rather
        than stored, so it is the server's answer to "what does this person
        look like" and not a column — when uploads exist, this field points at
        them instead and no caller changes.

        It resolves to 404 when the address has no picture registered, which is
        the signal to fall back to initials.

    User:
      type: object
      required: [id, email, name, role, disabled, createdAt, avatarUrl]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        avatarUrl: { $ref: "#/components/schemas/AvatarUrl" }
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time, nullable: true }

    UserPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        total: { type: integer, format: int64 }
        page: { type: integer }
        limit: { type: integer }

    Username:
      type: string
      minLength: 1
      maxLength: 80
      pattern: '^[^@]+$'
      description: |
        A username. `@` is excluded so that a username can never be spelled
        like an email address: sign-in accepts either, and if the two could
        collide, one account's username would shadow another's address.

    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email: { type: string, format: email }
        name: { $ref: "#/components/schemas/Username" }
        password: { type: string, minLength: 8, maxLength: 200 }

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: |
            An email address or a username. Not `format: email` — half the
            values it accepts are not addresses, and the server decides which
            kind it is rather than the caller declaring it.
        password: { type: string }

    UpdateMeRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        name: { $ref: "#/components/schemas/Username" }
        email: { type: string, format: email }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 200 }

    CreateUserRequest:
      type: object
      required: [email, name, password, role]
      properties:
        email: { type: string, format: email }
        name: { $ref: "#/components/schemas/Username" }
        password: { type: string, minLength: 8, maxLength: 200 }
        role: { $ref: "#/components/schemas/UserRole" }
        disabled: { type: boolean, default: false }

    UpdateUserRequest:
      type: object
      description: |
        Only the fields present are changed. Setting `password` signs the
        account out everywhere — the old sessions outlive the old credential
        otherwise.
      properties:
        name: { $ref: "#/components/schemas/Username" }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 200 }
        role: { $ref: "#/components/schemas/UserRole" }
        disabled: { type: boolean }

    CatalogStatus:
      type: object
      required: [providerCount, modelCount, stale]
      properties:
        fetchedAt:
          type: string
          format: date-time
          description: Absent when nothing has ever been fetched.
        providerCount: { type: integer }
        modelCount: { type: integer }
        stale:
          type: boolean
          description: Whether the snapshot is old enough to be worth refreshing.
        lastError:
          type: string
          description: |
            Why the most recent refresh failed, if it did. The snapshot it
            failed to replace is still the one being served.

    CatalogProvider:
      type: object
      required: [id, name, modelCount]
      properties:
        id: { type: string, examples: ["anthropic"] }
        name: { type: string, examples: ["Anthropic"] }
        modelCount: { type: integer }
        doc: { type: string, format: uri }
        env:
          type: array
          description: Environment variables upstream documents for this provider's key.
          items: { type: string }

    CatalogModel:
      type: object
      required:
        [providerId, providerName, modelId, name, enabled, attachment, reasoning,
         toolCall, structuredOutput]
      properties:
        providerId: { type: string }
        providerName: { type: string }
        modelId: { type: string }
        name: { type: string }
        description: { type: string }
        family: { type: string }
        enabled:
          type: boolean
          description: Whether this installation has switched the model on.
        attachment: { type: boolean }
        reasoning: { type: boolean }
        toolCall: { type: boolean }
        structuredOutput: { type: boolean }
        contextLimit: { type: integer, format: int64 }
        outputLimit: { type: integer, format: int64 }
        inputCost: { type: number, format: double, description: USD per million input tokens. }
        outputCost: { type: number, format: double, description: USD per million output tokens. }
        releaseDate: { type: string }
        knowledge: { type: string }
        inputModalities:
          type: array
          items: { type: string }
        outputModalities:
          type: array
          items: { type: string }

    CatalogModelPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogModel" }
        total: { type: integer, format: int64 }
        page: { type: integer }
        limit: { type: integer }

    SystemSettings:
      type: object
      required: [debugLogging]
      properties:
        debugLogging:
          type: boolean
          description: |
            Whether the server logs at debug level. Takes effect immediately —
            no restart — and persists across one, because the fault worth
            chasing is usually the intermittent kind.

    UpdateSystemSettingsRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        debugLogging: { type: boolean }

    Channel:
      type: object
      required: [id, name, providerId, enabled, hasKey, sortOrder, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: What the operator calls this connection. }
        providerId:
          type: string
          description: |
            A models.dev provider id (`openai`, `anthropic`, …). It selects the
            catalogue entry and the brand icon, so it is an identifier rather
            than a label.
        baseUrl:
          type: string
          description: Overrides the provider's default endpoint. Empty means use the default.
        enabled: { type: boolean }
        hasKey:
          type: boolean
          description: Whether a credential is stored. The credential itself is never returned.
        keyPreview:
          type: string
          description: |
            The last four characters, for telling two keys apart in the UI —
            e.g. `…4f2a`. Absent when no key is stored.
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }

    CreateChannelRequest:
      type: object
      required: [name, providerId]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        providerId: { type: string, minLength: 1, maxLength: 80 }
        baseUrl: { type: string, maxLength: 500 }
        apiKey: { type: string, maxLength: 500 }
        enabled: { type: boolean, default: true }

    UpdateChannelRequest:
      type: object
      description: |
        Only the fields present are changed. An absent `apiKey` keeps the
        stored one; an empty string clears it. There is no way to read a key
        back, so a form that wants to leave it alone must omit the field.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        providerId: { type: string, minLength: 1, maxLength: 80 }
        baseUrl: { type: string, maxLength: 500 }
        apiKey: { type: string, maxLength: 500 }
        enabled: { type: boolean }
        sortOrder: { type: integer }

    AdminStats:
      type: object
      required: [totals, trend]
      properties:
        totals: { $ref: "#/components/schemas/AdminTotals" }
        trend:
          type: array
          items: { $ref: "#/components/schemas/TrendPoint" }

    AdminTotals:
      type: object
      required:
        [totalUsers, activeUsers, totalConversations, totalMessages, newUsers7d, messages7d]
      properties:
        totalUsers: { type: integer, format: int64 }
        activeUsers: { type: integer, format: int64 }
        totalConversations: { type: integer, format: int64 }
        totalMessages: { type: integer, format: int64 }
        newUsers7d: { type: integer, format: int64 }
        messages7d: { type: integer, format: int64 }

    TrendPoint:
      type: object
      required: [day, messages, conversations, users]
      properties:
        day: { type: string, format: date }
        messages: { type: integer, format: int64 }
        conversations: { type: integer, format: int64 }
        users: { type: integer, format: int64 }

    BulkUpdateUsersRequest:
      type: object
      required: [userIds]
      description: Exactly one of `role` or `disabled` must be given.
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/UserRole" }
        disabled: { type: boolean }

    BulkSkipReason:
      type: string
      description: |
        `self` — the caller's own account, which cannot be demoted or disabled.
        `not_found` — no such account.
      enum: [self, not_found]

    BulkSkipped:
      type: object
      required: [userId, reason]
      properties:
        userId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/BulkSkipReason" }

    BulkUpdateResult:
      type: object
      required: [updated, skipped]
      properties:
        updated: { type: integer }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/BulkSkipped" }
