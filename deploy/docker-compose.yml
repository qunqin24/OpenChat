# Production: Postgres and OpenChat, with Caddy in front for HTTPS.
#
#   cp deploy/.env.example deploy/.env      # then edit it
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Run from the repository root. The app image is pulled from GitHub's
# registry; add --build to build it from this checkout instead.
# Attachments are kept on the `openchat-data` volume (the local storage driver);
# switch to S3 later in 后台 → 文件存储 without touching this file.
name: openchat

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: openchat
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openchat -d openchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  openchat:
    # The image the release workflow publishes for every version tag. Pin a
    # version (…/openchat:1.0.0) to choose when to upgrade; `--build` builds
    # this checkout instead.
    image: ${OPENCHAT_IMAGE:-ghcr.io/qunqin24/openchat:latest}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # production: session cookies are Secure, so the site must be reached
      # over HTTPS (Caddy below). For a plain-HTTP trial set it to development.
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://openchat:${POSTGRES_PASSWORD}@postgres:5432/openchat?sslmode=disable
      CORS_ORIGINS: https://${DOMAIN:-localhost}
    volumes:
      - openchat-data:/app/data
    # Reachable only through Caddy. For a trial without a domain, publish it
    # directly instead: ports: ["8080:8080"] (and APP_ENV=development).
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - openchat
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  openchat-data:
  caddy-data:
  caddy-config:
