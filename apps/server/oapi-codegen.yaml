# Generates chi server interfaces + models from ../../api/openapi.yaml.
# Plain `chi-server` (not strict-server) is deliberate: the message endpoint
# streams SSE and needs the raw http.ResponseWriter.
package: api
output: internal/api/openapi.gen.go
generate:
  chi-server: true
  models: true
  # No embedded spec: nothing reads it at run time, and it was the only thing
  # that pulled in kin-openapi (a dependency with advisories of its own).
  embedded-spec: false
output-options:
  skip-prune: true
  nullable-type: true
