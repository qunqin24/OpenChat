<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- The OpenChat mark with no tile: six circles sharing one tangent point,
       brightening outward. Used as an alpha mask (sidebar, welcome), so only
       its opacity matters; the colour comes from the surface. -->
  <g stroke="#000" stroke-width="1.3">
    <circle cx="29" cy="16" r="2"  stroke-opacity="0.40" />
    <circle cx="26.4" cy="16" r="4.6"  stroke-opacity="0.52" />
    <circle cx="23.8" cy="16" r="7.2"  stroke-opacity="0.64" />
    <circle cx="21.2" cy="16" r="9.8"  stroke-opacity="0.76" />
    <circle cx="18.6" cy="16" r="12.4"  stroke-opacity="0.88" />
    <circle cx="16" cy="16" r="15"  stroke-opacity="1.00" />
  </g>
</svg>
