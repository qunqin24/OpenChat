  <g stroke="#E8ECF2" stroke-width="1.5" transform="translate(16 16) scale(.78) translate(-16 -16)">
    <circle cx="29" cy="16" r="2"  stroke-opacity="0.40" />
    <circle cx="26.4" cy="16" r="4.6"  stroke-opacity="0.52" />
    <circle cx="23.8" cy="16" r="7.2"  stroke-opacity="0.64" />
    <circle cx="21.2" cy="16" r="9.8"  stroke-opacity="0.76" />
    <circle cx="18.6" cy="16" r="12.4"  stroke-opacity="0.88" />
    <circle cx="16" cy="16" r="15"  stroke-opacity="1.00" />
  </g>
</svg>
