<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    g { stroke: #1a1a1a }
    @media (prefers-color-scheme: dark) { g { stroke: #f5f5f5 } }
  </style>
  <!-- A three-bladed aperture: the outer ring plus three chords, each tangent
       to an inner circle of radius 4.5, at 0°, 120° and 240°. The blades stop
       short of each other, so the iris reads as open rather than as a closed
       triangle. -->
  <g stroke-width="2.4" stroke-linecap="round">
    <circle cx="16" cy="16" r="11.5" />
    <path d="M20.5 5.42V26.58" />
    <path d="M4.59 14.61L22.91 25.19" />
    <path d="M22.91 6.81L4.59 17.39" />
  </g>
</svg>
