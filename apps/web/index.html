<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>OpenChat</title>

    <script>
      // Runs before first paint: the theme has to be on <html> by then, or a
      // light-mode reader gets a frame of dark (and the splash below would use
      // the wrong colours). Mirrors the persisted shape of stores/ui-store.
      ;(function () {
        try {
          var stored = JSON.parse(localStorage.getItem('openchat.ui') || '{}')
          var theme = (stored.state && stored.state.theme) || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          // Private mode or blocked storage: fall back to the OS preference.
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark')
          }
        }
      })()
    </script>

    <style>
      /* The splash is inlined rather than imported: it has to paint before any
         stylesheet or module is fetched, which is exactly the gap it covers. */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #ffffff;
        color: #1a1a1a;
        transition: opacity 240ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      html.dark #boot {
        background: #1b1b1b;
        color: #f5f5f5;
      }

      /* Set by main.tsx once React has painted; the element is removed when the
         fade finishes. */
      #boot[data-leaving='true'] {
        opacity: 0;
        pointer-events: none;
      }

      #boot svg {
        width: 44px;
        height: 44px;
      }

      /* The track is tinted through the colour, not through `opacity`:
         opacity applies to the element *and its pseudo-elements*, so it would
         fade the sweeping fill below to the same 12% and leave the bar looking
         static. */
      #boot-bar {
        position: relative;
        width: 160px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in oklab, currentColor 14%, transparent);
      }

      /* An indeterminate sweep, not a fake percentage: how long the bundle
         takes is unknown, and a bar that claims 80% and stalls reads as broken. */
      #boot-bar::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: currentColor;
        animation: boot-sweep 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes boot-sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-bar::after {
          animation: none;
          width: 100%;
        }
        #boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot" role="status" aria-label="Loading OpenChat">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path
          d="M16 4C9.4 4 4 8.9 4 15c0 3.2 1.5 6.1 3.9 8.1L6.6 28l5.3-2.5c1.3.3 2.7.5 4.1.5 6.6 0 12-4.9 12-11S22.6 4 16 4Z"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linejoin="round"
        />
        <path
          d="M11 13.5h10M11 18h6"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
        />
      </svg>
      <div id="boot-bar"></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
