<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No zooming, as in Open WebUI: maximum-scale also stops iOS zooming into
         a field whose text is under 16px when it is focused. iOS ignores the
         rest for pinching, which lib/no-zoom.ts handles. resizes-content
         makes Android shrink the page for the keyboard, so the composer stays
         above it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>OpenChat</title>

    <script>
      // Runs before first paint: the theme has to be on <html> by then, or a
      // light-mode reader gets a frame of dark (and the splash below would use
      // the wrong colours). Mirrors the persisted shape of stores/ui-store.
      ;(function () {
        try {
          var stored = JSON.parse(localStorage.getItem('openchat.ui') || '{}')
          var theme = (stored.state && stored.state.theme) || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          // Private mode or blocked storage: fall back to the OS preference.
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark')
          }
        }
      })()
    </script>

    <style>
      /* The splash is inlined rather than imported: it has to paint before any
         stylesheet or module is fetched, which is exactly the gap it covers. */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        background: #ffffff;
        color: #1a1a1a;
        transition: opacity 240ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      html.dark #boot {
        background: #1b1b1b;
        color: #f5f5f5;
      }

      /* Set by main.tsx once React has painted; the element is removed when the
         fade finishes. */
      #boot[data-leaving='true'] {
        opacity: 0;
        pointer-events: none;
      }

      #boot-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      #boot svg {
        width: 40px;
        height: 40px;
      }

      /* The same stack as --font-sans, so the wordmark does not reflow into a
         different face the moment the app's stylesheet lands. No webfont: the
         splash has to paint before anything is fetched, and a wordmark that
         arrives late is worse than one that never changes.

         Tracked slightly tight — at this size the default spacing reads as a
         label rather than a name. */
      #boot-name {
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.01em;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
      }

      /* The track is tinted through the colour, not through `opacity`:
         opacity applies to the element *and its pseudo-elements*, so it would
         fade the sweeping fill below to the same 12% and leave the bar looking
         static. */
      #boot-bar {
        position: relative;
        width: 160px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in oklab, currentColor 14%, transparent);
      }

      /* An indeterminate sweep, not a fake percentage: how long the bundle
         takes is unknown, and a bar that claims 80% and stalls reads as broken. */
      #boot-bar::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: currentColor;
        animation: boot-sweep 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes boot-sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      /* Softened rather than switched off. The preference is about motion that
         can cause vestibular discomfort — travel, scaling, parallax — and a 3px
         bar easing in place is not that. Killing it outright leaves a loading
         screen that is completely still, which reads as a hung page: worse for
         the reader it was meant to help. So the sweep becomes an opacity pulse,
         which carries no movement at all. */
      @media (prefers-reduced-motion: reduce) {
        #boot-bar::after {
          width: 100%;
          animation: boot-pulse 1.8s ease-in-out infinite;
        }
      }

      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot" role="status" aria-label="Loading OpenChat">
      <div id="boot-lockup">
        <!-- Same mark as public/logo-mark.svg, inline so the splash needs no
             second request before it can paint. Keep the two in step.
             lib/boot.ts no longer holds a copy — it reads this one. -->
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <g stroke="currentColor" stroke-width="1.3">
          <circle cx="29" cy="16" r="2"  stroke-opacity="0.40" />
          <circle cx="26.4" cy="16" r="4.6"  stroke-opacity="0.52" />
          <circle cx="23.8" cy="16" r="7.2"  stroke-opacity="0.64" />
          <circle cx="21.2" cy="16" r="9.8"  stroke-opacity="0.76" />
          <circle cx="18.6" cy="16" r="12.4"  stroke-opacity="0.88" />
          <circle cx="16" cy="16" r="15"  stroke-opacity="1.00" />
          </g>
        </svg>
        <span id="boot-name">OpenChat</span>
      </div>
      <div id="boot-bar" data-motion="essential"></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
